<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Room 306 Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --panel:#F2F2F2; --border:#B5B5B5; --text:#161616; --muted:#5C5C5C;
  --floor:#E9E9E9; --floor-dot:#C6C6C6;
  --paper:#FFFFFF; --paper-edge:#CFCFCF; --art:#F7F7F7; --art-line:#8A8A8A; --desk:#D8D8D8;
  --accent:#9E1B32; --accent-dark:#7A1527; --on-accent:#FFFFFF;
  --fire:#E0761F; --fire-glow:#FFC54D;
  --c1:#2F6FD6; --c2:#D9A33A; --c3:#2E8B57; --c4:#7B4FC9;
  --sans:'Google Sans Flex', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:#333333; --border:#707070; --text:#EDEDED; --muted:#A8A8A8;
    --floor:#161616; --floor-dot:#2E2E2E;
    --paper:#2B2B2B; --paper-edge:#404040; --art:#222222; --art-line:#8C8C8C; --desk:#4A4A4A;
    --accent:#C93A52; --accent-dark:#9E1B32;
    --fire:#F08A34;
    --c1:#5B8FE8; --c2:#E5B65A; --c3:#4CC47E; --c4:#9D7BE0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --panel:#333333; --border:#707070; --text:#EDEDED; --muted:#A8A8A8;
  --floor:#161616; --floor-dot:#2E2E2E;
  --paper:#2B2B2B; --paper-edge:#404040; --art:#222222; --art-line:#8C8C8C; --desk:#4A4A4A;
  --accent:#C93A52; --accent-dark:#9E1B32;
  --fire:#F08A34;
  --c1:#5B8FE8; --c2:#E5B65A; --c3:#4CC47E; --c4:#9D7BE0;
  color-scheme: dark;
}
*,*::before,*::after{ box-sizing:border-box; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body{ margin:0; height:100%; background:var(--panel); color:var(--text); font-family:var(--sans); }
button{ font-family:inherit; }
:focus-visible{ outline:3px solid var(--accent); outline-offset:3px; }
[hidden]{ display:none !important; }

#home{ height:100%; display:flex; flex-direction:column; }

.bar{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--border);
}
.brand{ display:flex; align-items:center; gap:10px; }
.brand-mark{
  width:34px; height:34px; border-radius:50%; border:2px solid var(--accent);
  display:inline-grid; place-items:center; flex-shrink:0;
}
.brand-mark::after{ content:''; width:14px; height:14px; border-radius:50%; background:var(--accent); }
.brand h1{ font-size:24px; font-weight:700; letter-spacing:.01em; margin:0; }
.spacer{ flex:1; }
.btn{
  display:inline-flex; align-items:center; gap:8px;
  background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:6px;
  padding:8px 14px; font-size:14px; font-weight:500; cursor:pointer;
}
.btn:hover{ border-color:var(--text); }
.btn svg{ width:16px; height:16px; }
.eq{ display:inline-flex; align-items:flex-end; gap:2px; width:16px; height:14px; }
.eq i{ flex:1; height:4px; background:var(--muted); border-radius:1px; }
#musicBtn[aria-pressed="true"]{ border-color:var(--accent); }
#musicBtn[aria-pressed="true"] .eq i{ background:var(--accent); animation:eq .9s ease-in-out infinite alternate; }
#musicBtn[aria-pressed="true"] .eq i:nth-child(2){ animation-delay:-.3s; animation-duration:.7s; }
#musicBtn[aria-pressed="true"] .eq i:nth-child(3){ animation-delay:-.6s; animation-duration:1.1s; }
@keyframes eq{ from{ height:3px; } to{ height:14px; } }
@media (prefers-reduced-motion: reduce){ #musicBtn[aria-pressed="true"] .eq i{ animation:none; height:10px; } }

.floor:focus{ outline:none; }
.floor{
  flex:1; min-height:0; overflow:auto;
  background-color:var(--floor);
  background-image:radial-gradient(var(--floor-dot) 1.2px, transparent 1.3px);
  background-size:22px 22px;
  display:flex; flex-direction:column;
  padding:clamp(16px, 3vw, 44px);
  gap:clamp(14px, 2vw, 28px);
}
.prompt{
  margin:0; font-size:clamp(28px, 3.6vw, 56px); font-weight:700; letter-spacing:-.01em; line-height:1.05;
}
.top{ display:flex; align-items:center; justify-content:space-between; gap:14px 28px; flex-wrap:wrap; }
.classes{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.classes-label{ font-size:16px; font-weight:600; color:var(--muted); }
.chips{ display:flex; gap:8px; flex-wrap:wrap; }
.chip{
  display:flex; flex-direction:column; align-items:flex-start; gap:2px;
  min-width:92px; padding:8px 16px; border-radius:10px; cursor:pointer;
  background:var(--paper); color:var(--text); border:1px solid var(--paper-edge);
  box-shadow:0 3px 0 rgba(0,0,0,.35); text-align:left;
}
.chip b{ font-size:16px; font-weight:700; line-height:1.15; }
.chip small{ font-size:13px; color:var(--muted); line-height:1.15; }
.chip:hover{ border-color:var(--text); }
.chip[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.chip[aria-pressed="true"] small{ color:var(--on-accent); opacity:.85; }
.lead{ display:flex; align-items:center; gap:14px 24px; flex-wrap:wrap; }
.modes{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.pill{
  height:46px; padding:0 22px; border-radius:999px; cursor:pointer;
  background:var(--paper); color:var(--text); border:1px solid var(--paper-edge);
  box-shadow:0 3px 0 rgba(0,0,0,.35); font-size:17px; font-weight:600;
}
.pill:hover{ border-color:var(--text); }
.pill.primary{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.pill:disabled{ opacity:.5; cursor:default; }
.tally{ font-size:17px; font-weight:600; color:var(--muted); }
.vote-count{
  position:absolute; top:14px; right:14px; z-index:1;
  min-width:64px; height:64px; padding:0 14px; border-radius:999px;
  display:grid; place-items:center;
  background:var(--accent); color:var(--on-accent); font-size:32px; font-weight:700;
  box-shadow:0 3px 0 rgba(0,0,0,.4);
}
.vote-count.bump{ animation:bump .25s ease-out; }
@keyframes bump{ 0%{ transform:scale(1); } 40%{ transform:scale(1.25); } 100%{ transform:scale(1); } }
.grid.voting .play{ background:var(--text); color:var(--paper); }
.game.lit{ outline:5px solid var(--accent); outline-offset:4px; transform:translateY(-6px); box-shadow:0 10px 0 rgba(0,0,0,.45); }
.game.dim{ opacity:.4; }
.game{ transition:transform .12s ease, box-shadow .12s ease, opacity .25s ease; }
.grid{
  flex:1; min-height:0;
  display:grid; gap:clamp(14px, 2vw, 28px);
  grid-template-columns:repeat(4, minmax(0,1fr));
  grid-auto-rows:1fr auto;
}
@media (max-width:1100px){ .grid{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
@media (max-width:620px){ .grid{ grid-template-columns:1fr; } }

.game{
  position:relative; display:grid; grid-row:span 2; grid-template-rows:subgrid; gap:0; text-align:left;
  background:var(--paper); color:var(--text);
  border:1px solid var(--paper-edge); border-radius:10px;
  box-shadow:0 4px 0 rgba(0,0,0,.45);
  padding:0; overflow:hidden; cursor:pointer;
  min-height:300px;
  transition:transform .12s ease, box-shadow .12s ease;
}
.game:hover{ transform:translateY(-3px); box-shadow:0 7px 0 rgba(0,0,0,.45); }
.game:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.45); }
.game:hover .play{ background:var(--accent-dark); }
.art{
  min-height:120px; background:var(--art); border-bottom:1px solid var(--paper-edge);
  display:grid; place-items:center; padding:clamp(12px, 2vw, 28px);
}
.art svg{ width:100%; height:100%; max-height:240px; display:block; }
.info{ padding:clamp(16px, 1.6vw, 24px); display:flex; justify-content:space-between; flex-direction:column; gap:10px; }
.info h2{ margin:0; font-size:clamp(24px, 2.2vw, 36px); font-weight:700; line-height:1.1; }
.info p{ margin:0; font-size:clamp(16px, 1.25vw, 20px); line-height:1.4; color:var(--muted); max-width:36ch; }
.foot{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:auto; padding-top:6px; }
.key{
  font-size:14px; color:var(--muted);
}
.key kbd{
  font-family:inherit; font-weight:600; font-size:13px; color:var(--text);
  border:1px solid var(--border); border-bottom-width:2px; border-radius:4px; padding:1px 7px; margin-right:4px;
}
.play{
  background:var(--accent); color:var(--on-accent); border-radius:999px;
  padding:10px 22px; font-size:clamp(16px, 1.2vw, 19px); font-weight:600;
}

/* Game view */
#stage{ position:fixed; inset:0; background:var(--panel); z-index:5; }
#stage iframe{ width:100%; height:100%; border:0; display:block; background:var(--panel); }
#back{
  position:fixed; z-index:6;
  left:calc(14px + env(safe-area-inset-left,0px));
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  display:inline-flex; align-items:center; gap:8px;
  height:44px; padding:0 16px 0 10px; border-radius:999px;
  background:var(--paper); color:var(--text); border:2px solid var(--accent);
  font-size:15px; font-weight:600; cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,.4);
  opacity:.6; transition:opacity .15s ease;
}
#back:hover, #back:focus-visible{ opacity:1; }
#back svg{ width:20px; height:20px; color:var(--accent); }

@media (prefers-reduced-motion: reduce){
  .game, #back{ transition:none; }
  .vote-count.bump{ animation:none; }
  .game:hover, .game:active{ transform:none; }
}
</style>
</head>
<body>

<div id="home">
  <header class="bar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><h1>Room 306 Games</h1></div>
    <span class="spacer"></span>
    <button class="btn" id="seatBtn" type="button" title="Teacher tool">
      <svg viewBox="0 0 16 16" aria-hidden="true" fill="currentColor"><rect x="1" y="2" width="4" height="3" rx=".6"/><rect x="6" y="2" width="4" height="3" rx=".6"/><rect x="11" y="2" width="4" height="3" rx=".6"/><rect x="1" y="7" width="4" height="3" rx=".6"/><rect x="6" y="7" width="4" height="3" rx=".6"/><rect x="11" y="7" width="4" height="3" rx=".6"/><rect x="4" y="12" width="8" height="2.5" rx=".6"/></svg>
      Seating chart
    </button>
    <button class="btn" id="musicBtn" type="button" aria-pressed="false">
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
      <span id="musicLabel">Music off</span>
    </button>
    <button class="btn" id="fsBtn" type="button">
      <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>
      <span id="fsLabel">Full screen</span>
    </button>
  </header>

  <main class="floor" id="floor" tabindex="-1">
    <div class="top">
      <div class="lead">
        <p class="prompt" id="prompt" aria-live="polite">Pick a game</p>
        <div class="modes" id="modes"></div>
      </div>
      <div class="classes" role="group" aria-labelledby="classLabel">
        <span class="classes-label" id="classLabel">Class</span>
        <div class="chips" id="chips"></div>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<div id="stage" hidden>
  <iframe id="frame" title="Game" allow="fullscreen; autoplay"></iframe>
</div>
<button id="back" type="button" hidden aria-label="Back to all games">
  <svg viewBox="0 0 20 20" aria-hidden="true" fill="currentColor"><rect x="2" y="2" width="7" height="7" rx="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5"/></svg>
  All games
</button>

<script>
/* Room 306 dashboard theme: an original synthwave loop built with Web Audio.
   makeSynthwave(ctx, out) returns schedule(step, time), one call per 16th note. */
function makeSynthwave(ctx, out){
  const BPM = 112, SIXTEENTH = 60 / BPM / 4;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  // Am, F, C, G: one chord per bar
  const CHORDS = [
    { root:45, tones:[57,60,64,69] },
    { root:41, tones:[53,57,60,65] },
    { root:48, tones:[55,60,64,67] },
    { root:43, tones:[55,59,62,67] }
  ];
  // Lead: [step within 4 bars, midi note, length in 16ths]
  const PHRASE = [[0,76,4],[4,74,2],[6,72,2],[8,69,6],[14,72,2],
                  [16,72,4],[20,74,2],[22,76,2],[24,77,4],[28,76,4],
                  [32,79,6],[38,76,2],[40,72,4],[44,74,2],[46,76,2]];
  const LEAD_A = PHRASE.concat([[48,74,8],[56,71,4],[60,74,4]]);
  const LEAD_B = PHRASE.concat([[48,74,4],[52,71,4],[56,74,2],[58,76,6]]);
  const ARP = [0,1,2,3,2,1,2,3, 0,1,2,3,3,2,1,2];

  // Buses: a pumping bus for pads and arp, an echo, and a big reverb for the snare
  const pump = ctx.createGain(); pump.connect(out);
  const echo = ctx.createDelay(1); echo.delayTime.value = SIXTEENTH * 3;
  const echoFb = ctx.createGain(); echoFb.gain.value = 0.32;
  const echoTone = ctx.createBiquadFilter(); echoTone.type = 'lowpass'; echoTone.frequency.value = 2600;
  const echoOut = ctx.createGain(); echoOut.gain.value = 0.28;
  echo.connect(echoTone); echoTone.connect(echoFb); echoFb.connect(echo); echoTone.connect(echoOut); echoOut.connect(out);
  const verb = ctx.createConvolver();
  const len = Math.floor(ctx.sampleRate * 1.8), ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for(let c = 0; c < 2; c++){ const d = ir.getChannelData(c); for(let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1) * Math.pow(1 - i/len, 3); }
  verb.buffer = ir;
  const verbOut = ctx.createGain(); verbOut.gain.value = 0.3; verb.connect(verbOut); verbOut.connect(out);
  const noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  { const d = noise.getChannelData(0); for(let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }

  function env(t, peak, attack, hold, release){
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t + attack);
    g.gain.setValueAtTime(peak, t + attack + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + hold + release);
    return g;
  }
  function tone(type, freq, t, dur, detune){
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = freq; o.detune.value = detune || 0;
    o.start(t); o.stop(t + dur + 0.05); return o;
  }

  function kick(t){
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    const g = env(t, 0.95, 0.002, 0.02, 0.32);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.4);
    pump.gain.setValueAtTime(0.3, t); pump.gain.linearRampToValueAtTime(1, t + SIXTEENTH * 3);
  }
  function snare(t){
    const n = ctx.createBufferSource(); n.buffer = noise;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1900; bp.Q.value = 0.7;
    const g = env(t, 0.45, 0.002, 0.01, 0.2);
    n.connect(bp); bp.connect(g); g.connect(out);
    const send = ctx.createGain(); send.gain.value = 0.9; g.connect(send); send.connect(verb);
    n.start(t); n.stop(t + 0.3);
    const b = tone('triangle', 190, t, 0.12); const bg = env(t, 0.3, 0.002, 0.01, 0.1); b.connect(bg); bg.connect(out);
  }
  function hat(t, open){
    const n = ctx.createBufferSource(); n.buffer = noise;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7500;
    const g = env(t, open ? 0.09 : 0.06, 0.001, 0.005, open ? 0.16 : 0.04);
    n.connect(hp); hp.connect(g); g.connect(out); n.start(t); n.stop(t + 0.25);
  }
  function bass(note, t){
    const o = tone('sawtooth', mtof(note), t, SIXTEENTH);
    const s = tone('square', mtof(note - 12), t, SIXTEENTH);
    const sg = ctx.createGain(); sg.gain.value = 0.5; s.connect(sg);
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 4;
    f.frequency.setValueAtTime(1400, t); f.frequency.exponentialRampToValueAtTime(260, t + SIXTEENTH * 0.9);
    const g = env(t, 0.22, 0.003, SIXTEENTH * 0.5, SIXTEENTH * 0.4);
    o.connect(f); sg.connect(f); f.connect(g); g.connect(out);
  }
  function pad(tones, t, dur){
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1500;
    const g = env(t, 0.05, 0.25, dur - 0.4, 0.4);
    f.connect(g); g.connect(pump);
    tones.slice(0, 3).forEach(n => {
      tone('sawtooth', mtof(n), t, dur, -8).connect(f);
      tone('sawtooth', mtof(n), t, dur, 8).connect(f);
    });
  }
  function arp(note, t){
    const o = tone('square', mtof(note), t, SIXTEENTH);
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 3200;
    const g = env(t, 0.055, 0.003, 0.03, 0.09);
    o.connect(f); f.connect(g); g.connect(pump); g.connect(echo);
  }
  function lead(note, t, dur){
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 3400;
    const g = env(t, 0.075, 0.02, Math.max(0.01, dur - 0.08), 0.18);
    const lfo = ctx.createOscillator(); lfo.frequency.value = 5.5;
    const depth = ctx.createGain(); depth.gain.setValueAtTime(0, t); depth.gain.linearRampToValueAtTime(9, t + Math.min(0.3, dur));
    lfo.connect(depth); lfo.start(t); lfo.stop(t + dur + 0.3);
    [-9, 9].forEach(d => { const o = tone('sawtooth', mtof(note), t, dur + 0.2, d); depth.connect(o.detune); o.connect(f); });
    f.connect(g); g.connect(out);
    const s1 = ctx.createGain(); s1.gain.value = 0.9; g.connect(s1); s1.connect(echo);
    const s2 = ctx.createGain(); s2.gain.value = 0.4; g.connect(s2); s2.connect(verb);
  }

  // 16-bar song: bars 0-7 groove, bars 8-15 add the lead. First two bars ever are an intro.
  return function schedule(step, t){
    const bar = Math.floor(step / 16), s = step % 16;
    const chord = CHORDS[bar % 4], section = bar % 16, intro = bar < 2;
    if(s === 0) pad(chord.tones, t, SIXTEENTH * 16);
    arp(chord.tones[ARP[s]] + 12, t);
    if(intro) return;
    bass(s % 4 === 2 ? chord.root + 12 : chord.root, t);
    if(s % 8 === 0) kick(t);
    if(s === 10 && bar % 2 === 1) kick(t);
    if(s === 4 || s === 12) snare(t);
    if(s % 2 === 0) hat(t, s % 4 === 2);
    if(section >= 8){
      const phrase = section < 12 ? LEAD_A : LEAD_B;
      const local = (section % 4) * 16 + s;
      phrase.forEach(([at, note, n]) => { if(at === local) lead(note, t, n * SIXTEENTH); });
    }
  };
}

<script type="application/json" id="gameData">{"306_Seating_Chart.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>Seating Chart\u003c/title>\n\u003cstyle>\n  @import url('https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');\n\n:root{\n  --blueprint-bg: #121212;      /* Black — canvas background */\n  --blueprint-line: #333333;    /* Dark Gray — minor grid lines */\n  --blueprint-line-strong: #707070; /* Medium Gray — major grid lines & desk borders */\n  --paper: #D9D9D9;             /* Light Gray — nameplate/card background */\n  --paper-shadow: rgba(0,0,0,0.35);\n  --ink: #121212;               /* Black — text on light backgrounds */\n  --accent: #9E1B32;            /* Crimson — primary actions & highlights */\n  --accent-dark: #7A1527;       /* Darker crimson — hover state */\n  --danger: #7A1527;            /* Darker crimson — remove/unassign actions */\n  --panel-bg: #333333;          /* Dark Gray — header/toolbar/sidebar */\n  --panel-border: #707070;      /* Medium Gray — borders */\n  --text-light: #EDEDED;        /* Near-white — text on dark backgrounds */\n  --text-muted: #A8A8A8;        /* Medium-light gray — secondary text */\n  --tile: #2B2B2B;              /* Empty desk tile */\n  --tile-edge: #404040;         /* Empty desk outline */\n  --tile-num: #8C8C8C;          /* Station number on an empty desk */\n  --floor: #161616;             /* Room floor */\n  --field-bg: #1C1C1C;          /* Text boxes and lists inside pop-ups */\n  --danger-text: #F2B8C2;       /* Light crimson — text on destructive buttons */\n}\n\n  * { box-sizing: border-box; }\n  html,body { height:100%; }\n  body{\n    margin:0;\n    font-family:'Google Sans Flex', system-ui, sans-serif;\n    background: var(--panel-bg);\n    color: var(--text-light);\n    height:100vh;\n    display:flex;\n    flex-direction:column;\n    overflow:hidden;\n  }\n  button{ font-family: inherit; }\n  button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible, [tabindex]:focus-visible {\n    outline: 2px solid var(--accent);\n    outline-offset: 2px;\n  }\n\n  .app{ display:flex; flex-direction:column; height:100%; }\n\n  /* ---------- Topbar ---------- */\n  .topbar{\n    display:flex; align-items:center; justify-content:space-between;\n    padding: 14px 20px;\n    background: var(--panel-bg);\n    border-bottom:1px solid var(--panel-border);\n    flex-wrap:wrap;\n    gap:10px;\n  }\n  .brand{ display:flex; align-items:center; gap:10px; }\n  .brand-mark{\n    width:34px; height:34px; border-radius:50%;\n    border:2px solid var(--accent);\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    /* color: var(--accent); */\n    flex-shrink:0;\n    line-height: 1; /* Prevents the vertical font leading from pushing it down */\n  }\n  .brand h1{\n    font-family:'Google Sans Flex', system-ui, sans-serif;\n    font-size:24px; font-weight:700; letter-spacing:.01em;\n    margin:0; color:var(--text-light);\n  }\n  .class-controls{ display:flex; align-items:center; gap:8px; }\n  select#classSelect{\n    background: var(--panel-bg);\n    color: var(--text-light);\n    border:1px solid var(--panel-border);\n    border-radius:6px;\n    padding:8px 10px;\n    font-size:14px;\n    font-family:'Google Sans Flex', system-ui, sans-serif;\n    max-width:180px;\n  }\n\n  .btn{\n    background: var(--panel-bg);\n    color: var(--text-light);\n    border:1px solid var(--panel-border);\n    border-radius:6px;\n    padding:8px 12px;\n    font-size:13px;\n    cursor:pointer;\n    white-space:nowrap;\n    transition: background .15s ease, border-color .15s ease;\n  }\n  .btn:hover{ border-color: var(--accent); }\n  .btn.primary{ background: var(--accent); border-color: var(--accent); color:#FFFFFF; font-weight:600; }\n  .btn.primary:hover{ background: var(--accent-dark); border-color: var(--accent-dark); }\n  .btn.danger{ color: var(--danger-text); border-color: var(--accent); }\n  .btn.danger:hover{ background: var(--accent); color:#FFFFFF; }\n  .btn.danger:hover{ border-color: var(--danger); }\n  .btn.active{ background: var(--accent); border-color: var(--accent); color: #FFF; }\n\n  /* ---------- Toolbar ---------- */\n  .toolbar{\n    display:flex; align-items:center; gap:8px; flex-wrap:wrap;\n    padding: 10px 20px;\n    background: var(--panel-bg);\n    border-bottom:1px solid var(--panel-border);\n  }\n  .toolbar .spacer{ flex:1; }\n  .deskCount{\n    font-family:'IBM Plex Mono', monospace;\n    font-size:12px;\n    color: var(--text-muted);\n    letter-spacing:.02em;\n  }\n\n  /* ---------- Workspace ---------- */\n  .workspace{\n    flex:1;\n    display:flex;\n    min-height:0;\n  }\n  .canvas-wrap{\n    flex:1;\n    overflow:auto;\n    position:relative;\n  }\n  .canvas{\n    position:relative;\n    min-width:1650px;\n    min-height:950px;\n    width:max-content;\n    transition: transform 0.25s ease;\n    background-color: var(--floor);\n    background-image: radial-gradient(circle, #2E2E2E 1px, transparent 1.4px);\n    background-size: 25px 25px;\n  }\n  .canvas-empty-msg{\n    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);\n    color: var(--blueprint-line-strong);\n    font-family:'IBM Plex Mono', monospace;\n    font-size:14px;\n    text-align:center;\n    border:1px dashed var(--blueprint-line-strong);\n    padding:18px 26px;\n    border-radius:6px;\n    pointer-events:none;\n  }\n\n  /* ---------- Desks ---------- */\n  .desk{\n    position:absolute;\n    width:130px;\n    height:84px;\n    border-radius:6px;\n    background: var(--tile);\n    box-shadow: inset 0 0 0 1px var(--tile-edge), 0 3px 0 rgba(0,0,0,.55);\n  }\n  .desk:hover{ box-shadow: inset 0 0 0 1px var(--text-muted), 0 3px 0 rgba(0,0,0,.55); }\n  .desk.occupied{\n    background: var(--paper);\n    box-shadow: inset 0 0 0 1px #BDBDBD, 0 3px 0 rgba(0,0,0,.55);\n  }\n  .desk.occupied:hover{ box-shadow: inset 0 0 0 2px var(--accent), 0 3px 0 rgba(0,0,0,.55); }\n  .desk.occupied::before{\n    content:'';\n    position:absolute; left:0; top:0; bottom:0;\n    width:6px;\n    background: var(--accent);\n    border-radius:6px 0 0 6px;\n    z-index:2;\n    pointer-events:none;\n  }\n\n  /* Station number, bottom-right like the Switchboard map */\n  .desk-number{\n    position:absolute; right:7px; bottom:4px;\n    font-family:'IBM Plex Mono', monospace;\n    font-weight:500;\n    font-size:14px;\n    color: var(--tile-num);\n    z-index:2;\n    pointer-events:none;\n  }\n  .desk.occupied .desk-number{ color:#7A7A7A; font-size:12px; }\n\n  /* Move/remove strip — appears on hover so the tile stays solid */\n  .desk-handle{\n    position:absolute; top:0; left:0; right:0;\n    height:20px;\n    background: rgba(18,18,18,.85);\n    border-radius:6px 6px 0 0;\n    display:flex; align-items:center; justify-content:space-between;\n    padding:0 4px 0 8px;\n    cursor:grab;\n    touch-action:none;\n    user-select:none;\n    opacity:0;\n    transition: opacity .12s ease;\n    z-index:3;\n  }\n  .desk:hover .desk-handle, .desk:focus-within .desk-handle{ opacity:1; }\n  @media (hover: none){ .desk-handle{ opacity:1; } }\n  .desk-handle:active{ cursor:grabbing; }\n  .desk-dots{ color: rgba(255,255,255,0.6); font-size:11px; letter-spacing:1px; }\n  .desk-actions{ display:flex; align-items:center; gap:4px; }\n  .desk-unseat{\n    background:none;\n    border:1px solid #6A6A6A;\n    color:#E0E0E0;\n    font-size:10px;\n    line-height:1;\n    padding:2px 6px;\n    border-radius:3px;\n    cursor:pointer;\n  }\n  .desk-unseat:hover{ background: var(--accent); border-color: var(--accent); color:#fff; }\n  .desk-remove{\n    background:none; border:none; color: rgba(255,255,255,0.75);\n    font-size:15px; line-height:1; cursor:pointer; padding:0 2px;\n  }\n  .desk-remove:hover{ color:#fff; }\n\n  .desk-body{\n    position:absolute; inset:0;\n    border-radius:6px;\n    display:flex; align-items:center; justify-content:center;\n    padding:6px 10px 16px 14px;\n    cursor:grab;\n    transition: background .12s ease, box-shadow .12s ease;\n    z-index:1;\n  }\n  .desk-body.drag-over{\n    background: rgba(158,27,50,0.28);\n    box-shadow: inset 0 0 0 2px var(--accent);\n  }\n  .desk-empty-label{\n    color:#585858;\n    display:flex; align-items:center; justify-content:center;\n    pointer-events:none;\n  }\n  .desk-empty-label svg{ display:block; }\n\n  /* Locked layout: desks can't move, but Unseat still works */\n  .app.layout-locked .desk-body{ cursor:default; }\n  .app.layout-locked .desk-handle{ cursor:default; justify-content:flex-end; }\n  .app.layout-locked .desk-dots{ display:none; }\n  .app.layout-locked #addDeskBtn, .app.layout-locked #duplicateBtn{ display:none; }\n  .app.layout-locked .desk:not(.occupied) .desk-handle{ display:none; }\n  .app.layout-locked .desk:not(.occupied):hover{ box-shadow: inset 0 0 0 1px var(--tile-edge), 0 3px 0 rgba(0,0,0,.55); }\n  .btn:disabled{ opacity:.4; cursor:not-allowed; }\n  .btn:disabled:hover{ border-color: var(--panel-border); }\n  .btn.primary:disabled:hover{ background: var(--accent); border-color: var(--accent); }\n  #lockBtn.unlocked{ border-color: var(--accent); color: var(--danger-text); }\n\n  /* Teacher desk: fixed, can't be assigned */\n  .teacher-desk{\n    position:absolute;\n    border-radius:6px;\n    background: var(--tile);\n    box-shadow: inset 0 0 0 2px var(--accent), 0 3px 0 rgba(0,0,0,.55);\n    display:flex; flex-direction:column; align-items:center; justify-content:center;\n    gap:8px;\n    color: var(--text-muted);\n    pointer-events:none;\n    user-select:none;\n  }\n  .teacher-desk svg{ width:34px; height:34px; }\n  .teacher-desk-label{\n    font-family:'Google Sans Flex', system-ui, sans-serif;\n    font-weight:600;\n    font-size:15px;\n    color: var(--text-light);\n  }\n\n  /* Name fills the tile: first name big, rest of name underneath */\n  .nameplate{\n    width:100%; height:100%;\n    display:flex; flex-direction:column; justify-content:center; align-items:flex-start;\n    gap:2px;\n    cursor:grab;\n    color: var(--ink);\n    text-align:left;\n    overflow:hidden;\n  }\n  .nameplate:active{ cursor:grabbing; }\n  .np-first{\n    font-family:'Google Sans Flex', system-ui, sans-serif;\n    font-weight:700;\n    font-size:20px;\n    line-height:1.05;\n    letter-spacing:0;\n    max-width:100%;\n    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\n  }\n  .np-last{\n    font-size:12px;\n    font-weight:500;\n    color:#4A4A4A;\n    line-height:1.15;\n    max-width:100%;\n    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;\n    overflow:hidden;\n  }\n\n  /* ---------- Title block ---------- */\n  .title-block {\n    position: absolute;\n    top: 16px;\n    left: 16px;\n    background: rgba(217, 217, 217, 0.95);\n    border: 1px solid var(--blueprint-line-strong);\n    border-radius: 4px;\n    padding: 8px 12px;\n    min-width: 170px;\n    transition: all 0.2s ease-in-out;\n    z-index: 10;\n  }\n  .tb-row{ display:flex; justify-content:space-between; gap:14px; font-size:12px; padding:2px 0; }\n  .tb-label{\n    font-family:'IBM Plex Mono', monospace;\n    color:#5a5a5a;\n    letter-spacing:.05em;\n    text-transform:uppercase;\n    font-size:10px;\n    align-self:center;\n  }\n  .tb-row span:last-child{ color: var(--ink); font-weight:600; }\n\n  /* ---------- Roster panel ---------- */\n  .roster-panel{\n    width:230px;\n    flex-shrink:0;\n    background: var(--panel-bg);\n    border-left:1px solid var(--panel-border);\n    padding:16px;\n    overflow-y:auto;\n    transition: margin-right 0.2s ease;\n  }\n  .roster-panel h2{\n    font-family:'Google Sans Flex', system-ui, sans-serif;\n    font-size:14px;\n    margin:0 0 12px 0;\n    color: var(--text-light);\n    display:flex; align-items:center; gap:6px;\n  }\n  #unassignedCount, #droppedCount{\n    font-family:'IBM Plex Mono', monospace;\n    font-size:11px;\n    color: var(--text-muted);\n    font-weight:400;\n  }\n  .roster-list{\n    min-height:60px;\n    border-radius:6px;\n    padding:4px;\n    transition: background .12s ease;\n  }\n  .roster-list.drag-over{ background: rgba(158,27,50,0.18); }\n  .roster-chip{\n    background: var(--paper);\n    color: var(--ink);\n    padding:8px 10px;\n    border-radius:5px;\n    border-left:5px solid var(--accent);\n    font-weight:500;\n    margin-bottom:7px;\n    font-size:14px;\n    cursor:grab;\n    box-shadow:0 1px 3px rgba(0,0,0,.25);\n  }\n  .roster-chip:active{ cursor:grabbing; }\n  .dropped-section{\n    margin-top:18px;\n    padding-top:14px;\n    border-top:1px solid var(--panel-border);\n  }\n  .roster-chip.dropped{\n    background: var(--tile);\n    color: var(--text-muted);\n    border-left-color: #6A6A6A;\n    box-shadow:none;\n    font-weight:400;\n  }\n  .dropped-list.drag-over{ background: rgba(255,255,255,0.06); }\n  .nameplate, .roster-chip{ touch-action:none; user-select:none; -webkit-user-select:none; }\n  .drag-source{ opacity:.35; }\n  body.name-dragging, body.name-dragging *{ cursor:grabbing !important; }\n  .drag-ghost{\n    position:fixed;\n    z-index:1000;\n    pointer-events:none;\n    transform: translate(-50%, -50%) rotate(-3deg);\n    background: var(--paper);\n    color: var(--ink);\n    border-left:5px solid var(--accent);\n    border-radius:5px;\n    padding:9px 12px;\n    font-family:'Google Sans Flex', system-ui, sans-serif;\n    font-weight:600;\n    font-size:15px;\n    white-space:nowrap;\n    box-shadow:0 10px 24px rgba(0,0,0,.5);\n  }\n  .roster-empty{\n    color: var(--text-muted);\n    font-size:12.5px;\n    font-style:italic;\n    padding:8px 4px;\n  }\n\n/* ---------- FULLSCREEN/PRESENTATION MODE OVERRIDES ---------- */\n  .app.presentation-mode .topbar,\n  .app.presentation-mode .toolbar,\n  .app.presentation-mode .roster-panel {\n    display: none !important;\n  }\n  .app.presentation-mode .desk-handle { display:none; }\n  .app.presentation-mode .desk-body { cursor:default; }\n  .app.presentation-mode .workspace {\n    position: relative;\n    flex-direction: column; /* Stacks the dashboard bar on top of the canvas */\n  }\n  \n  /* Transform the title-block into a clean top dashboard bar */\n  .app.presentation-mode .title-block {\n    position: sticky; /* Switched from fixed to sticky to naturally push content down */\n    top: 0;\n    left: 0;\n    right: 0;\n    bottom: auto;\n    width: 100%;\n    border-radius: 0;\n    border: none;\n    border-bottom: 2px solid var(--blueprint-line-strong);\n    background: var(--paper);\n    display: flex;\n    justify-content: flex-start;\n    align-items: center;\n    padding: 10px 20px;\n    box-shadow: 0 4px 10px rgba(0,0,0,0.4);\n    gap: 40px;\n    z-index: 100; /* Stays firmly on top during scroll/zooms */\n  }\n  \n  .app.presentation-mode .title-block .tb-row {\n    font-size: 15px;\n    gap: 8px;\n    padding: 0;\n  }\n  .app.presentation-mode .title-block .tb-label {\n    font-size: 11px;\n  }\n\n  /* Move the toggle view button dynamically into the title bar container */\n  .app.presentation-mode #toggleViewBtn {\n    margin-left: auto; /* Pushes the toggle button all the way to the right side */\n    background: var(--accent);\n    color: #FFF;\n    border-color: var(--accent);\n    font-weight: 600;\n  }\n  .app.presentation-mode #toggleViewBtn:hover {\n    background: var(--accent-dark);\n    border-color: var(--accent-dark);\n  }\n  \n  .app.presentation-mode .canvas-wrap {\n    margin-top: 0;\n    overflow: hidden;\n    flex: 1;\n    background-color: var(--floor);\n  }\n\n  /* ---------- Modal ---------- */\n  .modal-overlay{\n    display:none;\n    position:fixed; inset:0;\n    background: rgba(0,0,0,0.7);\n    backdrop-filter: blur(2px);\n    -webkit-backdrop-filter: blur(2px);\n    align-items:center; justify-content:center;\n    z-index:50;\n    padding:20px;\n  }\n  .modal-overlay.show{ display:flex; }\n  .modal{\n    background: var(--panel-bg);\n    border:1px solid var(--panel-border);\n    border-top:4px solid var(--accent);\n    border-radius:10px;\n    padding:22px;\n    width:100%; max-width:420px;\n    box-shadow:0 20px 50px rgba(0,0,0,.6);\n  }\n  .modal p code{\n    font-family:'IBM Plex Mono', monospace;\n    font-size:12px;\n    background: var(--field-bg);\n    color: var(--text-light);\n    padding:1px 5px;\n    border-radius:3px;\n  }\n  .modal h3{ margin:0 0 6px 0; font-family:'Google Sans Flex', system-ui, sans-serif; font-size:17px; }\n  .modal p{ margin:0 0 12px 0; font-size:13px; color: var(--text-muted); }\n  .modal textarea, .modal input[type=\"text\"]{\n    width:100%;\n    background: var(--field-bg);\n    border:1px solid var(--panel-border);\n    color: var(--text-light);\n    border-radius:6px;\n    padding:10px;\n    font-family:'Google Sans Flex', system-ui, sans-serif;\n    font-size:14px;\n    resize:vertical;\n  }\n  .modal textarea{ min-height:160px; line-height:1.5; }\n  .modal select{\n    width:100%;\n    background: var(--field-bg);\n    border:1px solid var(--panel-border);\n    color: var(--text-light);\n    border-radius:6px;\n    padding:9px 10px;\n    font-family:'Google Sans Flex', system-ui, sans-serif;\n    font-size:14px;\n  }\n  .modal textarea:focus, .modal input[type=\"text\"]:focus, .modal select:focus, .export-textarea:focus{\n    border-color: var(--accent);\n    outline:none;\n  }\n  .modal ::placeholder{ color:#6E6E6E; }\n  .modal .field-label{\n    display:block; margin:12px 0 6px; font-size:12px; color: var(--text-muted);\n  }\n  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }\n  .dup-list{ display:flex; flex-direction:column; gap:8px; max-height:220px; overflow-y:auto; }\n  .dup-option{\n    display:flex; align-items:center; gap:8px;\n    background: var( one !important; }\n    .app.presentation-mode .topbar{ display:flex !important; }\n    .brand h1{ color:#111; }\n\n    /* Class / seated / date as a single line under the title */\n    .title-block, .app.presentation-mode .title-block{\n      position:static !important;\n      display:flex !important; gap:28px; align-items:center;\n      width:auto; min-width:0;\n      background:none !important;\n      border:none !important; border-bottom:1px solid #999 !important;\n      border-radius:0;\n      box-shadow:none !important;\n      padding:0 0 6px !important;\n      margin:0 0 12px;\n    }\n    .title-block .tb-row{ font-size:13px; gap:8px; }\n    .title-block .btn{ display:none !important; }\n\n    .canvas-wrap, .app.presentation-mode .canvas-wrap{ overflow:hidden !important; flex:none; background:#fff; margin:0 auto; }\n    .canvas{ min-width:0 !important; min-height:0 !important; background:#fff !important; transition:none !important; }\n    .desk, .desk.occupied{ box-shadow: inset 0 0 0 1px #999; }\n    .desk.occupied{ background:#F2F2F2; }\n    .desk-handle, .drag-ghost{ display:none !important; }\n    .teacher-desk{ box-shadow: inset 0 0 0 2px #555; }\n    .teacher-desk-label{ color:#111; }\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"app layout-locked\" id=\"appWrapper\">\n\n  \u003cheader class=\"topbar\">\n    \u003cdiv class=\"brand\">\n      \u003cspan class=\"brand-mark\">☷\u003c/span>\n      \u003ch1>306 Seating Chart\u003c/h1>\n    \u003c/div>\n    \u003cdiv class=\"class-controls\">\n      \u003cselect id=\"classSelect\" aria-label=\"Select class\">\u003c/select>\n      \u003cbutton class=\"btn\" id=\"newClassBtn\">+ New Class\u003c/button>\n    \u003c/div>\n  \u003c/header>\n\n  \u003cdiv class=\"toolbar\" id=\"mainToolbar\">\n    \u003cbutton class=\"btn\" id=\"lockBtn\" aria-pressed=\"true\" title=\"Unlock to move or add desks\">🔒 Layout Locked\u003c/button>\n    \u003cbutton class=\"btn primary\" id=\"addDeskBtn\">+ Add Desk\u003c/button>\n    \u003cbutton class=\"btn\" id=\"shuffleBtn\">Shuffle Seats\u003c/button>\n    \u003cbutton class=\"btn\" id=\"clearSeatsBtn\">Clear Seats\u003c/button>\n    \u003cbutton class=\"btn\" id=\"importBtn\">Import Roster\u003c/button>\n    \u003cbutton class=\"btn\" id=\"clearRosterBtn\">Clear Roster\u003c/button>\n    \u003cbutton class=\"btn\" id=\"duplicateBtn\">Duplicate Layout\u003c/button>\n    \u003cbutton class=\"btn\" id=\"setupImportBtn\">Import Setup\u003c/button>\n    \u003cbutton class=\"btn\" id=\"exportBtn\">Export Setup\u003c/button>\n    \u003cbutton class=\"btn\" id=\"printBtn\">Print\u003c/button>\n    \u003cbutton class=\"btn\" id=\"toggleViewBtn\">📺 Fullscreen View\u003c/button>\n    \u003cdiv class=\"spacer\">\u003c/div>\n    \u003cspan class=\"save-status\" id=\"saveStatus\" aria-live=\"polite\">\u003c/span>\n    \u003cspan class=\"deskCount\" id=\"deskCountLabel\">\u003c/span>\n  \u003c/div>\n\n  \u003cdiv class=\"workspace\">\n    \u003cdiv class=\"canvas-wrap\">\n      \u003cdiv class=\"canvas\" id=\"canvas\">\n      \u003c/div>\n      \u003cdiv class=\"title-block\" id=\"titleBlock\">\n        \u003cdiv class=\"tb-row\">\u003cspan class=\"tb-label\">Class\u003c/span>\u003cspan id=\"tbClass\">—\u003c/span>\u003c/div>\n        \u003cdiv class=\"tb-row\">\u003cspan class=\"tb-label\">Seated\u003c/span>\u003cspan id=\"tbSeats\">0 / 0\u003c/span>\u003c/div>\n        \u003cdiv class=\"tb-row\">\u003cspan class=\"tb-label\">Date\u003c/span>\u003cspan id=\"tbDate\">—\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003caside class=\"roster-panel\">\n      \u003ch2>Unassigned \u003cspan id=\"unassignedCount\">\u003c/span>\u003c/h2>\n      \u003cdiv class=\"roster-list\" id=\"rosterList\">\u003c/div>\n      \u003cdiv class=\"dropped-section\" id=\"droppedSection\">\n        \u003ch2>Dropped \u003cspan id=\"droppedCount\">\u003c/span>\u003c/h2>\n        \u003cdiv class=\"roster-list dropped-list\" id=\"droppedList\">\u003c/div>\n      \u003c/div>\n    \u003c/aside>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- New Class Modal -->\n\u003cdiv class=\"modal-overlay\" id=\"newClassModal\">\n  \u003cdiv class=\"modal\">\n    \u003ch3>New Class\u003c/h3>\n    \u003cp>Give this class or period a name.\u003c/p>\n    \u003cinput type=\"text\" id=\"newClassInput\" placeholder=\"e.g. Period 3 — Science\">\n    \u003clabel class=\"field-label\" for=\"copyLayoutSelect\">Copy desk layout from\u003c/label>\n    \u003cselect id=\"copyLayoutSelect\">\u003c/select>\n    \u003cdiv class=\"modal-actions\">\n      \u003cbutton class=\"btn\" id=\"newClassCancel\">Cancel\u003c/button>\n      \u003cbutton class=\"btn primary\" id=\"newClassConfirm\">Create\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- Import Roster Modal -->\n\u003cdiv class=\"modal-overlay\" id=\"importModal\">\n  \u003cdiv class=\"modal\">\n    \u003ch3>Import Roster\u003c/h3>\n    \u003cp>One student name per line. This replaces the current roster for this class — students removed here will be unseated. Dropped students stay in the Dropped list unless you add their name here.\u003c/p>\n    \u003ctextarea id=\"rosterTextarea\" placeholder=\"Alicia Chen\nMarcus Reed\nPriya Nair\n...\">\u003c/textarea>\n    \u003cdiv class=\"modal-actions\">\n      \u003cbutton class=\"btn\" id=\"importCancel\">Cancel\u003c/button>\n      \u003cbutton class=\"btn primary\" id=\"importConfirm\">Import\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- Duplicate Layout Modal -->\n\u003cdiv class=\"modal-overlay\" id=\"duplicateModal\">\n  \u003cdiv class=\"modal\">\n    \u003ch3>Duplicate Layout\u003c/h3>\n    \u003cp>Copy this class's desk positions (empty of names) into other classes. This overwrites their current desk layout — their rosters and seat assignments are untouched.\u003c/p>\n    \u003cdiv class=\"dup-list\" id=\"duplicateClassList\">\u003c/div>\n    \u003cdiv class=\"modal-actions\">\n      \u003cbutton class=\"btn\" id=\"duplicateCancel\">Cancel\u003c/button>\n      \u003cbutton class=\"btn primary\" id=\"duplicateConfirm\">Copy Layout\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- Import Setup Modal -->\n\u003cdiv class=\"modal-overlay\" id=\"setupModal\">\n  \u003cdiv class=\"modal\" style=\"max-width:560px;\">\n    \u003ch3>Import Setup\u003c/h3>\n    \u003cp>Paste a \u003ccode>CLASS_DATA\u003c/code> setup from Export Setup, or a whole seating chart file. Each class in the paste replaces the class with the same name here, including its roster, desks and seats. Classes that aren’t in the paste stay as they are.\u003c/p>\n    \u003ctextarea class=\"export-textarea\" id=\"setupTextarea\" spellcheck=\"false\" placeholder=\"const CLASS_DATA = { ... };\">\u003c/textarea>\n    \u003cp id=\"setupError\" role=\"alert\" style=\"color:var(--accent);margin:10px 0 0 0;\" hidden>\u003c/p>\n    \u003cdiv class=\"modal-actions\">\n      \u003cbutton class=\"btn\" id=\"setupCancel\">Cancel\u003c/button>\n      \u003cbutton class=\"btn primary\" id=\"setupConfirm\">Import\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- Export Setup Modal -->\n\u003cdiv class=\"modal-overlay\" id=\"exportModal\">\n  \u003cdiv class=\"modal\" style=\"max-width:560px;\">\n    \u003ch3>Export Setup\u003c/h3>\n    \u003cp>Your changes save automatically in this browser, and every game uses this chart. Copy this to keep a backup or move your setup to another computer or browser. To bring it back, paste it into Import Setup.\u003c/p>\n    \u003ctextarea class=\"export-textarea\" id=\"exportOutput\" readonly>\u003c/textarea>\n    \u003cdiv class=\"modal-actions\">\n      \u003cspan class=\"copy-status\" id=\"copyStatus\">\u003c/span>\n      \u003cbutton class=\"btn danger\" id=\"resetSavedBtn\" title=\"Throw away browser-saved changes and go back to what's written in the file\">Reset to File Version\u003c/button>\n      \u003cbutton class=\"btn\" id=\"exportClose\">Close\u003c/button>\n      \u003cbutton class=\"btn primary\" id=\"exportCopy\">Copy to Clipboard\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- Confirm Modal (generic) -->\n\u003cdiv class=\"modal-overlay\" id=\"confirmModal\">\n  \u003cdiv class=\"modal\">\n    \u003ch3 id=\"confirmTitle\">Are you sure?\u003c/h3>\n    \u003cp id=\"confirmText\">\u003c/p>\n    \u003cdiv class=\"modal-actions\">\n      \u003cbutton class=\"btn\" id=\"confirmCancel\">Cancel\u003c/button>\n      \u003cbutton class=\"btn danger\" id=\"confirmOk\">Confirm\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\n(function(){\n  const DESK_W = 130, DESK_H = 84;\n  // Teacher desk — fixed position, same in every class, never takes a student.\n  const TEACHER_DESK = { x: 133, y: 257, w: 130, h: 229 };\n  const MONITOR_SVG = '\u003csvg viewBox=\"0 0 24 24\" width=\"26\" height=\"26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\">\u003crect x=\"3\" y=\"4\" width=\"18\" height=\"12\" rx=\"1.5\"/>\u003cpath d=\"M9 20h6M12 16v4\"/>\u003c/svg>';\n\n  // =====================================================================\n  // YOUR CLASSES — EDIT THIS SECTION TO PERMANENTLY SET YOUR LAYOUTS\n  // =====================================================================\nconst CLASS_DATA = {\n  \"p1: GA2\": {\n    roster: [],\n    desks: [\n      { x: 1313, y: 690, student: null },\n      { x: 1171, y: 690, student: null },\n      { x: 1030, y: 690, student: null },\n      { x: 888, y: 690, student: null },\n      { x: 746, y: 690, student: null },\n      { x: 605, y: 690, student: null },\n      { x: 462, y: 690, student: null },\n      { x: 318, y: 690, student: null },\n      { x: 171, y: 690, student: null },\n      { x: 27, y: 688, student: null },\n      { x: 1160, y: 257, student: null },\n      { x: 1304, y: 257, student: null },\n      { x: 1159, y: 402, student: null },\n      { x: 1304, y: 402, s
