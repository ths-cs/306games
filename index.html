ted); }\n\n/* ---------- Fullscreen dashboard bar ---------- */\n.dash{\n  display:none; align-items:center; gap:36px; flex-wrap:wrap;\n  padding:10px 20px; background:var(--paper); color:var(--ink);\n  border-bottom:2px solid var(--dash-line); box-shadow:0 4px 10px rgba(0,0,0,.4);\n  position:relative; z-index:6;\n}\n.dash .item{ display:flex; align-items:baseline; gap:8px; font-size:17px; font-weight:600; white-space:nowrap; }\n.dash .lbl{ font-family:var(--mono); font-size:11px; color:var(--dash-label); letter-spacing:.05em; text-transform:uppercase; font-weight:400; }\n.dash .big{ font-size:24px; font-weight:700; }\n.dash .acts{ margin-left:auto; display:flex; gap:8px; }\n.dash .btn{ background:#FFFFFF; color:var(--ink); border-color:#9A9A9A; }\n.dash .btn.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }\n\n#host.present .bar, #host.present .side{ display:none; }\n#host.present .dash{ display:flex; }\n#host.present .main{ grid-template-columns:1fr; }\n\n/* ---------- Room ---------- */\n.main{ flex:1; display:grid; grid-template-columns:1fr 250px; min-height:0; }\n.stage{\n  position:relative; overflow:hidden; min-height:0;\n  background-color:var(--floor);\n  background-image:radial-gradient(circle, var(--floor-dot) 1px, transparent 1.4px);\n  background-size:25px 25px;\n}\n.map{ position:absolute; top:0; left:0; transform-origin:0 0; }\n\n.seat{\n  position:absolute; width:130px; height:84px; margin:0; border:0; border-radius:6px;\n  background:var(--tile); box-shadow:inset 0 0 0 1px var(--tile-edge), 0 3px 0 rgba(0,0,0,.55);\n  padding:6px 10px 16px 14px; display:flex; align-items:center; justify-content:center;\n  color:var(--tile-icon); font:inherit; text-align:left; cursor:default;\n  transition:background .2s ease, box-shadow .12s ease;\n}\n.seat svg{ display:block; }\n.seat.occupied{\n  background:var(--paper); box-shadow:inset 0 0 0 1px var(--paper-edge), 0 3px 0 rgba(0,0,0,.55);\n  justify-content:flex-start; cursor:pointer;\n}\n.seat.occupied::before{\n  content:''; position:absolute; left:0; top:0; bottom:0; width:6px;\n  background:var(--accent); border-radius:6px 0 0 6px;\n}\n.seat.occupied:hover{ box-shadow:inset 0 0 0 2px var(--accent), 0 3px 0 rgba(0,0,0,.55); }\n.np{ display:flex; flex-direction:column; gap:2px; max-width:100%; overflow:hidden; color:var(--ink); }\n.np-first{ font-weight:700; font-size:20px; line-height:1.05; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }\n.np-last{ font-size:12px; font-weight:500; color:var(--ink-soft); line-height:1.15; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }\n.seat .num{\n  position:absolute; right:7px; bottom:4px; font-family:var(--mono); font-weight:500;\n  font-size:14px; color:var(--tile-num); pointer-events:none;\n}\n.seat.occupied .num{ color:#7A7A7A; font-size:12px; }\n.seat.out{ background:var(--tile); box-shadow:inset 0 0 0 1px var(--tile-edge), 0 3px 0 rgba(0,0,0,.55); }\n.seat.out::before{ background:var(--tile-edge); }\n.seat.out .np-first, .seat.out .np-last{\n  color:var(--tile-num); text-decoration:line-through;\n  text-decoration-color:var(--accent); text-decoration-thickness:2px;\n}\n.seat.out .num{ color:var(--tile-num); }\n.seat.out:hover{ box-shadow:inset 0 0 0 2px var(--accent), 0 3px 0 rgba(0,0,0,.55); }\n.seat .place{\n  position:absolute; top:-9px; right:-9px; min-width:32px; height:22px; padding:0 7px; border-radius:11px;\n  background:var(--accent); color:#fff; font-size:12px; font-weight:700;\n  display:grid; place-items:center; box-shadow:0 2px 4px rgba(0,0,0,.45);\n}\n.seat.winner{ box-shadow:inset 0 0 0 3px var(--live), 0 0 0 6px color-mix(in srgb, var(--live) 35%, transparent), 0 3px 0 rgba(0,0,0,.55); }\n.seat.pop{ animation:pop .35s ease; }\n@keyframes pop{ 0%{transform:scale(1)} 40%{transform:scale(.9)} 100%{transform:scale(1)} }\n\n.teacher-desk{\n  position:absolute; border-radius:6px; background:var(--tile);\n  box-shadow:inset 0 0 0 2px var(--accent), 0 3px 0 rgba(0,0,0,.55);\n  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;\n  color:var(--muted); pointer-events:none; user-select:none;\n}\n.teacher-desk svg{ width:34px; height:34px; }\n.teacher-desk span{ font-weight:600; font-size:15px; color:var(--text); }\n\n.banner{\n  position:absolute; left:50%; top:18px; transform:translateX(-50%);\n  background:var(--paper); color:var(--ink); border-left:6px solid var(--accent); border-radius:6px;\n  padding:12px 22px; font-size:22px; font-weight:700; box-shadow:0 8px 22px rgba(0,0,0,.45); z-index:5; text-align:center;\n}\n.banner.win{ border-left-color:var(--live); font-size:28px; }\n.banner.final{ border-left-color:#D9A33A; }\n\n/* ---------- Sudden death ---------- */\n.btn.sdbtn{ background:#D9A33A; border-color:#D9A33A; color:#121212; font-weight:700; }\n.btn.sdbtn:hover:not(:disabled){ background:#E8B550; border-color:#E8B550; }\n.dash .btn.sdbtn{ background:#D9A33A; border-color:#B8862A; color:#121212; }\n.sd{\n  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:7;\n  width:min(80%, 780px); padding:28px 40px 32px; border-radius:10px; text-align:center; cursor:pointer;\n  background:var(--accent); color:#fff; border-top:8px solid #D9A33A;\n  box-shadow:0 24px 60px rgba(0,0,0,.65);\n}\n.sd.in{ animation:sdIn .5s cubic-bezier(.2,1.5,.4,1); }\n@keyframes sdIn{ from{ transform:translate(-50%,-50%) scale(.55); opacity:0; } }\n.sd-k{ display:block; font-size:clamp(18px, 1.8vw, 28px); font-weight:700; opacity:.85; margin-bottom:8px; }\n.sd-t{ display:block; font-size:clamp(30px, 3.8vw, 60px); font-weight:700; line-height:1.08; }\n\n/* ---------- Hold timer (sits in the room, above the Teacher Desk) ---------- */\n.hold{\n  --hc:hsl(135 70% 48%);\n  position:absolute; margin:0; border:0; border-radius:6px; overflow:hidden;\n  padding:16px 20px 24px; font:inherit; text-align:left; cursor:pointer;\n  background:var(--tile); color:var(--text);\n  box-shadow:inset 0 0 0 2px var(--hc), 0 3px 0 rgba(0,0,0,.55);\n  display:flex; flex-direction:column; justify-content:space-between;\n}\n.hold:hover:not(.off){ box-shadow:inset 0 0 0 3px var(--hc), 0 3px 0 rgba(0,0,0,.55); }\n.hold-top{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; }\n.hold-lbl{ font-size:16px; font-weight:700; white-space:nowrap; }\n.hold-hint{ font-size:14px; color:var(--muted); text-align:right; }\n.hold-num{\n  font-family:var(--mono); font-weight:500; font-size:104px; line-height:1; letter-spacing:-.02em;\n  color:var(--hc); font-variant-numeric:tabular-nums;\n}\n.hold-bar{ position:absolute; left:0; right:0; bottom:0; height:9px; background:var(--tile-edge); }\n.hold-bar i{ display:block; height:100%; background:var(--hc); transform-origin:left center; }\n.hold.idle .hold-num{ opacity:.5; }\n.hold.off{ cursor:default; box-shadow:inset 0 0 0 1px var(--tile-edge), 0 3px 0 rgba(0,0,0,.55); }\n.hold.off .hold-num{ opacity:.3; color:var(--tile-num); }\n.hold.off .hold-bar i{ background:var(--tile-num); opacity:.4; }\n.hold.held .hold-num{ animation:blink 1.2s steps(2) infinite; }\n.hold.expired{ animation:flash .5s steps(2) 6; }\n.hold.expired .hold-hint{ color:var(--text); font-weight:700; }\n@keyframes flash{ 50%{ background:color-mix(in srgb, var(--accent) 45%, var(--tile)); } }\n@keyframes blink{ 50%{ opacity:.35; } }\n\n/* ---------- Side panel ---------- */\n.side{\n  background:var(--panel); border-left:1px solid var(--border); padding:16px;\n  display:flex; flex-direction:column; gap:16px; overflow-y:auto; min-height:0;\n}\n.count b{ display:block; font-size:60px; line-height:.9; font-weight:700; }\n.count span{ font-size:14px; color:var(--muted); }\n.side h2{ font-size:14px; margin:0 0 10px; display:flex; gap:6px; align-items:center; }\n.side h2 small{ font-family:var(--mono); font-size:11px; color:var(--muted); font-weight:400; }\n.outlist{ list-style:none; margin:0; padding:0; }\n.outlist li{\n  display:flex; gap:10px; align-items:baseline; font-size:14px;\n  background:var(--tile); color:var(--muted); border-left:5px solid var(--accent);\n  border-radius:5px; padding:7px 10px; margin-bottom:7px;\n}\n.outlist .pl{ font-weight:700; color:var(--text); min-width:32px; }\n.empty-note{ font-size:12.5px; color:var(--muted); font-style:italic; margin:0; padding:4px; }\n.keys{ margin-top:auto; border-top:1px solid var(--border); padding-top:12px; font-size:12.5px; color:var(--muted); }\n.keys h2{ margin-bottom:8px; }\n.keys dl{ display:grid; grid-template-columns:auto 1fr; gap:6px 10px; margin:0; align-items:center; }\n.keys dt{ margin:0; }\n.keys dd{ margin:0; }\nkbd{\n  font-family:var(--mono); font-size:11px; color:var(--text); background:var(--tile);\n  border:1px solid var(--tile-edge); border-bottom-width:2px; border-radius:4px; padding:1px 6px;\n}\n\n.toast{\n  position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);\n  background:var(--paper); color:var(--ink); border-left:5px solid var(--accent);\n  padding:10px 16px; border-radius:6px; font-size:15px; z-index:20; box-shadow:0 10px 24px rgba(0,0,0,.45);\n  opacity:0; pointer-events:none; transition:opacity .2s ease;\n}\n.toast.show{ opacity:1; }\n\n/* ---------- Dialogs ---------- */\ndialog{\n  background:var(--panel); color:var(--text); border:1px solid var(--border); border-top:4px solid var(--accent);\n  border-radius:10px; padding:22px; width:min(440px, 92vw); box-shadow:0 20px 50px rgba(0,0,0,.6);\n}\ndialog::backdrop{ background:rgba(0,0,0,.7); backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px); }\ndialog h3{ margin:0 0 6px; font-size:17px; }\ndialog p{ margin:0 0 12px; font-size:13px; color:var(--muted); line-height:1.45; }\ndialog ol{ margin:0 0 12px; padding-left:20px; font-size:13px; color:var(--muted); line-height:1.6; }\ndialog textarea{\n  width:100%; min-height:200px; resize:vertical; background:var(--field-bg); color:var(--text);\n  border:1px solid var(--border); border-radius:6px; padding:10px; font:inherit; font-size:14px; line-height:1.5;\n}\ndialog textarea:focus{ border-color:var(--accent); outline:none; }\n#importText{ font-family:var(--mono); font-size:12px; white-space:pre; }\ndialog .err{ color:var(--danger-text); font-size:13px; margin:10px 0 0; }\n.actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap; }\n\n/* ---------- Rules screen (for the projector) ---------- */\n.rules{\n  position:fixed; inset:0; z-index:15; overflow-y:auto;\n  background-color:var(--floor);\n  background-image:radial-gradient(circle, var(--floor-dot) 1px, transparent 1.4px);\n  background-size:25px 25px;\n  padding:calc(28px + env(safe-area-inset-top,0px)) 4vw calc(28px + env(safe-area-inset-bottom,0px));\n  display:flex; flex-direction:column; gap:clamp(16px, 2.6vh, 30px);\n}\n.rules-head{ display:flex; align-items:center; gap:16px; }\n.rules-head .brand-mark{ width:clamp(40px, 4vw, 60px); height:clamp(40px, 4vw, 60px); border-width:3px; }\n.rules-head .brand-mark::after{ width:42%; height:42%; }\n.rules-head h2{ margin:0; font-size:clamp(34px, 4.6vw, 70px); font-weight:700; line-height:1; letter-spacing:-.01em; }\n.rules-head p{ margin:4px 0 0; font-size:clamp(15px, 1.4vw, 22px); color:var(--muted); }\n.rules-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:clamp(14px, 1.6vw, 26px); flex:1; }\n.rule-card{\n  background:var(--paper); color:var(--ink); border-radius:8px; border-left:10px solid var(--ink-soft);\n  padding:clamp(16px, 1.8vw, 30px) clamp(16px, 1.8vw, 30px) clamp(16px, 1.8vw, 30px) clamp(18px, 2vw, 34px);\n  box-shadow:0 4px 0 rgba(0,0,0,.55);\n}\n.rule-card.out{ border-left-color:var(--accent); }\n.rule-card.safe{ border-left-color:var(--live); }\n.rule-card h3{ margin:0 0 clamp(10px, 1.4vh, 18px); font-size:clamp(22px, 2.3vw, 38px); line-height:1.05; }\n.rule-card ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:clamp(8px, 1.3vh, 16px); }\n.rule-card li{ font-size:clamp(17px, 1.65vw, 28px); line-height:1.25; font-weight:500; padding-left:1.1em; position:relative; }\n.rule-card li::before{\n  content:''; position:absolute; left:0; top:.42em; width:.45em; height:.45em; border-radius:2px; background:var(--ink-soft);\n}\n.rule-card.out li::before{ background:var(--accent); }\n.rule-card.safe li::before{ background:var(--live); border-radius:50%; }\n.rule-card li b{ font-weight:700; }\n.rules-foot{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }\n.rules-foot .call{ font-size:clamp(16px, 1.5vw, 24px); font-weight:600; margin-right:auto; }\n.rules-foot .btn{ font-size:clamp(14px, 1.2vw, 18px); padding:10px 18px; }\n.rules-foot .hint{ font-size:13px; color:var(--muted); }\n\n@media (max-width:820px){\n  .main{ grid-template-columns:1fr; grid-template-rows:60vh auto; }\n  .side{ border-left:none; border-top:1px solid var(--border); }\n  .keys{ display:none; }\n}\n@media (prefers-reduced-motion: reduce){\n  *{ animation:none !important; transition:none !important; }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv id=\"host\">\n  \u003cheader class=\"bar\">\n    \u003cdiv class=\"brand\">\u003cspan class=\"brand-mark\" aria-hidden=\"true\">\u003c/span>\u003ch1>306 Silent Ball\u003c/h1>\u003c/div>\n    \u003cselect id=\"classSelect\" aria-label=\"Class period\">\u003c/select>\n    \u003cspan class=\"status\" id=\"status\">\u003ci>\u003c/i>\u003cspan id=\"statusText\">Waiting to start\u003c/span>\u003c/span>\n    \u003cdiv class=\"spacer\">\u003c/div>\n    \u003cbutton class=\"btn\" id=\"importBtn\">Import chart\u003c/button>\n    \u003cbutton class=\"btn\" id=\"seatsBtn\">Edit seats\u003c/button>\n    \u003cbutton class=\"btn\" data-act=\"rules\">Rules\u003c/button>\n    \u003cbutton class=\"btn\" id=\"soundBtn\" aria-pressed=\"true\">🔊 Sound on\u003c/button>\n    \u003cspan class=\"sep\" aria-hidden=\"true\">\u003c/span>\n    \u003cbutton class=\"btn\" data-act=\"undo\">Undo\u003c/button>\n    \u003cbutton class=\"btn primary\" data-act=\"start\">Start game\u003c/button>\n    \u003cbutton class=\"btn\" data-act=\"pause\">Pause\u003c/button>\n    \u003cbutton class=\"btn sdbtn\" data-act=\"sd\" hidden>⚡ Sudden death\u003c/button>\n    \u003cbutton class=\"btn\" data-act=\"end\">End round\u003c/button>\n    \u003cbutton class=\"btn\" data-act=\"restart\">Restart\u003c/button>\n    \u003cbutton class=\"btn\" data-act=\"present\">📺 Fullscreen View\u003c/button>\n  \u003c/header>\n\n  \u003cdiv class=\"dash\" id=\"dash\">\n    \u003cdiv class=\"item\">\u003cspan class=\"lbl\">Class\u003c/span>\u003cspan id=\"dClass\">—\u003c/span>\u003c/div>\n    \u003cdiv class=\"item\">\u003cspan class=\"lbl\">Round\u003c/span>\u003cspan id=\"dRound\">1\u003c/span>\u003c/div>\n    \u003cdiv class=\"item\">\u003cspan class=\"lbl\">Still in\u003c/span>\u003cspan class=\"big\" id=\"dAlive\">0\u003c/span>\u003cspan id=\"dOf\">\u003c/span>\u003c/div>\n    \u003cdiv class=\"item\">\u003cspan class=\"lbl\">Last out\u003c/span>\u003cspan id=\"dLast\">—\u003c/span>\u003c/div>\n    \u003cdiv class=\"acts\">\n      \u003cbutton class=\"btn\" data-act=\"rules\">Rules\u003c/button>\n      \u003cbutton class=\"btn\" data-act=\"undo\">Undo\u003c/button>\n      \u003cbutton class=\"btn primary\" data-act=\"start\">Start game\u003c/button>\n      \u003cbutton class=\"btn\" data-act=\"pause\">Pause\u003c/button>\n      \u003cbutton class=\"btn sdbtn\" data-act=\"sd\" hidden>⚡ Sudden death\u003c/button>\n      \u003cbutton class=\"btn\" data-act=\"end\">End round\u003c/button>\n      \u003cbutton class=\"btn\" data-act=\"restart\">Restart\u003c/button>\n      \u003cbutton class=\"btn primary\" data-act=\"present\">🛠️ Edit Mode\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"main\">\n    \u003cdiv class=\"stage\" id=\"stage\">\n      \u003cdiv class=\"map\" id=\"map\">\u003c/div>\n      \u003cdiv class=\"banner\" id=\"banner\" hidden>\u003c/div>\n      \u003cdiv class=\"sd\" id=\"sd\" role=\"status\" hidden>\u003cspan class=\"sd-k\">⚡ Sudden death\u003c/span>\u003cspan class=\"sd-t\">\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003caside class=\"side\">\n      \u003cdiv class=\"count\">\u003cb id=\"aliveCount\">0\u003c/b>\u003cspan id=\"aliveLabel\">still in\u003c/span>\u003c/div>\n      \u003cdiv>\n        \u003ch2>Out \u003csmall id=\"outCount\">\u003c/small>\u003c/h2>\n        \u003col class=\"outlist\" id=\"outList\">\u003c/ol>\n        \u003cp class=\"empty-note\" id=\"outEmpty\">Nobody yet. Click a student’s desk to put them out; click again to bring them back.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"keys\">\n        \u003ch2>Shortcuts\u003c/h2>\n        \u003cdl>\n          \u003cdt>\u003ckbd>Space\u003c/kbd>\u003c/dt>\u003cdd>Start, pause or resume\u003c/dd>\n          \u003cdt>\u003ckbd>Enter\u003c/kbd>\u003c/dt>\u003cdd>Restart the 5-second timer\u003c/dd>\n          \u003cdt>\u003ckbd>Z\u003c/kbd>\u003c/dt>\u003cdd>Undo the last out\u003c/dd>\n          \u003cdt>\u003ckbd>F\u003c/kbd>\u003c/dt>\u003cdd>Fullscreen view\u003c/dd>\n          \u003cdt>\u003ckbd>M\u003c/kbd>\u003c/dt>\u003cdd>Sound on or off\u003c/dd>\n          \u003cdt>\u003ckbd>R\u003c/kbd>\u003c/dt>\u003cdd>Rules screen\u003c/dd>\n          \u003cdt>\u003ckbd>D\u003c/kbd>\u003c/dt>\u003cdd>Sudden death twist\u003c/dd>\n        \u003c/dl>\n      \u003c/div>\n    \u003c/aside>\n  \u003c/div>\n\u003c/div>\n\n\u003cdialog id=\"seatsDialog\">\n  \u003ch3>Edit seats\u003c/h3>\n  \u003cp>One student per line. Students already on the chart keep their desks.\u003c/p>\n  \u003ctextarea id=\"rosterText\" spellcheck=\"false\">\u003c/textarea>\n  \u003cdiv class=\"actions\">\n    \u003cbutton class=\"btn\" id=\"seatsCancel\">Cancel\u003c/button>\n    \u003cbutton class=\"btn\" id=\"seatsShuffle\">Shuffle everyone\u003c/button>\n    \u003cbutton class=\"btn primary\" id=\"seatsFill\">Save seats\u003c/button>\n  \u003c/div>\n\u003c/dialog>\n\n\u003cdialog id=\"importDialog\">\n  \u003ch3>Import from seating chart\u003c/h3>\n  \u003col>\n    \u003cli>In the 306 Seating Chart, click Export Setup.\u003c/li>\n    \u003cli>Click Copy to Clipboard, then paste it below.\u003c/li>\n  \u003c/ol>\n  \u003cp>This replaces the game’s classes, desks and seats with the chart’s. Students on the Dropped list are left out.\u003c/p>\n  \u003ctextarea id=\"importText\" spellcheck=\"false\" placeholder=\"const CLASS_DATA = {&#10;  &quot;p1: GA2&quot;: {&#10;    roster: [ … ],&#10;    desks: [ … ]&#10;  },&#10;  …&#10;};\">\u003c/textarea>\n  \u003cp class=\"err\" id=\"importErr\" role=\"alert\" hidden>\u003c/p>\n  \u003cdiv class=\"actions\">\n    \u003cbutton class=\"btn\" id=\"importCancel\">Cancel\u003c/button>\n    \u003cbutton class=\"btn primary\" id=\"importConfirm\">Import\u003c/button>\n  \u003c/div>\n\u003c/dialog>\n\n\u003cdialog id=\"confirmDialog\">\n  \u003ch3>Restart the round?\u003c/h3>\n  \u003cp>Everyone comes back in and the out list clears. This can’t be undone.\u003c/p>\n  \u003cdiv class=\"actions\">\n    \u003cbutton class=\"btn\" id=\"confirmCancel\">Cancel\u003c/button>\n    \u003cbutton class=\"btn danger\" id=\"confirmOk\">Restart\u003c/button>\n  \u003c/div>\n\u003c/dialog>\n\n\u003csection class=\"rules\" id=\"rules\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"rulesTitle\" hidden>\n  \u003cheader class=\"rules-head\">\n    \u003cspan class=\"brand-mark\" aria-hidden=\"true\">\u003c/span>\n    \u003cdiv>\n      \u003ch2 id=\"rulesTitle\">Silent Ball\u003c/h2>\n      \u003cp>Room 306 rules\u003c/p>\n    \u003c/div>\n  \u003c/header>\n  \u003cdiv class=\"rules-grid\">\n    \u003carticle class=\"rule-card\">\n      \u003ch3>How to play\u003c/h3>\n      \u003cul>\n        \u003cli>Toss the ball to anyone in the room \u003cb>without making a sound\u003c/b>.\u003c/li>\n        \u003cli>\u003cb>Hands up\u003c/b> means you’re ready to catch.\u003c/li>\n        \u003cli>Turn your chair \u003cb>away from the computers\u003c/b> and stay in it.\u003c/li>\n        \u003cli>The \u003cb>last one still in\u003c/b> wins.\u003c/li>\n      \u003c/ul>\n    \u003c/article>\n    \u003carticle class=\"rule-card out\">\n      \u003ch3>You’re out if you…\u003c/h3>\n      \u003cul>\n        \u003cli>Make \u003cb>any sound\u003c/b>: talking, laughing, gasping.\u003c/li>\n        \u003cli>Throw a \u003cb>bad pass\u003c/b>.\u003c/li>\n        \u003cli>\u003cb>Drop\u003c/b> a good pass.\u003c/li>\n        \u003cli>Hold the ball \u003cb>longer than 5 seconds\u003c/b>.\u003c/li>\n        \u003cli>Throw it \u003cb>straight back\u003c/b> to whoever threw it to you (allowed once it’s down to 2).\u003c/li>\n        \u003cli>\u003cb>Stand up\u003c/b> or lean across a desk.\u003c/li>\n      \u003c/ul>\n    \u003c/article>\n    \u003carticle class=\"rule-card safe\">\n      \u003ch3>Safe throws only\u003c/h3>\n      \u003cul>\n        \u003cli>\u003cb>Underhand\u003c/b> with a soft arc. Overhand is out.\u003c/li>\n        \u003cli>Only throw to \u003cb>raised hands\u003c/b>.\u003c/li>\n        \u003cli>Clear line only, \u003cb>never over a screen\u003c/b>.\u003c/li>\n        \u003cli>Aim for hands. \u003cb>Hit a face\u003c/b> and you’re out.\u003c/li>\n        \u003cli>\u003cb>Hit a computer\u003c/b> and you’re out.\u003c/li>\n        \u003cli>\u003cb>Hit a ceiling light\u003c/b> and you’re out.\u003c/li>\n      \u003c/ul>\n    \u003c/article>\n  \u003c/div>\n  \u003cfooter class=\"rules-foot\">\n    \u003cspan class=\"call\">The teacher’s call is final. Arguing is talking, so arguing is out.\u003c/span>\n    \u003cspan class=\"hint\">Space starts the game\u003c/span>\n    \u003cbutton class=\"btn\" id=\"rulesClose\">Back to the room\u003c/button>\n    \u003cbutton class=\"btn primary\" data-act=\"start\">Start game\u003c/button>\n  \u003c/footer>\n\u003c/section>\n\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\">\u003c/div>\n\n\u003cscript>\n(function(){\n  const $ = s => document.querySelector(s);\n  const $$ = s => [...document.querySelectorAll(s)];\n  const DESK_W = 130, DESK_H = 84;\n  const TEACHER_DESK = { x: 133, y: 257, w: 130, h: 229 };\n  // Hold timer: open floor above the Teacher Desk, lined up with desk 27's right edge.\n  const TIMER_BOX = { x: 133, y: 52, w: 458, h: 180 };\n  let HOLD_MS = 5000;\n  // Sudden death twists: silent, seated and safe.\n  const SD_TWISTS = [\n    { id:'one',    text:'One-handed catches only.' },\n    { id:'weak',   text:'Throw and catch with your weaker hand.' },\n    { id:'three',  text:'The hold timer drops to 3 seconds.' },\n    { id:'nose',   text:'Touch your nose before every throw.' },\n    { id:'behind', text:'Pass the ball behind your back before you throw.' }\n  ];\n  const MONITOR_SVG = '\u003csvg viewBox=\"0 0 24 24\" width=\"26\" height=\"26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"4\" width=\"18\" height=\"12\" rx=\"1.5\"/>\u003cpath d=\"M9 20h6M12 16v4\"/>\u003c/svg>';\n\n  // Room 306 desk layout (from the seating chart), desk 01 first.\n  const LAYOUT = [\n    [1313,690],[1171,690],[1030,690],[888,690],[746,690],[605,690],[462,690],[318,690],[171,690],[27,688],\n    [1160,257],[1304,257],[1159,402],[1304,402],[1160,521],\n    [920,150],[920,243],[920,335],[920,429],[920,522],\n    [700,149],[700,248],[700,340],[700,432],[700,524],\n    [318,257],[461,257],[316,402],[460,402],[133,521]\n  ];\n  const N = LAYOUT.length;\n  function seatsFrom(map){ const s = Array(N).fill(null); Object.keys(map).forEach(i => s[i] = map[i]); return s; }\n  const DEFAULT_CLASSES = {\n    \"p1: GA2\": { roster: [], seats: Array(N).fill(null) },\n    \"p2: GA1\": { roster: [], seats: Array(N).fill(null) },\n    \"p3: HSB27\": { roster: [], seats: Array(N).fill(null) },\n    \"p4: FrS\": { roster: [], seats: Array(N).fill(null) },\n    \"p5: DA1\": { roster: [], seats: Array(N).fill(null) }\n  };\n\n  // ---------- helpers ----------\n  const store = {\n    get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },\n    set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }\n  };\n  const pad2 = n => String(n).padStart(2,'0');\n  const firstName = n => n.trim().split(/\\s+/)[0];\n  function shortName(n){ const p = n.trim().split(/\\s+/); return p.length > 1 ? p[0] + ' ' + p[p.length-1][0] + '.' : p[0]; }\n  function ordinal(n){ const s=['th','st','nd','rd'], v=n%100; return n + (s[(v-20)%10]||s[v]||s[0]); }\n  function plateHTML(n){\n    const p = n.trim().split(/\\s+/), d = document.createElement('div');\n    const f = document.createElement('span'); f.className='np-first'; f.textContent = p[0]; d.appendChild(f);\n    if(p.length > 1){ const l = document.createElement('span'); l.className='np-last'; l.textContent = p.slice(1).join(' '); d.appendChild(l); }\n    return d.innerHTML;\n  }\n  function fitNames(root){\n    root.querySelectorAll('.np-first').forEach(el => {\n      el.style.fontSize = '';\n      let size = parseFloat(getComputedStyle(el).fontSize);\n      while(el.scrollWidth > el.clientWidth && size > 12){ size = Math.max(12, size - 0.5); el.style.fontSize = size + 'px'; }\n    });\n  }\n  // Seating chart's shuffle order: highest desk first, desks 30, 10 and 1 fill last.\n  const SHUFFLE_LAST = [30, 10, 1];\n  function fillOrder(n){\n    const last = SHUFFLE_LAST.filter(k => k \u003c= n);\n    return [...Array(n).keys()].map(i=>i+1).filter(k => !last.includes(k)).reverse()\n      .concat(last.slice().reverse()).map(k => k-1);\n  }\n  function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }\n  let toastTimer;\n  function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), 2600); }\n\n  function boundsOf(L){\n    const minX = Math.min(TEACHER_DESK.x, TIMER_BOX.x, ...L.map(p=>p[0]));\n    const minY = Math.min(TEACHER_DESK.y, TIMER_BOX.y, ...L.map(p=>p[1]));\n    return {\n      minX, minY,\n      w: Math.max(TEACHER_DESK.x + TEACHER_DESK.w, TIMER_BOX.x + TIMER_BOX.w, ...L.map(p=>p[0] + DESK_W)) - minX,\n      h: Math.max(TEACHER_DESK.y + TEACHER_DESK.h, ...L.map(p=>p[1] + DESK_H + 3)) - minY\n    };\n  }\n  function validLayout(L){\n    return Array.isArray(L) && L.length > 0 && L.length \u003c= 120 &&\n      L.every(p => Array.isArray(p) && p.length === 2 && p.every(v => typeof v === 'number' && isFinite(v)));\n  }\n\n  // ---------- classes ----------\n  function classKeys(){\n    const order = store.get('sb306-class-order');\n    if(Array.isArray(order) && order.length) return [...order];\n    return [...new Set([...Object.keys(DEFAULT_CLASSES), ...Object.keys(store.get('sb306-classes')||{})])];\n  }\n  function classData(key){\n    const o = (store.get('sb306-classes')||{})[key];\n    return o || DEFAULT_CLASSES[key] || { roster:[], seats:[], layout:LAYOUT };\n  }\n  function saveClassData(key, data){ const all = store.get('sb306-classes')||{}; all[key]=data; store.set('sb306-classes', all); }\n  function normSeats(s, n){ const a=Array(n).fill(null); (s||[]).forEach((x,i)=>{ if(i\u003cn && typeof x==='string' && x.trim()) a[i]=x; }); return a; }\n  function freshGame(key, round){\n    const c = classData(key), layout = validLayout(c.layout) ? c.layout : LAYOUT;\n    return { classKey:key, layout, roster:[...(c.roster||[])], seats:normSeats(c.seats, layout.length), out:{}, seq:0, phase:'lobby', round:round||1 };\n  }\n  function adopt(d){\n    if(!d || typeof d.classKey !== 'string' || !d.classKey) return null;\n    const layout = validLayout(d.layout) ? d.layout : LAYOUT;\n    return {\n      classKey:d.classKey, layout, roster:Array.isArray(d.roster)?d.roster.filter(x=>typeof x==='string'):[],\n      seats:normSeats(d.seats, layout.length), out:(d.out && typeof d.out==='object')?{...d.out}:{},\n      seq:Number(d.seq)||0, phase:['lobby','playing','paused','ended'].includes(d.phase)?d.phase:'lobby',\n      round:Number(d.round)||1,\n      sd: SD_TWISTS.some(t => t.id === d.sd) ? d.sd : null\n    };\n  }\n\n  // ---------- seating chart import ----------\n  // Reads the text from the chart's Export Setup (or the whole chart file) without running it.\n  function parseChartExport(text){\n    const at = text.indexOf('CLASS_DATA');\n    const start = text.indexOf('{', at \u003c 0 ? 0 : at);\n    if(start \u003c 0) throw new Error('missing');\n    let depth = 0, inStr = false, end = -1;\n    for(let i = start; i \u003c text.length; i++){\n      const c = text[i];\n      if(inStr){ if(c === '\\\\') i++; else if(c === '\"') inStr = false; continue; }\n      if(c === '\"') inStr = true;\n      else if(c === '{') depth++;\n      else if(c === '}'){ depth--; if(depth === 0){ end = i; break; } }\n    }\n    if(end \u003c 0) throw new Error('cut off');\n    const body = text.slice(start, end + 1);\n    // Turn the JavaScript object into JSON: quote bare keys, drop trailing commas and comments.\n    let out = '';\n    for(let i = 0; i \u003c body.length;){\n      const c = body[i];\n      if(c === '\"'){\n        let j = i + 1;\n        while(j \u003c body.length && body[j] !== '\"'){ if(body[j] === '\\\\') j++; j++; }\n        out += body.slice(i, j + 1); i = j + 1; continue;\n      }\n      if(c === '/' && body[i+1] === '/'){ while(i \u003c body.length && body[i] !== '\\n') i++; continue; }\n      if(/[A-Za-z_$]/.test(c)){\n        let j = i; while(j \u003c body.length && /[\\w$]/.test(body[j])) j++;\n        const word = body.slice(i, j); let k = j; while(/\\s/.test(body[k] || '')) k++;\n        out += body[k] === ':' ? JSON.stringify(word) : word; i = j; continue;\n      }\n      if(c === ','){\n        let k = i + 1; while(/\\s/.test(body[k] || '')) k++;\n        if(body[k] === '}' || body[k] === ']'){ i++; continue; }\n      }\n      out += c; i++;\n    }\n    const raw = JSON.parse(out);\n    const classes = {}, order = [];\n    Object.keys(raw).forEach(key => {\n      const cfg = raw[key];\n      if(!cfg || !Array.isArray(cfg.desks)) return;\n      const dropped = new Set(Array.isArray(cfg.dropped) ? cfg.dropped : []);\n      const desks = cfg.desks.filter(d => d && typeof d.x === 'number' && typeof d.y === 'number');\n      if(!desks.length || desks.length > 120) return;\n      const layout = desks.map(d => [Math.round(d.x), Math.round(d.y)]);\n      const seats = desks.map(d => (typeof d.student === 'string' && d.student.trim() && !dropped.has(d.student)) ? d.student : null);\n      const roster = (Array.isArray(cfg.roster) ? cfg.roster : []).filter(n => typeof n === 'string' && n.trim() && !dropped.has(n));\n      seats.forEach(n => { if(n && !roster.includes(n)) roster.push(n); });\n      classes[key] = { roster, seats, layout };\n      order.push(key);\n    });\n    if(!order.length) throw new Error('no classes');\n    return { classes, order };\n  }\n\n\n  // ---------- game facts ----------\n  function seatedIdx(G){ return G.seats.map((n,i)=>n?i:-1).filter(i=>i>=0); }\n  function isOut(G,i){ return Object.prototype.hasOwnProperty.call(G.out, String(i)); }\n  function aliveIdx(G){ return seatedIdx(G).filter(i=>!isOut(G,i)); }\n  // Most recently out gets the best place among the eliminated.\n  function places(G){\n    const alive = aliveIdx(G).length;\n    const outs = Object.keys(G.out).map(Number).filter(i=>G.seats[i]).sort((a,b)=>G.out[b]-G.out[a]);\n    const m = {}; outs.forEach((i,k)=> m[i] = alive + k + 1);\n    return { map:m, order:outs };\n  }\n\n  // ---------- sound (made in the browser, no files) ----------\n  let soundOn = store.get('sb306-sound') !== false;\n  let actx = null;\n  function tone(f, t, d, type, v, to){\n    const o = actx.createOscillator(), g = actx.createGain();\n    o.type = type; o.frequency.setValueAtTime(f, t);\n    if(to) o.frequency.exponentialRampToValueAtTime(to, t + d);\n    g.gain.setValueAtTime(0.0001, t);\n    g.gain.exponentialRampToValueAtTime(v, t + 0.015);\n    g.gain.exponentialRampToValueAtTime(0.0001, t + d);\n    o.connect(g); g.connect(actx.destination);\n    o.start(t); o.stop(t + d + 0.05);\n  }\n  function sfx(kind){\n    if(!soundOn) return;\n    try{\n      actx = actx || new (window.AudioContext || window.webkitAudioContext)();\n      if(actx.state === 'suspended') actx.resume();\n      const t = actx.currentTime + 0.01;\n      if(kind === 'out'){ tone(300, t, 0.28, 'triangle', 0.35, 110); tone(150, t, 0.2, 'sine', 0.25, 70); }\n      else if(kind === 'back'){ tone(440, t, 0.1, 'sine', 0.22); tone(660, t + 0.09, 0.14, 'sine', 0.22); }\n      else if(kind === 'start'){ tone(660, t, 0.12, 'square', 0.07); tone(880, t + 0.16, 0.18, 'square', 0.07); }\n      else if(kind === 'pause'){ tone(523, t, 0.12, 'sine', 0.2); tone(392, t + 0.12, 0.18, 'sine', 0.2); }\n      else if(kind === 'sd'){ tone(220, t, 0.16, 'sawtooth', 0.1); tone(330, t + 0.17, 0.16, 'sawtooth', 0.1); tone(440, t + 0.34, 0.55, 'sawtooth', 0.12, 880); }\n      else if(kind === 'buzz'){ tone(190, t, 0.5, 'sawtooth', 0.14, 120); tone(95, t, 0.5, 'square', 0.07); }\n      else if(kind === 'win'){ [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * 0.12, i === 3 ? 0.5 : 0.22, 'triangle', 0.25)); }\n    }catch(e){}\n  }\n\n  // ================= GAME =================\n  let G = adopt(store.get('sb306-game'));\n  if(!G){ const keys = classKeys(); G = freshGame(keys.includes('p3: HSB27') ? 'p3: HSB27' : keys[0]); }\n  function save(){ store.set('sb306-game', G); }\n\n  // ---- class select ----\n  const sel = $('#classSelect');\n  let selKeys = '';\n  function fillClassSelect(){\n    const keys = classKeys();\n    if(!keys.includes(G.classKey)) keys.push(G.classKey);\n    const sig = JSON.stringify(keys);\n    if(sig === selKeys) return;\n    selKeys = sig; sel.innerHTML = '';\n    keys.forEach(k => { const o=document.createElement('option'); o.value=k; o.textContent=k; sel.appendChild(o); });\n  }\n  sel.addEventListener('change', () => { G = freshGame(sel.value, 1); render(); save(); });\n\n  // ---- room map ----\n  const stage = $('#stage'), map = $('#map');\n  let layoutSig = '', seatEls = [], B = boundsOf(LAYOUT);\n  function buildMap(){\n    const L = G.layout, sig = JSON.stringify(L);\n    if(sig === layoutSig) return;\n    layoutSig = sig; B = boundsOf(L); map.innerHTML = '';\n    map.style.width = B.w + 'px'; map.style.height = B.h + 'px';\n    const teacher = document.createElement('div');\n    teacher.className = 'teacher-desk';\n    teacher.style.left = (TEACHER_DESK.x - B.minX) + 'px'; teacher.style.top = (TEACHER_DESK.y - B.minY) + 'px';\n    teacher.style.width = TEACHER_DESK.w + 'px'; teacher.style.height = TEACHER_DESK.h + 'px';\n    teacher.innerHTML = MONITOR_SVG + '\u003cspan>Teacher Desk\u003c/span>';\n    map.appendChild(teacher);\n    const hold = document.createElement('button');\n    hold.className = 'hold off'; hold.id = 'hold';\n    hold.style.left = (TIMER_BOX.x - B.minX) + 'px'; hold.style.top = (TIMER_BOX.y - B.minY) + 'px';\n    hold.style.width = TIMER_BOX.w + 'px'; hold.style.height = TIMER_BOX.h + 'px';\n    hold.setAttribute('aria-label', 'Five-second hold timer. Click to restart it after a catch.');\n    hold.innerHTML = '\u003cspan class=\"hold-top\">\u003cspan class=\"hold-lbl\">Hold timer\u003c/span>\u003cspan class=\"hold-hint\">\u003c/span>\u003c/span>' +\n      '\u003cspan class=\"hold-num\">5.000\u003c/span>\u003cspan class=\"hold-bar\">\u003ci>\u003c/i>\u003c/span>';\n    hold.addEventListener('click', () => restartTimer());\n    map.appendChild(hold);\n    seatEls = L.map(([x,y], i) => {\n      const b = document.createElement('button');\n      b.className = 'seat';\n      b.style.left = (x - B.minX) + 'px'; b.style.top = (y - B.minY) + 'px';\n      b.addEventListener('click', () => toggleOut(i));\n      map.appendChild(b);\n      return b;\n    });\n  }\n  // Fill the room area: tighter edges in fullscreen so names are as big as possible.\n  function fit(){\n    const r = stage.getBoundingClientRect(), pad = $('#host').classList.contains('present') ? 22 : 30;\n    if(!r.width || !r.height) return;\n    const s = Math.min((r.width - pad*2)/B.w, (r.height - pad*2)/B.h);\n    const ox = (r.width - B.w*s)/2, oy = (r.height - B.h*s)/2;\n    map.style.transform = 'translate('+ox+'px,'+oy+'px) scale('+s+')';\n  }\n  new ResizeObserver(fit).observe(stage);\n\n  function pop(i){ const el = seatEls[i]; if(!el) return; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }\n\n  function toggleOut(i){\n    if(!G.seats[i]) return;\n    if(isOut(G,i)){\n      delete G.out[String(i)];\n      if(G.phase === 'ended' && aliveIdx(G).length > 1) G.phase = 'playing';\n      sfx('back'); toast(firstName(G.seats[i]) + ' is back in.');\n    } else {\n      if(G.phase === 'lobby'){ toast('Start the game first (Space), then click a desk to put that student out.'); return; }\n      // Eliminating while paused is allowed: pause, make the call, then resume.      if(G.phase === 'ended'){ toast('This round is over. Restart for a new round.'); return; }\n      G.seq += 1; G.out[String(i)] = G.seq;\n      T.mode = 'idle'; T.left = HOLD_MS; // ball goes to someone new\n      if(aliveIdx(G).length \u003c= 1){ G.phase = 'ended'; sfx('win'); } else sfx('out');\n    }\n    pop(i); render(); save();\n  }\n\n  // ---- actions ----\n  function start(){\n    if(G.phase !== 'lobby') return;\n    if(seatedIdx(G).length \u003c 2){ toast('Seat at least two students first (Edit seats or Import chart).'); return; }\n    closeRules(); G.sd = null; HOLD_MS = 5000; G.phase = 'playing'; T.mode = 'held'; T.left = HOLD_MS; sfx('start'); render(); save();\n  }\n  function togglePause(){\n    if(G.phase === 'playing'){ G.phase = 'paused'; sfx('pause'); }\n    else if(G.phase === 'paused'){ G.phase = 'playing'; sfx('start'); }\n    else return;\n    render(); save();\n  }\n  function endRound(){ if(G.phase !== 'playing' && G.phase !== 'paused') return; G.phase = 'ended'; render(); save(); }\n  function doRestart(){\n    G.out = {}; G.seq = 0; G.phase = 'lobby'; G.round += 1; render(); save();\n    toast('Round ' + G.round + ' is ready. Press Space to start.');\n  }\n  function restart(){\n    if(G.phase === 'lobby') return;\n    if(Object.keys(G.out).length && G.phase !== 'ended') $('#confirmDialog').showModal();\n    else doRestart();\n  }\n  function undo(){\n    const keys = Object.keys(G.out);\n    if(!keys.length){ toast('Nothing to undo.'); return; }\n    const last = keys.reduce((a,b) => G.out[b] > G.out[a] ? b : a);\n    const i = Number(last);\n    delete G.out[last];\n    if(G.phase === 'ended' && aliveIdx(G).length > 1) G.phase = 'playing';\n    sfx('back'); pop(i); render(); save();\n    toast(firstName(G.seats[i] || 'Student') + ' is back in.');\n  }\n\n  // ---- fullscreen view ----\n  const host = $('#host');\n  let inRealFs = false;\n  function fsEl(){ return document.fullscreenElement || document.webkitFullscreenElement || null; }\n  function enterPresent(){\n    if(host.classList.contains('present')) return;\n    host.classList.add('present');\n    try{\n      const el = document.documentElement;\n      const r = el.requestFullscreen ? el.requestFullscreen() : (el.webkitRequestFullscreen ? el.webkitRequestFullscreen() : null);\n      if(r && r.then) r.then(() => { inRealFs = true; }).catch(() => {});\n    }catch(e){}\n    render();\n  }\n  function exitPresent(){\n    if(!host.classList.contains('present')) return;\n    host.classList.remove('present');\n    if(fsEl()){ try{ const r = document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen(); if(r && r.catch) r.catch(()=>{}); }catch(e){} }\n    inRealFs = false;\n    render();\n  }\n  function togglePresent(){ host.classList.contains('present') ? exitPresent() : enterPresent(); }\n  function onFsChange(){ if(!fsEl() && inRealFs){ inRealFs = false; exitPresent(); } }\n  document.addEventListener('fullscreenchange', onFsChange);\n  document.addEventListener('webkitfullscreenchange', onFsChange);\n\n  // ---- sound toggle ----\n  function setSound(on){\n    soundOn = on; store.set('sb306-sound', on);\n    const b = $('#soundBtn'); b.setAttribute('aria-pressed', String(on));\n    b.textContent = on ? '🔊 Sound on' : '🔇 Sound off';\n  }\n  $('#soundBtn').addEventListener('click', () => { setSound(!soundOn); if(soundOn) sfx('back'); });\n  setSound(soundOn);\n\n  // ---- hold timer ----\n  // idle: waiting for a catch; running: counting down; held: frozen while the game is paused; expired: hit zero.\n  const T = { mode:'idle', endAt:0, left:HOLD_MS, raf:0 };\n  function timerColor(ms){\n    // green (full) -> orange (halfway) -> red (zero)\n    const p = Math.max(0, Math.min(1, ms / HOLD_MS));\n    const hue = p > 0.5 ? 30 + (p - 0.5) / 0.5 * (135 - 30) : (p / 0.5) * 30;\n    return 'hsl(' + hue.toFixed(1) + ' 78% 50%)';\n  }\n  function drawTimer(){\n    const el = document.getElementById('hold');\n    if(!el) return;\n    const ms = T.mode === 'running' ? Math.max(0, T.endAt - performance.now()) : T.left;\n    el.querySelector('.hold-num').textContent = (ms / 1000).toFixed(3);\n    el.style.setProperty('--hc', timerColor(ms));\n    el.querySelector('.hold-bar i').style.transform = 'scaleX(' + (ms / HOLD_MS).toFixed(4) + ')';\n    const off = G.phase === 'lobby' || G.phase === 'ended';\n    el.className = 'hold ' + T.mode + (off ? ' off' : '');\n    el.querySelector('.hold-hint').textContent =\n      off ? (G.phase === 'lobby' ? 'Starts with the game' : 'Round over') :\n      T.mode === 'running' ? 'Enter or click to restart' :\n      T.mode === 'held' ? 'Paused' :\n      T.mode === 'expired' ? 'Time’s up! Click their desk to put them out' :\n      'Press Enter when someone catches';\n  }\n  function tick(){\n    T.raf = 0;\n    if(T.mode !== 'running') return;\n    if(performance.now() >= T.endAt){ T.mode = 'expired'; T.left = 0; sfx('buzz'); drawTimer(); return; }\n    drawTimer();\n    T.raf = requestAnimationFrame(tick);\n  }\n  function runTimer(ms){\n    T.mode = 'running'; T.endAt = performance.now() + ms;\n    if(!T.raf) T.raf = requestAnimationFrame(tick);\n    drawTimer();\n  }\n  function restartTimer(){\n    if(G.phase === 'paused'){ toast('The game is paused. Press Space to resume.'); return; }\n    if(G.phase !== 'playing'){ toast('Start the game first (Space).'); return; }\n    runTimer(HOLD_MS);\n  }\n  // Keep the timer in step with the game: freezes on pause, picks up where it left off on resume.\n  function syncTimer(){\n    if(G.phase === 'playing'){ if(T.mode === 'held') runTimer(T.left); }\n    else if(G.phase === 'paused'){\n      if(T.mode === 'running'){ T.left = Math.max(0, T.endAt - performance.now()); T.mode = 'held'; }\n    }\n    else { T.mode = 'idle'; T.left = HOLD_MS; }\n    drawTimer();\n  }\n\n  // ---- rules screen ----\n  const rulesEl = $('#rules');\n  function rulesOpen(){ return !rulesEl.hidden; }\n  function openRules(){ rulesEl.hidden = false; $('#rulesClose').focus(); }\n  function closeRules(){ if(!rulesEl.hidden) rulesEl.hidden = true; }\n  function toggleRules(){ rulesOpen() ? closeRules() : openRules(); }\n  $('#rulesClose').addEventListener('click', closeRules);\n\n  // ---- sudden death ----\n  function sdTwist(){ return SD_TWISTS.find(t => t.id === G.sd) || null; }\n  // The 3-second twist shortens the hold timer for the rest of the round.\n  function applyHold(){\n    const ms = G.sd === 'three' ? 3000 : 5000;\n    if(ms === HOLD_MS) return;\n    HOLD_MS = ms;\n    if(T.mode === 'running') runTimer(ms);\n    else if(T.mode !== 'expired') T.left = ms;\n  }\n  let sdHide;\n  function showSd(tw){\n    const el = $('#sd');\n    el.querySelector('.sd-t').textContent = tw.text;\n    el.hidden = false; el.classList.remove('in'); void el.offsetWidth; el.classList.add('in');\n    clearTimeout(sdHide); sdHide = setTimeout(() => { el.hidden = true; }, 4500);\n  }\n  $('#sd').addEventListener('click', () => { clearTimeout(sdHide); $('#sd').hidden = true; });\n  function suddenDeath(){\n    if(G.phase !== 'playing' && G.phase !== 'paused') return;\n    const pool = SD_TWISTS.filter(t => t.id !== G.sd);\n    const tw = pool[Math.floor(Math.random() * pool.length)];\n    G.sd = tw.id;\n    sfx('sd'); render(); save(); showSd(tw);\n  }\n\n  const ACTIONS = { start, pause: togglePause, end: endRound, restart, undo, present: togglePresent, rules: toggleRules, sd: suddenDeath };\n  $$('[data-act]').forEach(b => b.addEventListener('click', () => ACTIONS[b.dataset.act]()));\n  $('#confirmCancel').addEventListener('click', () => $('#confirmDialog').close());\n  $('#confirmOk').addEventListener('click', () => { $('#confirmDialog').close(); doRestart(); });\n\n  // ---- keyboard ----\n  document.addEventListener('keydown', e => {\n    if(e.defaultPrevented || e.altKey) return;\n    if(document.querySelector('dialog[open]')) return;\n    const t = e.target;\n    if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) return;\n    const k = e.key.toLowerCase();\n    if((e.ctrlKey || e.metaKey) && k !== 'z') return;\n    if(rulesOpen() && (k === 'escape' || k === 'r')){ e.preventDefault(); closeRules(); return; }\n    if(k === 'enter' || k === 't'){ if(rulesOpen()) return; e.preventDefault(); restartTimer(); return; }\n    if(k === 'r'){ e.preventDefault(); openRules(); return; }\n    if(k === ' '){ e.preventDefault(); const wasOpen = rulesOpen(); closeRules(); if(G.phase === 'lobby') start(); else if(!wasOpen) togglePause(); }\n    else if(k === 'z'){ e.preventDefault(); undo(); }\n    else if(k === 'f'){ e.preventDefault(); togglePresent(); }\n    else if(k === 'd'){ e.preventDefault(); suddenDeath(); }\n    else if(k === 'm'){ setSound(!soundOn); toast(soundOn ? 'Sound on' : 'Sound off'); }\n    else if(k === 'escape' && host.classList.contains('present') && !fsEl()){ exitPresent(); }\n  });\n\n  // ---- seats dialog ----\n  const dlg = $('#seatsDialog');\n  $('#seatsBtn').addEventListener('click', () => {\n    $('#rosterText').value = [...new Set([...G.roster, ...G.seats.filter(Boolean)])].join('\\n');\n    dlg.showModal();\n  });\n  $('#seatsCancel').addEventListener('click', () => dlg.close());\n  function readNames(){\n    const seen = new Set();\n    return $('#rosterText').value.split('\\n').map(s=>s.trim()).filter(s => s && !seen.has(s.toLowerCase()) && seen.add(s.toLowerCase()));\n  }\n  function applySeats(names, seats){\n    const extra = names.filter(n => !seats.includes(n));\n    G.roster = names; G.seats = seats; G.out = {}; G.seq = 0; G.phase = 'lobby';\n    saveClassData(G.classKey, { roster:names, seats, layout:G.layout });\n    dlg.close(); render(); save();\n    if(extra.length) toast(extra.length + (extra.length===1?' student has':' students have') + ' no desk. Add a desk in the seating chart.');\n  }\n  $('#seatsFill').addEventListener('click', () => {\n    const names = readNames();\n    const seats = G.seats.map(n => n && names.includes(n) ? n : null);\n    const waiting = names.filter(n => !seats.includes(n));\n    fillOrder(seats.length).forEach(i => { if(!seats[i] && waiting.length) seats[i] = waiting.shift(); });\n    applySeats(names, seats);\n  });\n  $('#seatsShuffle').addEventListener('click', () => {\n    const names = readNames(), mixed = shuffle(names), seats = Array(G.layout.length).fill(null);\n    fillOrder(seats.length).forEach((i,k) => { if(mixed[k]) seats[i] = mixed[k]; });\n    applySeats(names, seats);\n  });\n\n  // ---- import from seating chart ----\n  const idlg = $('#importDialog'), ierr = $('#importErr');\n  $('#importBtn').addEventListener('click', () => { $('#importText').value = ''; ierr.hidden = true; idlg.showModal(); $('#importText').focus(); });\n  $('#importCancel').addEventListener('click', () => idlg.close());\n  $('#importConfirm').addEventListener('click', () => {\n    const text = $('#importText').value.trim();\n    if(!text){ ierr.textContent = 'Paste the text from the seating chart’s Export Setup first.'; ierr.hidden = false; return; }\n    let data;\n    try{ data = parseChartExport(text); }\n    catch(e){\n      ierr.textContent = 'That doesn’t look like a seating chart export. In the chart, click Export Setup, then Copy to Clipboard, and paste all of it here.';\n      ierr.hidden = false; return;\n    }\n    store.set('sb306-classes', data.classes);\n    store.set('sb306-class-order', data.order);\n    const sameClass = data.order.includes(G.classKey);\n    const key = sameClass ? G.classKey : data.order[0];\n    G = freshGame(key, sameClass ? G.round : 1);\n    idlg.close(); render(); save();\n    toast('Imported ' + data.order.length + (data.order.length === 1 ? ' class' : ' classes') + '. ' + G.seats.filter(Boolean).length + ' students seated in ' + key + '.');\n  });\n\n  // ---- render ----\n  function render(){\n    fillClassSelect(); buildMap(); applyHold();\n    sel.value = G.classKey;\n    const alive = aliveIdx(G), pl = places(G), seated = seatedIdx(G).length;\n    const winner = G.phase === 'ended' && alive.length === 1 ? alive[0] : -1;\n    const busy = G.phase === 'playing' || G.phase === 'paused';\n\n    seatEls.forEach((el, i) => {\n      const name = G.seats[i], out = name && isOut(G,i);\n      el.className = 'seat' + (name ? ' occupied' : '') + (out ? ' out' : '') + (i === winner ? ' winner' : '');\n      el.innerHTML = (name ? '\u003cspan class=\"np\">' + plateHTML(name) + '\u003c/span>' : MONITOR_SVG) +\n        '\u003cspan class=\"num\">' + pad2(i+1) + '\u003c/span>';\n      if(!name){ el.setAttribute('aria-label', 'Desk ' + (i+1) + ', open seat'); el.tabIndex = -1; el.removeAttribute('title'); return; }\n      el.tabIndex = 0; el.title = name;\n      if(out){ const p=document.createElement('span'); p.className='place'; p.textContent = ordinal(pl.map[i]); el.appendChild(p); }\n      el.setAttribute('aria-label', 'Desk ' + (i+1) + ', ' + name + (out ? ', out. Click to bring back.' : ', in. Click to put out.'));\n    });\n    fitNames(map);\n\n    // status\n    $('#status').className = 'status ' + G.phase;\n    $('#statusText').textContent = {\n      lobby: 'Round ' + G.round + ', waiting to start',\n      playing: 'Round ' + G.round + ' in play',\n      paused: 'Round ' + G.round + ' paused',\n      ended: 'Round ' + G.round + ' over'\n    }[G.phase];\n\n    // buttons (top bar and fullscreen bar)\n    const present = host.classList.contains('present');\n    $$('[data-act=\"start\"]').forEach(b => b.hidden = G.phase !== 'lobby');\n    $('#rulesClose').textContent = G.phase === 'lobby' ? 'Back to the room' : 'Back to the game';\n    $('#rules .hint').hidden = G.phase !== 'lobby';\n    $$('[data-act=\"pause\"]').forEach(b => {\n      b.hidden = !busy; b.textContent = G.phase === 'paused' ? 'Resume' : 'Pause';\n      b.classList.toggle('primary', G.phase === 'paused');\n    });\n    $$('[data-act=\"end\"]').forEach(b => b.hidden = !busy);\n    $$('[data-act=\"sd\"]').forEach(b => {\n      b.hidden = !(busy && alive.length >= 2 && alive.length \u003c= 3);\n      b.textContent = G.sd ? '⚡ New twist' : '⚡ Sudden death';\n    });\n    $$('[data-act=\"restart\"]').forEach(b => { b.hidden = G.phase === 'lobby'; b.classList.toggle('primary', G.phase === 'ended'); });\n    $$('[data-act=\"undo\"]').forEach(b => { b.hidden = G.phase === 'lobby'; b.disabled = !Object.keys(G.out).length; });\n    $('#seatsBtn').disabled = $('#importBtn').disabled = busy;\n    $('#seatsBtn').title = $('#importBtn').title = busy ? 'End the round first' : '';\n    sel.disabled = busy;\n\n    // banner\n    const ban = $('#banner');\n    if(winner >= 0){ ban.hidden=false; ban.className='banner win'; ban.textContent = G.seats[winner] + ' wins round ' + G.round + '!'; }\n    else if(G.phase === 'ended'){ ban.hidden=false; ban.className='banner'; ban.textContent = 'Round over. ' + alive.length + ' made it to the end.'; }\n    else if(G.phase === 'paused'){ ban.hidden=false; ban.className='banner'; ban.textContent = 'Paused. Everyone freeze.'; }\n    else if(G.phase === 'playing' && (G.sd || (alive.length === 2 && seated > 2))){\n      const tw = sdTwist(), two = alive.length === 2 && seated > 2;\n      ban.hidden = false; ban.className = 'banner final';\n      ban.textContent = tw\n        ? 'Sudden death: ' + tw.text + (two ? ' Throwing back is allowed.' : '')\n        : 'Final two: throwing straight back is allowed now.';\n    }\n    else if(G.phase === 'lobby' && present){ ban.hidden=false; ban.className='banner'; ban.textContent = 'Round ' + G.round + '. Get ready.'; }\n    else ban.hidden = true;\n\n    // side panel\n    $('#aliveCount').textContent = alive.length;\n    $('#aliveLabel').textContent = 'still in, of ' + seated;\n    const list = $('#outList'); list.innerHTML = '';\n    pl.order.forEach(i => {\n      const li = document.createElement('li');\n      const p = document.createElement('span'); p.className='pl'; p.textContent = ordinal(pl.map[i]);\n      const n = document.createElement('span'); n.textContent = G.seats[i];\n      li.append(p, n); list.appendChild(li);\n    });\n    $('#outEmpty').hidden = pl.order.length > 0;\n    $('#outCount').textContent = '(' + pl.order.length + ')';\n\n    // fullscreen bar\n    $('#dClass').textContent = G.classKey;\n    $('#dRound').textContent = G.round;\n    $('#dAlive').textContent = alive.length;\n    $('#dOf').textContent = '/ ' + seated;\n    $('#dLast').textContent = pl.order.length ? shortName(G.seats[pl.order[0]]) + ' (' + ordinal(pl.map[pl.order[0]]) + ')' : '—';\n\n    syncTimer();\n    requestAnimationFrame(fit);\n  }\n\n  render();\n  if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitNames(map));\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}</script>
<script>
(function(){
  const SOURCES = JSON.parse(document.getElementById('gameData').textContent);

  // One-time cleanup: drop any Period 3 roster the games saved on this page,
  // so the cleared rosters show up even if a game was opened before.
  try{
    if(!localStorage.getItem('306-p3-cleared')){
      ['hp306','sb306','fc306','hu306'].forEach(p => {
        const all = JSON.parse(localStorage.getItem(p + '-classes') || 'null');
        if(all && all['p3: HSB27']){ delete all['p3: HSB27']; localStorage.setItem(p + '-classes', JSON.stringify(all)); }

      localStorage.setItem('306-p3-cleared', '1');

  }catch(e){}

  const ART = {
    'silent-ball': `
      <svg viewBox="0 0 220 130" aria-hidden="true">

        <path d="M101 33 q9 -6 18 0" fill="none" stroke="var(--on-accent)" stroke-width="2.4" stroke-linecap="round" opacity=".55"/>
        <g transform="translate(14 14)" fill="none" stroke="var(--muted)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12 h7 l9 -8 v28 l-9 -8 h-7z" fill="var(--muted)" stroke="none"/>
          <path d="M26 10 l12 12 M38 10 l-12 12"/>
        </g>
      </svg>`,
    'hot-potato': `
      <svg viewBox="0 0 220 130" aria-hidden="true">
        <rect x="10" y="88" width="40" height="26" rx="4" fill="var(--desk)"/>
        <rect x="62" y="88" width="40" height="26" rx="4" fill="var(--desk)"/>
        <rect x="114" y="88" width="40" height="26" rx="4" fill="var(--desk)"/>
        <rect x="166" y="88" width="40" height="26" rx="4" fill="var(--desk)"/>
        <path d="M44 80 q14 -20 28 0 M96 80 q14 -20 28 0" fill="none" stroke="var(--art-line)" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>
        <circle cx="134" cy="66" r="16" fill="var(--accent)"/>
        <path d="M142 52 q8 -14 20 -18 q10 -4 14 -14" fill="none" stroke="var(--text)" stroke-width="3" stroke-linecap="round"/>
        <g transform="translate(176 18)">
          <circle r="12" fill="var(--fire-glow)" opacity=".55"/>
          <path d="M0 -11 L3 -3 L11 0 L3 3 L0 11 L-3 3 L-11 0 L-3 -3Z" fill="var(--fire)"/>
        </g>
      </svg>`,
    'four-corners': `
      <svg viewBox="0 0 220 130" aria-hidden="true">
        <rect x="50" y="8" width="120" height="114" rx="6" fill="none" stroke="var(--art-line)" stroke-width="3"/>
        <path d="M56 14 h34 q0 30 -34 32 z" fill="var(--c1)"/>
        <path d="M164 14 h-34 q0 30 34 32 z" fill="var(--c2)"/>
        <path d="M56 116 h34 q0 -30 -34 -32 z" fill="var(--c3)"/>
        <path d="M164 116 h-34 q0 -30 34 -32 z" fill="var(--c4)"/>
        <circle cx="110" cy="65" r="9" fill="var(--text)"/>
        <path d="M110 65 L72 33 M110 65 L148 97" stroke="var(--text)" stroke-width="2.4" stroke-dasharray="2 6" stroke-linecap="round"/>
      </svg>`,
    'heads-up-7-up': `
      <svg viewBox="0 0 220 130" aria-hidden="true">
        <text x="44" y="112" font-family="var(--sans)" font-weight="700" font-size="104" fill="var(--accent)">7</text>
        <g transform="translate(116 14)">
          <rect x="22" y="2" width="20" height="50" rx="10" fill="var(--text)" transform="rotate(-12 32 50)"/>
          <rect x="8" y="44" width="62" height="58" rx="14" fill="var(--text)"/>
          <path d="M42 60 h22 M42 74 h22 M42 88 h20" stroke="var(--art)" stroke-width="3" stroke-linecap="round"/>
        </g>
        <path d="M184 28 l10 -8 M190 44 h12" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
      </svg>`
  };

  const GAMES = [
    { id:'silent-ball', store:'sb306', file:'306_Silent_Ball.html', name:'Silent Ball',
      desc:'Toss the ball without making a sound. Talk, drop a good pass or throw a bad one, and you’re out. Last one in wins.' },
    { id:'hot-potato', store:'hp306', file:'306_Hot_Potato.html', name:'Hot Potato',
      desc:'Pass the ball to the next person while the fuse burns. Nobody knows when it will boom.' },
    { id:'four-corners', store:'fc306', file:'306_Four_Corners.html', name:'Four Corners',
      desc:'Pick a corner before the countdown ends. When a corner is called, everyone in it is out.' },
    { id:'heads-up-7-up', store:'hu306', file:'306_Heads_Up_7_Up.html', name:'Heads Up 7 Up',
      desc:'Heads down, thumbs up. Seven tappers sneak around the room. Guess who tapped you to score.' }
  ];
  const TOOLS = { 'seating-chart': { file:'306_Seating_Chart.html', name:'Seating Chart' } };

  // ---------- Class picker ----------
  // Lists every class the games or the seating chart know about, and remembers the pick.
  const DEFAULT_CLASSES = ['p1: GA2','p2: GA1','p3: HSB27','p4: FrS','p5: DA1'];
  function readJSON(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
  function knownClasses(){
    const list = [...DEFAULT_CLASSES];
    const add = arr => (arr || []).forEach(k => { if(typeof k === 'string' && k && !list.includes(k)) list.push(k); });
    const seat = readJSON('seatingChart306');
    if(seat && seat.classes) add(Object.keys(seat.classes));
    ['sb306','hp306','fc306','hu306'].forEach(p => {
      add(readJSON(p + '-class-order'));
      add(Object.keys(readJSON(p + '-classes') || {}));
    });
    return list;
  }
  let chosenClass = null;
  try{ chosenClass = localStorage.getItem('dash306-class'); }catch(e){}
  const chips = document.getElementById('chips');
  function renderChips(){
    const list = knownClasses();
    if(chosenClass && !list.includes(chosenClass)) chosenClass = null;
    chips.innerHTML = '';
    list.forEach(k => {
      const m = /^p(\d+)\s*:\s*(.*)$/i.exec(k);
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip';
      b.setAttribute('aria-pressed', String(k === chosenClass));
      b.innerHTML = m ? `<b>Period ${m[1]}</b><small></small>` : '<b></b>';
      if(m) b.querySelector('small').textContent = m[2]; else b.querySelector('b').textContent = k;
      b.addEventListener('click', () => {
        chosenClass = k;
        try{ localStorage.setItem('dash306-class', k); }catch(e){}
        renderChips();
        chips.querySelector('[aria-pressed="true"]').focus();
      });
      chips.appendChild(b);
    });
  }
  renderChips();

  // Load the dashboard's seating chart into a game before it opens.
  // A game left on a class whose seats changed starts that class fresh.
  function syncChart(prefix){
    const chart = readJSON('dash306-chart');
    if(!chart || !chart.classes || !Array.isArray(chart.order)) return false;
    try{
      const old = readJSON(prefix + '-classes') || {};
      const g = readJSON(prefix + '-game');
      if(g && JSON.stringify(old[g.classKey] || null) !== JSON.stringify(chart.classes[g.classKey] || null)) localStorage.removeItem(prefix + '-game');
      localStorage.setItem(prefix + '-classes', JSON.stringify(chart.classes));
      localStorage.setItem(prefix + '-class-order', JSON.stringify(chart.order));
      return true;
    }catch(e){ return false; }
  }

  // Switch an opened game (or the seating chart) to the chosen class.
  // Leaves it alone when it's already on that class, so a game in progress keeps going.
  function applyClass(d){
    const s = d && d.getElementById('classSelect');
    if(!chosenClass || !s || s.value === chosenClass) return;
    if(![...s.options].some(o => o.value === chosenClass)) return;
    s.value = chosenClass;
    s.dispatchEvent(new Event('change', { bubbles:true }));
  }

  const grid = document.getElementById('grid');
  const tiles = [];
  GAMES.forEach((g, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'game';
    b.setAttribute('aria-label', 'Play ' + g.name);
    b.innerHTML = `<span class="vote-count" hidden>0</span><div class="art">${ART[g.id]}</div>
      <div class="info"><h2>${g.name}</h2><p>${g.desc}</p>
      <div class="foot"><span class="key"><kbd>${i+1}</kbd>key</span><span class="play">Play</span></div></div>`;
    b.addEventListener('click', () => {
      if(mode === 'vote') addVote(i);
      else if(mode !== 'spinning') go(g.id);
    });
    grid.appendChild(b);
    tiles.push({ el:b, count:b.querySelector('.vote-count'), play:b.querySelector('.play') });
  });

  // ---------- Vote and Spin ----------
  // pick: tiles open games. vote: tiles count votes. spinning: a light hops between tiles.
  // result: the chosen game is lit, ready to play.
  const promptEl = document.getElementById('prompt'), modes = document.getElementById('modes');
  let mode = 'pick', votes = GAMES.map(() => 0), voteLog = [], chosen = -1, spinTimer = null;

  function sfx(notes, type, vol){
    try{
      if(!ensureAudio()) return;
      if(actx.state !== 'running') actx.resume();
      const t0 = actx.currentTime + 0.01;
      notes.forEach(([m, at, dur]) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = type || 'square'; o.frequency.value = 440 * Math.pow(2, (m - 69) / 12);
        g.gain.setValueAtTime(0, t0 + at);
        g.gain.linearRampToValueAtTime(vol || 0.08, t0 + at + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + dur);
        o.connect(g); g.connect(actx.destination);
        o.start(t0 + at); o.stop(t0 + at + dur + 0.02);
      });
    }catch(e){}
  }
  const PENTA = [69, 72, 74, 76];
  const voteBlip = i => sfx([[PENTA[i] + 12, 0, 0.12]], 'square', 0.07);
  const spinTick = n => sfx([[64 + (n % 8), 0, 0.06]], 'square', 0.05);
  const fanfare = () => sfx([[69,0,.14],[72,.09,.14],[76,.18,.14],[81,.27,.5],[76,.27,.5]], 'sawtooth', 0.06);

  function setTiles(){
    tiles.forEach((t, i) => {
      t.el.classList.toggle('lit', (mode === 'spinning' || mode === 'result') && i === chosen);
      t.el.classList.toggle('dim', mode === 'result' && i !== chosen);
      t.count.textContent = votes[i];
      t.count.hidden = !(mode === 'vote' || (mode === 'result' && voteLog.length) || (mode === 'spinning' && voteLog.length));
      t.play.textContent = mode === 'vote' ? 'Vote' : 'Play';
      t.el.setAttribute('aria-label', (mode === 'vote' ? 'Vote for ' : 'Play ') + GAMES[i].name + (mode === 'vote' ? ', ' + votes[i] + (votes[i] === 1 ? ' vote' : ' votes') : ''));
    });
    grid.classList.toggle('voting', mode === 'vote');
  }

  function pill(label, cls, onClick, disabled){
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'pill' + (cls ? ' ' + cls : ''); b.textContent = label;
    if(disabled) b.disabled = true;
    b.addEventListener('click', onClick); modes.appendChild(b); return b;
  }
  function renderModes(){
    modes.innerHTML = '';
    const total = votes.reduce((a, b) => a + b, 0);
    if(mode === 'pick'){
      promptEl.textContent = 'Pick a game';
      pill('Vote', '', startVote);
      pill('Spin', '', () => spin(GAMES.map((g, i) => i)));
    } else if(mode === 'vote'){
      promptEl.textContent = 'Vote for a game';
      pill('Done voting', 'primary', finishVote, !total);
      pill('Undo', '', undoVote, !total);
      pill('Cancel', '', reset);
      const n = document.createElement('span'); n.className = 'tally';
      n.textContent = total + (total === 1 ? ' vote' : ' votes'); modes.appendChild(n);
    } else if(mode === 'spinning'){
      pill('Spinning…', '', () => {}, true);
    } else if(mode === 'result'){
      promptEl.textContent = GAMES[chosen].name + ' it is!';
      pill('Play ' + GAMES[chosen].name, 'primary', () => go(GAMES[chosen].id)).focus();
      pill('Start over', '', reset);
    }
    setTiles();
  }

  function reset(){ clearTimeout(spinTimer); mode = 'pick'; votes = GAMES.map(() => 0); voteLog = []; chosen = -1; renderModes(); }
  function startVote(){ reset(); mode = 'vote'; renderModes(); }
  function addVote(i){
    votes[i]++; voteLog.push(i); voteBlip(i); renderModes();
    const c = tiles[i].count; c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump');
  }
  function undoVote(){ if(!voteLog.length) return; votes[voteLog.pop()]--; renderModes(); }
  function finishVote(){
    const top = Math.max(...votes);
    const leaders = votes.map((v, i) => v === top ? i : -1).filter(i => i >= 0);
    if(leaders.length === 1){ chosen = leaders[0]; mode = 'result'; fanfare(); renderModes(); }
    else { spin(leaders, 'It’s a tie! Spinning…'); }
  }

  // Lights hop from tile to tile, slowing down, and land on a random choice.
  function spin(pool, label){
    clearTimeout(spinTimer);
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const target = pool[Math.floor(Math.random() * pool.length)];
    let hops = reduce ? 0 : pool.length * 4 + pool.indexOf(target) + 1;
    let pos = reduce ? pool.indexOf(target) : 0, n = 0;
    mode = 'spinning'; renderModes();
    promptEl.textContent = label || 'Spinning…';
    const step = () => {
      chosen = pool[pos % pool.length]; setTiles(); if(hops) spinTick(n);
      if(hops <= 1){ spinTimer = setTimeout(() => { mode = 'result'; fanfare(); renderModes(); }, reduce ? 0 : 350); return; }
      hops--; pos++; n++;
      const delay = 70 + Math.pow(n / (pool.length * 4 + pool.length), 2.2) * 330;
      spinTimer = setTimeout(step, delay);
    };
    // Start so the final hop lands on the target
    if(hops) pos = (pool.indexOf(target) - (hops - 1) % pool.length + pool.length * 100) % pool.length;
    step();
  }

  renderModes();

  const home = document.getElementById('home');
  const stage = document.getElementById('stage');
  const frame = document.getElementById('frame');
  const back = document.getElementById('back');
  let current = null, synced = false;

  function lookup(id){ return GAMES.find(g => g.id === id) || TOOLS[id]; }
  function go(id){ if(location.hash !== '#' + id) location.hash = id; else show(); }

  function show(){
    const id = location.hash.slice(1);
    const g = lookup(id);
    if(!g){
      if(current){ frame.removeAttribute('srcdoc'); frame.src = 'about:blank'; current = null; }
      stage.hidden = true; back.hidden = true; home.hidden = false;
      document.title = 'Room 306 Games';
      renderChips();
      if(typeof reset === 'function' && mode !== 'pick') reset();
      // Take focus back from the game frame so the 1-4 keys work again
      setTimeout(() => { try{ window.focus(); document.getElementById('floor').focus({ preventScroll:true }); }catch(e){} }, 0);
      if(typeof syncMusic === 'function') syncMusic();
      return;
    }
    if(current !== id){
      current = id;
      frame.title = g.name;
      back.hidden = true;
      synced = g.store ? syncChart(g.store) : false;
      frame.srcdoc = SOURCES[g.file];
    }
    home.hidden = true; stage.hidden = false;
    if(typeof syncMusic === 'function') syncMusic();
    document.title = g.name + ' | Room 306';
  }

  // Put an "All games" button at the start of each game's own top bar.
  // If a game has no bar to hold it, the floating button stays as a fallback.
  frame.addEventListener('load', () => {
    if(!current || stage.hidden) return;
    let placed = false;
    try{
      const d = frame.contentDocument;
      const brand = d && d.querySelector('.brand');
      if(brand && brand.parentNode){
        const b = d.createElement('button');
        b.type = 'button';
        b.setAttribute('aria-label', 'Back to all games');
        b.innerHTML = '<svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" fill="currentColor"><rect x="2" y="2" width="7" height="7" rx="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5"/></svg><span>All games</span>';
        b.style.cssText = 'display:inline-flex;align-items:center;gap:7px;flex-shrink:0;margin-right:6px;padding:8px 13px;border-radius:999px;border:2px solid var(--accent,#9E1B32);background:transparent;color:inherit;font:600 14px/1 inherit;font-family:inherit;cursor:pointer;';
        b.querySelector('svg').style.color = 'var(--accent,#9E1B32)';
        b.addEventListener('click', goHome);
        brand.parentNode.insertBefore(b, brand);
        placed = true;
      }
      // Seats come from the dashboard's chart, so swap the game's own import and seat editor
      // for a button that opens the chart.
      if(synced){
        const imp = d.getElementById('importBtn'), seats = d.getElementById('seatsBtn');
        if(seats){
          const c = d.createElement('button');
          c.type = 'button'; c.className = seats.className; c.textContent = 'Seating chart';
          c.title = 'Seats for every game come from the seating chart';
          c.addEventListener('click', () => go('seating-chart'));
          seats.parentNode.insertBefore(c, seats);
          seats.hidden = true; seats.style.display = 'none';
        }
        if(imp){ imp.hidden = true; imp.style.display = 'none'; }
      }
      applyClass(d);
      frame.contentWindow.focus();
    }catch(e){}
    back.hidden = placed || stage.hidden;
  });

  function goHome(){
    if(location.hash){ history.pushState(null, '', location.pathname + location.search); }
    show();
  }

  back.addEventListener('click', goHome);
  document.getElementById('seatBtn').addEventListener('click', () => go('seating-chart'));

  document.addEventListener('keydown', e => {
    if(!home.hidden && !e.metaKey && !e.ctrlKey && !e.altKey){
      const n = parseInt(e.key, 10);
      if(n >= 1 && n <= GAMES.length){
        e.preventDefault();
        if(mode === 'vote') addVote(n - 1);
        else if(mode !== 'spinning') go(GAMES[n-1].id);
      }
      else if(e.key === 'Escape' && mode !== 'pick') reset();
    }
  });

  // Full screen
  const fsBtn = document.getElementById('fsBtn'), fsLabel = document.getElementById('fsLabel');
  const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  const canFs = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
  if(!canFs) fsBtn.hidden = true;
  fsBtn.addEventListener('click', () => {
    const el = document.documentElement;
    if(isFs()){ (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
    else{
      const r = el.requestFullscreen ? el.requestFullscreen() : (el.webkitRequestFullscreen ? el.webkitRequestFullscreen() : null);
      if(r && r.catch) r.catch(() => {});
    }
  });
  const syncFs = () => { fsLabel.textContent = isFs() ? 'Exit full screen' : 'Full screen'; };
  document.addEventListener('fullscreenchange', syncFs);
  document.addEventListener('webkitfullscreenchange', syncFs);

  // Music: plays only on the game picker, fades out when a game opens
  const musicBtn = document.getElementById('musicBtn'), musicLabel = document.getElementById('musicLabel');
  let musicOn = false, gestured = false;
  try{ musicOn = localStorage.getItem('dash306-music') === 'on'; }catch(e){}
  let actx = null, master = null, schedule = null, timer = null, step = 0, nextTime = 0, running = false, stopTimer = null;
  const VOLUME = 0.55;
  function ensureAudio(){
    if(actx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return false;
    actx = new AC();
    master = actx.createGain(); master.gain.value = 0;
    const comp = actx.createDynamicsCompressor();
    master.connect(comp); comp.connect(actx.destination);
    schedule = makeSynthwave(actx, master);
    return true;
  }
  function tick(){
    while(nextTime < actx.currentTime + 0.2){ schedule(step, nextTime); nextTime += 60 / 112 / 4; step++; }
  }
  function startMusic(){
    if(!ensureAudio()) return;
    if(actx.state !== 'running') actx.resume();
    clearTimeout(stopTimer);
    const now = actx.currentTime;
    master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(master.gain.value, now);
    master.gain.linearRampToValueAtTime(VOLUME, now + 1.2);
    if(running) return;
    running = true; step = 0; nextTime = now + 0.08;
    timer = setInterval(tick, 25); tick();
  }
  function stopMusic(){
    if(!actx || !running) return;
    const now = actx.currentTime;
    master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(master.gain.value, now);
    master.gain.linearRampToValueAtTime(0, now + 0.5);
    clearTimeout(stopTimer);
    stopTimer = setTimeout(() => { clearInterval(timer); running = false; actx.suspend(); }, 600);
  }
  function syncMusic(){
    musicBtn.setAttribute('aria-pressed', String(musicOn));
    musicLabel.textContent = musicOn ? 'Music on' : 'Music off';
    if(musicOn && gestured && !home.hidden && !document.hidden) startMusic(); else stopMusic();
  }
  musicBtn.addEventListener('click', () => {
    gestured = true;
    musicOn = !musicOn;
    try{ localStorage.setItem('dash306-music', musicOn ? 'on' : 'off'); }catch(e){}
    syncMusic();
  });
  // Browsers only allow sound after a tap or key press, so a saved "on" waits for the first one.
  const firstTouch = e => {
    gestured = true;
    removeEventListener('pointerdown', firstTouch, true); removeEventListener('keydown', firstTouch, true);
    if(e.target && e.target.closest && e.target.closest('#musicBtn')) return;
    setTimeout(syncMusic, 0);
  };
  addEventListener('pointerdown', firstTouch, true); addEventListener('keydown', firstTouch, true);
  document.addEventListener('visibilitychange', () => { if(actx) syncMusic(); });

  window.addEventListener('hashchange', show);
  show();
})();
</script>
</body>
</html>
