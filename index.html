-shadow:inset 0 0 0 1px var(--tile-edge), 0 3px 0 rgba(0,0,0,.55); }\n.front.heads{ background:color-mix(in srgb, var(--accent) 16%, var(--tile)); }\n.front.up{ box-shadow:inset 0 0 0 3px var(--amber), 0 3px 0 rgba(0,0,0,.55); }\n.f-lbl{ font-size:16px; font-weight:700; }\n.f-big{ font-size:52px; font-weight:700; line-height:1.02; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; }\n.front.heads .f-big{ color:var(--accent); }\n.front.up .f-big{ color:color-mix(in srgb, var(--amber) 72%, var(--text)); }\n.front.quiet .f-big{ color:var(--tile-num); }\n.f-hint{ font-size:14px; color:var(--muted); }\n.f-chips{ display:flex; flex-wrap:wrap; gap:6px; }\n.f-chips span{\n  background:color-mix(in srgb, var(--amber) 34%, var(--paper)); color:var(--ink); border-left:4px solid var(--amber);\n  border-radius:4px; padding:3px 9px; font-size:18px; font-weight:700; white-space:nowrap;\n}\n.f-btns{ display:flex; gap:10px; }\n.f-btns .btn{ font-size:17px; padding:8px 16px; font-weight:700; }\n.btn.ok{ background:var(--live); border-color:var(--live); color:var(--on-live); }\n.btn.ok:hover:not(:disabled){ filter:brightness(1.08); border-color:var(--live); }\n.btn.no{ background:var(--accent); border-color:var(--accent); color:#fff; }\n.btn.no:hover:not(:disabled){ background:var(--accent-dark); border-color:var(--accent-dark); }\n.f-btns kbd{ background:rgba(255,255,255,.2); border-color:rgba(255,255,255,.35); color:inherit; margin-left:6px; }\n/* ---------- Side panel ---------- */\n.side{\n  background:var(--panel); border-left:1px solid var(--border); padding:16px;\n  display:flex; flex-direction:column; gap:16px; overflow-y:auto; min-height:0;\n}\n.count b{ display:block; font-size:60px; line-height:.9; font-weight:700; }\n.count span{ font-size:14px; color:var(--muted); }\n.side h2{ font-size:14px; margin:0 0 10px; display:flex; gap:6px; align-items:center; }\n.side h2 small{ font-family:var(--mono); font-size:11px; color:var(--muted); font-weight:400; }\n.outlist{ list-style:none; margin:0; padding:0; }\n.outlist li{\n  display:flex; gap:10px; align-items:baseline; font-size:14px;\n  background:var(--tile); color:var(--muted); border-left:5px solid var(--accent);\n  border-radius:5px; padding:7px 10px; margin-bottom:7px;\n}\n.outlist .pl{ font-weight:700; color:var(--text); min-width:32px; }\n.empty-note{ font-size:12.5px; color:var(--muted); font-style:italic; margin:0; padding:4px; }\n.keys{ margin-top:auto; border-top:1px solid var(--border); padding-top:12px; font-size:12.5px; color:var(--muted); }\n.keys h2{ margin-bottom:8px; }\n.keys dl{ display:grid; grid-template-columns:auto 1fr; gap:6px 10px; margin:0; align-items:center; }\n.keys dt{ margin:0; }\n.keys dd{ margin:0; }\nkbd{\n  font-family:var(--mono); font-size:11px; color:var(--text); background:var(--tile);\n  border:1px solid var(--tile-edge); border-bottom-width:2px; border-radius:4px; padding:1px 6px;\n}\n\n.toast{\n  position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);\n  background:var(--paper); color:var(--ink); border-left:5px solid var(--accent);\n  padding:10px 16px; border-radius:6px; font-size:15px; z-index:20; box-shadow:0 10px 24px rgba(0,0,0,.45);\n  opacity:0; pointer-events:none; transition:opacity .2s ease;\n}\n.toast.show{ opacity:1; }\n\n/* ---------- Dialogs ---------- */\ndialog{\n  background:var(--panel); color:var(--text); border:1px solid var(--border); border-top:4px solid var(--accent);\n  border-radius:10px; padding:22px; width:min(440px, 92vw); box-shadow:0 20px 50px rgba(0,0,0,.6);\n}\ndialog::backdrop{ background:rgba(0,0,0,.7); backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px); }\ndialog h3{ margin:0 0 6px; font-size:17px; }\ndialog p{ margin:0 0 12px; font-size:13px; color:var(--muted); line-height:1.45; }\ndialog ol{ margin:0 0 12px; padding-left:20px; font-size:13px; color:var(--muted); line-height:1.6; }\ndialog textarea{\n  width:100%; min-height:200px; resize:vertical; background:var(--field-bg); color:var(--text);\n  border:1px solid var(--border); border-radius:6px; padding:10px; font:inherit; font-size:14px; line-height:1.5;\n}\ndialog textarea:focus{ border-color:var(--accent); outline:none; }\n#importText{ font-family:var(--mono); font-size:12px; white-space:pre; }\ndialog .err{ color:var(--danger-text); font-size:13px; margin:10px 0 0; }\n.actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap; }\n\n/* ---------- Rules screen (for the projector) ---------- */\n.rules{\n  position:fixed; inset:0; z-index:15; overflow-y:auto;\n  background-color:var(--floor);\n  background-image:radial-gradient(circle, var(--floor-dot) 1px, transparent 1.4px);\n  background-size:25px 25px;\n  padding:calc(28px + env(safe-area-inset-top,0px)) 4vw calc(28px + env(safe-area-inset-bottom,0px));\n  display:flex; flex-direction:column; gap:clamp(16px, 2.6vh, 30px);\n}\n.rules-head{ display:flex; align-items:center; gap:16px; }\n.rules-head .brand-mark{ width:clamp(40px, 4vw, 60px); height:clamp(40px, 4vw, 60px); border-width:3px; }\n.rules-head .brand-mark::after{ width:42%; height:42%; }\n.rules-head h2{ margin:0; font-size:clamp(34px, 4.6vw, 70px); font-weight:700; line-height:1; letter-spacing:-.01em; }\n.rules-head p{ margin:4px 0 0; font-size:clamp(15px, 1.4vw, 22px); color:var(--muted); }\n.rules-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:clamp(14px, 1.6vw, 26px); flex:1; }\n.rule-card{\n  background:var(--paper); color:var(--ink); border-radius:8px; border-left:10px solid var(--ink-soft);\n  padding:clamp(16px, 1.8vw, 30px) clamp(16px, 1.8vw, 30px) clamp(16px, 1.8vw, 30px) clamp(18px, 2vw, 34px);\n  box-shadow:0 4px 0 rgba(0,0,0,.55);\n}\n.rule-card.out{ border-left-color:var(--accent); }\n.rule-card.safe{ border-left-color:var(--live); }\n.rule-card h3{ margin:0 0 clamp(10px, 1.4vh, 18px); font-size:clamp(22px, 2.3vw, 38px); line-height:1.05; }\n.rule-card ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:clamp(8px, 1.3vh, 16px); }\n.rule-card li{ font-size:clamp(17px, 1.65vw, 28px); line-height:1.25; font-weight:500; padding-left:1.1em; position:relative; }\n.rule-card li::before{\n  content:''; position:absolute; left:0; top:.42em; width:.45em; height:.45em; border-radius:2px; background:var(--ink-soft);\n}\n.rule-card.out li::before{ background:var(--accent); }\n.rule-card.safe li::before{ background:var(--live); border-radius:50%; }\n.rule-card li b{ font-weight:700; }\n.rules-foot{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }\n.rules-foot .call{ font-size:clamp(16px, 1.5vw, 24px); font-weight:600; margin-right:auto; }\n.rules-foot .btn{ font-size:clamp(14px, 1.2vw, 18px); padding:10px 18px; }\n.rules-foot .hint{ font-size:13px; color:var(--muted); }\n\n@media (max-width:820px){\n  .main{ grid-template-columns:1fr; grid-template-rows:60vh auto; }\n  .side{ border-left:none; border-top:1px solid var(--border); }\n  .keys{ display:none; }\n}\n@media (prefers-reduced-motion: reduce){\n  *{ animation:none !important; transition:none !important; }\n}\n/* ---------- Side lists ---------- */\n.scorelist{ list-style:none; margin:0; padding:0; }\n.scorelist li{\n  display:flex; gap:10px; align-items:baseline; font-size:14px;\n  background:var(--tile); color:var(--text); border-left:5px solid var(--tile-edge);\n  border-radius:5px; padding:7px 10px; margin-bottom:7px;\n}\n.scorelist li.top{ border-left-color:var(--live); }\n.scorelist .pl{ font-weight:700; min-width:32px; color:var(--muted); }\n.scorelist .nm{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }\n.scorelist .pt{ font-family:var(--mono); font-weight:500; }\n.guesslist li{ border-left-color:var(--accent); color:var(--muted); }\n.guesslist li.ok{ border-left-color:var(--live); }\n.guesslist li b{ color:var(--text); }\n.guesslist .mk{ margin-left:auto; font-weight:700; color:var(--text); }\n.rule-card.pts{ border-left-color:var(--live); }\n.rule-card.pts li::before{ background:var(--live); border-radius:50%; }\ndialog select{ max-width:none; width:100%; }\ndialog .field{ font-size:13px; font-weight:600; color:var(--text); margin:16px 0 8px; }\ndialog .field:first-of-type{ margin-top:12px; }\n.opt{\n  display:flex; gap:10px; align-items:flex-start; padding:10px 12px; margin-bottom:8px;\n  background:var(--field-bg); border:1px solid var(--border); border-radius:6px; cursor:pointer; font-size:14px;\n}\n.opt:has(input:checked){ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, var(--field-bg)); }\n.opt input{ margin-top:3px; accent-color:var(--accent); }\n.opt b{ display:block; font-weight:600; }\n.opt small{ display:block; color:var(--muted); font-size:12.5px; margin-top:2px; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv id=\"host\">\n  \u003cheader class=\"bar\">\n    \u003cdiv class=\"brand\">\u003cspan class=\"brand-mark\" aria-hidden=\"true\">\u003c/span>\u003ch1>306 Heads Up 7 Up\u003c/h1>\u003c/div>\n    \u003cselect id=\"classSelect\" aria-label=\"Class period\">\u003c/select>\n    \u003cspan class=\"status\" id=\"status\">\u003ci>\u003c/i>\u003cspan id=\"statusText\">Waiting to start\u003c/span>\u003c/span>\n    \u003cdiv class=\"spacer\">\u003c/div>\n    \u003cbutton class=\"btn\" id=\"importBtn\">Import chart\u003c/button>\n    \u003cbutton class=\"btn\" id=\"seatsBtn\">Edit seats\u003c/button>\n    \u003cbutton class=\"btn\" id=\"settingsBtn\">Settings\u003c/button>\n    \u003cbutton class=\"btn\" data-act=\"rules\">Rules\u003c/button>\n    \u003cbutton class=\"btn\" id=\"soundBtn\" aria-pressed=\"true\">🔊 Sound on\u003c/button>\n    \u003cspan class=\"sep\" aria-hidden=\"true\">\u003c/span>\n    \u003cbutton class=\"btn\" data-act=\"undo\">Undo\u003c/button>\n    \u003cbutton class=\"btn primary\" data-act=\"next\">Pick tappers\u003c/button>\n    \u003cbutton class=\"btn\" data-act=\"end\">End game\u003c/button>\n    \u003cbutton class=\"btn\" data-act=\"restart\">New game\u003c/button>\n    \u003cbutton class=\"btn\" data-act=\"present\">📺 Fullscreen View\u003c/button>\n  \u003c/header>\n\n  \u003cdiv class=\"dash\" id=\"dash\">\n    \u003cdiv class=\"item\">\u003cspan class=\"lbl\">Class\u003c/span>\u003cspan id=\"dClass\">—\u003c/span>\u003c/div>\n    \u003cdiv class=\"item\">\u003cspan class=\"lbl\">Round\u003c/span>\u003cspan class=\"big\" id=\"dRound\">—\u003c/span>\u003c/div>\n    \u003cdiv class=\"item\">\u003cspan class=\"lbl\">Tappers\u003c/span>\u003cspan id=\"dTappers\">7\u003c/span>\u003c/div>\n    \u003cdiv class=\"item\">\u003cspan class=\"lbl\">Leader\u003c/span>\u003cspan id=\"dLeader\">—\u003c/span>\u003c/div>\n    \u003cdiv class=\"acts\">\n      \u003cbutton class=\"btn\" data-act=\"rules\">Rules\u003c/button>\n      \u003cbutton class=\"btn\" data-act=\"undo\">Undo\u003c/button>\n      \u003cbutton class=\"btn primary\" data-act=\"next\">Pick tappers\u003c/button>\n      \u003cbutton class=\"btn\" data-act=\"end\">End game\u003c/button>\n      \u003cbutton class=\"btn\" data-act=\"restart\">New game\u003c/button>\n      \u003cbutton class=\"btn primary\" data-act=\"present\">🛠️ Edit Mode\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"main\">\n    \u003cdiv class=\"stage\" id=\"stage\">\n      \u003cdiv class=\"map\" id=\"map\">\u003c/div>\n      \u003cdiv class=\"banner\" id=\"banner\" hidden>\u003c/div>\n    \u003c/div>\n    \u003caside class=\"side\">\n      \u003cdiv class=\"count\">\u003cb id=\"roundNum\">—\u003c/b>\u003cspan id=\"roundLabel\">no rounds yet\u003c/span>\u003c/div>\n      \u003cdiv>\n        \u003ch2>This round \u003csmall id=\"guessCount\">\u003c/small>\u003c/h2>\n        \u003col class=\"scorelist guesslist\" id=\"guessList\">\u003c/ol>\n        \u003cp class=\"empty-note\" id=\"guessEmpty\">Guesses show up here.\u003c/p>\n      \u003c/div>\n      \u003cdiv>\n        \u003ch2>Scores \u003csmall id=\"scoreCount\">\u003c/small>\u003c/h2>\n        \u003col class=\"scorelist\" id=\"scoreList\">\u003c/ol>\n        \u003cp class=\"empty-note\" id=\"scoreEmpty\">No points yet. A right guess is 1 point, and a tapper nobody catches gets 1 point.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"keys\">\n        \u003ch2>Shortcuts\u003c/h2>\n        \u003cdl>\n          \u003cdt>\u003ckbd>Space\u003c/kbd>\u003c/dt>\u003cdd>Next step\u003c/dd>\n          \u003cdt>\u003ckbd>Y\u003c/kbd> \u003ckbd>N\u003c/kbd>\u003c/dt>\u003cdd>Guess right or wrong\u003c/dd>\n          \u003cdt>\u003ckbd>Z\u003c/kbd>\u003c/dt>\u003cdd>Undo\u003c/dd>\n          \u003cdt>\u003ckbd>S\u003c/kbd>\u003c/dt>\u003cdd>Settings\u003c/dd>\n          \u003cdt>\u003ckbd>F\u003c/kbd>\u003c/dt>\u003cdd>Fullscreen view\u003c/dd>\n          \u003cdt>\u003ckbd>M\u003c/kbd>\u003c/dt>\u003cdd>Sound on or off\u003c/dd>\n          \u003cdt>\u003ckbd>R\u003c/kbd>\u003c/dt>\u003cdd>Rules screen\u003c/dd>\n        \u003c/dl>\n      \u003c/div>\n    \u003c/aside>\n  \u003c/div>\n\u003c/div>\n\n\u003cdialog id=\"seatsDialog\">\n  \u003ch3>Edit seats\u003c/h3>\n  \u003cp>One student per line. Students already on the chart keep their desks.\u003c/p>\n  \u003ctextarea id=\"rosterText\" spellcheck=\"false\">\u003c/textarea>\n  \u003cdiv class=\"actions\">\n    \u003cbutton class=\"btn\" id=\"seatsCancel\">Cancel\u003c/button>\n    \u003cbutton class=\"btn\" id=\"seatsShuffle\">Shuffle everyone\u003c/button>\n    \u003cbutton class=\"btn primary\" id=\"seatsFill\">Save seats\u003c/button>\n  \u003c/div>\n\u003c/dialog>\n\n\u003cdialog id=\"importDialog\">\n  \u003ch3>Import from seating chart\u003c/h3>\n  \u003col>\n    \u003cli>In the 306 Seating Chart, click Export Setup.\u003c/li>\n    \u003cli>Click Copy to Clipboard, then paste it below.\u003c/li>\n  \u003c/ol>\n  \u003cp>This replaces the game’s classes, desks and seats with the chart’s. Students on the Dropped list are left out.\u003c/p>\n  \u003ctextarea id=\"importText\" spellcheck=\"false\" placeholder=\"const CLASS_DATA = {&#10;  &quot;p1: GA2&quot;: {&#10;    roster: [ … ],&#10;    desks: [ … ]&#10;  },&#10;  …&#10;};\">\u003c/textarea>\n  \u003cp class=\"err\" id=\"importErr\" role=\"alert\" hidden>\u003c/p>\n  \u003cdiv class=\"actions\">\n    \u003cbutton class=\"btn\" id=\"importCancel\">Cancel\u003c/button>\n    \u003cbutton class=\"btn primary\" id=\"importConfirm\">Import\u003c/button>\n  \u003c/div>\n\u003c/dialog>\n\n\u003cdialog id=\"settingsDialog\">\n  \u003ch3>Game settings\u003c/h3>\n  \u003cp class=\"field\">Number of tappers\u003c/p>\n  \u003cselect id=\"nSel\" aria-label=\"Number of tappers\">\n    \u003coption value=\"3\">3 tappers\u003c/option>\n    \u003coption value=\"4\">4 tappers\u003c/option>\n    \u003coption value=\"5\">5 tappers\u003c/option>\n    \u003coption value=\"6\">6 tappers\u003c/option>\n    \u003coption value=\"7\">7 tappers\u003c/option>\n    \u003coption value=\"8\">8 tappers\u003c/option>\n    \u003coption value=\"9\">9 tappers\u003c/option>\n    \u003coption value=\"10\">10 tappers\u003c/option>\n  \u003c/select>\n  \u003cp style=\"margin-top:8px\">With a small class there are never more tappers than half the students seated.\u003c/p>\n  \u003cp class=\"field\">Who gets picked\u003c/p>\n  \u003clabel class=\"opt\">\u003cinput type=\"radio\" name=\"fair\" value=\"fair\">\u003cspan>\u003cb>Everyone gets a turn\u003c/b>\u003csmall>Students who’ve tapped the fewest times this game go first.\u003c/small>\u003c/span>\u003c/label>\n  \u003clabel class=\"opt\">\u003cinput type=\"radio\" name=\"fair\" value=\"any\">\u003cspan>\u003cb>Anyone at random\u003c/b>\u003csmall>Any student can be picked, but not the same tappers two rounds in a row.\u003c/small>\u003c/span>\u003c/label>\n  \u003cp>Changes start with the next round.\u003c/p>\n  \u003cdiv class=\"actions\">\n    \u003cbutton class=\"btn\" id=\"settingsCancel\">Cancel\u003c/button>\n    \u003cbutton class=\"btn primary\" id=\"settingsSave\">Save settings\u003c/button>\n  \u003c/div>\n\u003c/dialog>\n\n\u003cdialog id=\"confirmDialog\">\n  \u003ch3>Start a new game?\u003c/h3>\n  \u003cp>Scores and tapper turns go back to zero. This can’t be undone.\u003c/p>\n  \u003cdiv class=\"actions\">\n    \u003cbutton class=\"btn\" id=\"confirmCancel\">Cancel\u003c/button>\n    \u003cbutton class=\"btn danger\" id=\"confirmOk\">New game\u003c/button>\n  \u003c/div>\n\u003c/dialog>\n\n\u003csection class=\"rules\" id=\"rules\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"rulesTitle\" hidden>\n  \u003cheader class=\"rules-head\">\n    \u003cspan class=\"brand-mark\" aria-hidden=\"true\">\u003c/span>\n    \u003cdiv>\n      \u003ch2 id=\"rulesTitle\">Heads Up 7 Up\u003c/h2>\n      \u003cp>Room 306 rules\u003c/p>\n    \u003c/div>\n  \u003c/header>\n  \u003cdiv class=\"rules-grid\">\n    \u003carticle class=\"rule-card\">\n      \u003ch3>How to play\u003c/h3>\n      \u003cul>\n        \u003cli>The screen picks \u003cb id=\"ruleN\">7\u003c/b> tappers. They come to the \u003cb>front\u003c/b>.\u003c/li>\n        \u003cli>\u003cb>Heads down, thumbs up.\u003c/b> Everyone else hides their eyes and holds up one thumb.\u003c/li>\n        \u003cli>Each tapper \u003cb>gently presses one thumb\u003c/b>, then goes back to the front.\u003c/li>\n        \u003cli>Thumb pressed? \u003cb>Put it down\u003c/b> and stay quiet.\u003c/li>\n        \u003cli>\u003cb>Heads up!\u003c/b> If you were tapped, \u003cb>stand up\u003c/b> and guess who tapped you.\u003c/li>\n      \u003c/ul>\n    \u003c/article>\n    \u003carticle class=\"rule-card pts\">\n      \u003ch3>Points\u003c/h3>\n      \u003cul>\n        \u003cli>Guess your tapper right: \u003cb>1 point\u003c/b>.\u003c/li>\n        \u003cli>Tapper nobody catches: \u003cb>1 point\u003c/b>.\u003c/li>\n        \u003cli>New tappers every round.\u003c/li>\n        \u003cli>\u003cb>Most points\u003c/b> at the end wins.\u003c/li>\n      \u003c/ul>\n    \u003c/article>\n    \u003carticle class=\"rule-card out\">\n      \u003ch3>Play fair\u003c/h3>\n      \u003cul>\n        \u003cli>\u003cb>No peeking.\u003c/b> Head down, eyes closed. Peek and your guess doesn’t count.\u003c/li>\n        \u003cli>\u003cb>Gentle taps\u003c/b> on the thumb only.\u003c/li>\n        \u003cli>Tappers stay \u003cb>silent\u003c/b>. No hints, no giggling.\u003c/li>\n        \u003cli>Walk, don’t run. \u003cb>Stay away from the computers.\u003c/b>\u003c/li>\n      \u003c/ul>\n    \u003c/article>\n  \u003c/div>\n  \u003cfooter class=\"rules-foot\">\n    \u003cspan class=\"call\">The teacher’s call is final.\u003c/span>\n    \u003cspan class=\"hint\">Space picks the tappers\u003c/span>\n    \u003cbutton class=\"btn\" id=\"rulesClose\">Back to the room\u003c/button>\n    \u003cbutton class=\"btn primary\" data-act=\"next\">Pick tappers\u003c/button>\n  \u003c/footer>\n\u003c/section>\n\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\">\u003c/div>\n\n\u003cscript>\n(function(){\n  const $ = s => document.querySelector(s);\n  const $$ = s => [...document.querySelectorAll(s)];\n  const DESK_W = 130, DESK_H = 84;\n  const TEACHER_DESK = { x: 133, y: 257, w: 130, h: 229 };\n  // Hold timer: open floor above the Teacher Desk, lined up with desk 27's right edge.\n  const TIMER_BOX = { x: 133, y: 52, w: 458, h: 180 };\n  const MONITOR_SVG = '\u003csvg viewBox=\"0 0 24 24\" width=\"26\" height=\"26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"4\" width=\"18\" height=\"12\" rx=\"1.5\"/>\u003cpath d=\"M9 20h6M12 16v4\"/>\u003c/svg>';\n\n  // Room 306 desk layout (from the seating chart), desk 01 first.\n  const LAYOUT = [\n    [1313,690],[1171,690],[1030,690],[888,690],[746,690],[605,690],[462,690],[318,690],[171,690],[27,688],\n    [1160,257],[1304,257],[1159,402],[1304,402],[1160,521],\n    [920,150],[920,243],[920,335],[920,429],[920,522],\n    [700,149],[700,248],[700,340],[700,432],[700,524],\n    [318,257],[461,257],[316,402],[460,402],[133,521]\n  ];\n  const N = LAYOUT.length;\n  function seatsFrom(map){ const s = Array(N).fill(null); Object.keys(map).forEach(i => s[i] = map[i]); return s; }\n  const DEFAULT_CLASSES = {\n    \"p1: GA2\": { roster: [], seats: Array(N).fill(null) },\n    \"p2: GA1\": { roster: [], seats: Array(N).fill(null) },\n    \"p3: HSB27\": { roster: [], seats: Array(N).fill(null) },\n    \"p4: FrS\": { roster: [], seats: Array(N).fill(null) },\n    \"p5: DA1\": { roster: [], seats: Array(N).fill(null) }\n  };\n\n  // ---------- helpers ----------\n  const store = {\n    get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },\n    set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }\n  };\n  const pad2 = n => String(n).padStart(2,'0');\n  const firstName = n => n.trim().split(/\\s+/)[0];\n  function shortName(n){ const p = n.trim().split(/\\s+/); return p.length > 1 ? p[0] + ' ' + p[p.length-1][0] + '.' : p[0]; }\n  function ordinal(n){ const s=['th','st','nd','rd'], v=n%100; return n + (s[(v-20)%10]||s[v]||s[0]); }\n  function plateHTML(n){\n    const p = n.trim().split(/\\s+/), d = document.createElement('div');\n    const f = document.createElement('span'); f.className='np-first'; f.textContent = p[0]; d.appendChild(f);\n    if(p.length > 1){ const l = document.createElement('span'); l.className='np-last'; l.textContent = p.slice(1).join(' '); d.appendChild(l); }\n    return d.innerHTML;\n  }\n  function fitNames(root){\n    root.querySelectorAll('.np-first').forEach(el => {\n      el.style.fontSize = '';\n      let size = parseFloat(getComputedStyle(el).fontSize);\n      while(el.scrollWidth > el.clientWidth && size > 12){ size = Math.max(12, size - 0.5); el.style.fontSize = size + 'px'; }\n    });\n  }\n  // Seating chart's shuffle order: highest desk first, desks 30, 10 and 1 fill last.\n  const SHUFFLE_LAST = [30, 10, 1];\n  function fillOrder(n){\n    const last = SHUFFLE_LAST.filter(k => k \u003c= n);\n    return [...Array(n).keys()].map(i=>i+1).filter(k => !last.includes(k)).reverse()\n      .concat(last.slice().reverse()).map(k => k-1);\n  }\n  function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }\n  let toastTimer;\n  function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), 2600); }\n\n  function boundsOf(L){\n    const minX = Math.min(TEACHER_DESK.x, TIMER_BOX.x, ...L.map(p=>p[0]));\n    const minY = Math.min(TEACHER_DESK.y, TIMER_BOX.y, ...L.map(p=>p[1]));\n    return {\n      minX, minY,\n      w: Math.max(TEACHER_DESK.x + TEACHER_DESK.w, TIMER_BOX.x + TIMER_BOX.w, ...L.map(p=>p[0] + DESK_W)) - minX,\n      h: Math.max(TEACHER_DESK.y + TEACHER_DESK.h, ...L.map(p=>p[1] + DESK_H + 3)) - minY\n    };\n  }\n  function validLayout(L){\n    return Array.isArray(L) && L.length > 0 && L.length \u003c= 120 &&\n      L.every(p => Array.isArray(p) && p.length === 2 && p.every(v => typeof v === 'number' && isFinite(v)));\n  }\n\n  // ---------- classes ----------\n  function classKeys(){\n    const order = store.get('hu306-class-order');\n    if(Array.isArray(order) && order.length) return [...order];\n    return [...new Set([...Object.keys(DEFAULT_CLASSES), ...Object.keys(store.get('hu306-classes')||{})])];\n  }\n  function classData(key){\n    const o = (store.get('hu306-classes')||{})[key];\n    return o || DEFAULT_CLASSES[key] || { roster:[], seats:[], layout:LAYOUT };\n  }\n  function saveClassData(key, data){ const all = store.get('hu306-classes')||{}; all[key]=data; store.set('hu306-classes', all); }\n  function normSeats(s, n){ const a=Array(n).fill(null); (s||[]).forEach((x,i)=>{ if(i\u003cn && typeof x==='string' && x.trim()) a[i]=x; }); return a; }\n  // ---------- seating chart import ----------\n  // Reads the text from the chart's Export Setup (or the whole chart file) without running it.\n  function parseChartExport(text){\n    const at = text.indexOf('CLASS_DATA');\n    const start = text.indexOf('{', at \u003c 0 ? 0 : at);\n    if(start \u003c 0) throw new Error('missing');\n    let depth = 0, inStr = false, end = -1;\n    for(let i = start; i \u003c text.length; i++){\n      const c = text[i];\n      if(inStr){ if(c === '\\\\') i++; else if(c === '\"') inStr = false; continue; }\n      if(c === '\"') inStr = true;\n      else if(c === '{') depth++;\n      else if(c === '}'){ depth--; if(depth === 0){ end = i; break; } }\n    }\n    if(end \u003c 0) throw new Error('cut off');\n    const body = text.slice(start, end + 1);\n    // Turn the JavaScript object into JSON: quote bare keys, drop trailing commas and comments.\n    let out = '';\n    for(let i = 0; i \u003c body.length;){\n      const c = body[i];\n      if(c === '\"'){\n        let j = i + 1;\n        while(j \u003c body.length && body[j] !== '\"'){ if(body[j] === '\\\\') j++; j++; }\n        out += body.slice(i, j + 1); i = j + 1; continue;\n      }\n      if(c === '/' && body[i+1] === '/'){ while(i \u003c body.length && body[i] !== '\\n') i++; continue; }\n      if(/[A-Za-z_$]/.test(c)){\n        let j = i; while(j \u003c body.length && /[\\w$]/.test(body[j])) j++;\n        const word = body.slice(i, j); let k = j; while(/\\s/.test(body[k] || '')) k++;\n        out += body[k] === ':' ? JSON.stringify(word) : word; i = j; continue;\n      }\n      if(c === ','){\n        let k = i + 1; while(/\\s/.test(body[k] || '')) k++;\n        if(body[k] === '}' || body[k] === ']'){ i++; continue; }\n      }\n      out += c; i++;\n    }\n    const raw = JSON.parse(out);\n    const classes = {}, order = [];\n    Object.keys(raw).forEach(key => {\n      const cfg = raw[key];\n      if(!cfg || !Array.isArray(cfg.desks)) return;\n      const dropped = new Set(Array.isArray(cfg.dropped) ? cfg.dropped : []);\n      const desks = cfg.desks.filter(d => d && typeof d.x === 'number' && typeof d.y === 'number');\n      if(!desks.length || desks.length > 120) return;\n      const layout = desks.map(d => [Math.round(d.x), Math.round(d.y)]);\n      const seats = desks.map(d => (typeof d.student === 'string' && d.student.trim() && !dropped.has(d.student)) ? d.student : null);\n      const roster = (Array.isArray(cfg.roster) ? cfg.roster : []).filter(n => typeof n === 'string' && n.trim() && !dropped.has(n));\n      seats.forEach(n => { if(n && !roster.includes(n)) roster.push(n); });\n      classes[key] = { roster, seats, layout };\n      order.push(key);\n    });\n    if(!order.length) throw new Error('no classes');\n    return { classes, order };\n  }\n\n\n\n  // ---------- game state ----------\n  // Phases: lobby -> picked -> heads -> tapped -> guessing -> reveal -> (picked ...) -> ended\n  const PHASES = ['lobby','picked','heads','tapped','guessing','reveal','ended'];\n  const MID = ['picked','heads','tapped','guessing'];\n  function freshGame(key, game){\n    const c = classData(key), layout = validLayout(c.layout) ? c.layout : LAYOUT;\n    return {\n      classKey:key, layout, roster:[...(c.roster||[])], seats:normSeats(c.seats, layout.length),\n      phase:'lobby', round:0, game:game||1,\n      tappers:[], tapped:[], guesses:{}, active:-1, pending:-1,\n      score:{}, turns:{}, gained:{}, last:[]\n    };\n  }\n  const idxList = (a, n) => Array.isArray(a) ? a.filter(i => Number.isInteger(i) && i >= 0 && i \u003c n) : [];\n  const numMap = o => { const m = {}; if(o && typeof o === 'object') Object.keys(o).forEach(k => { const v = Number(o[k]); if(isFinite(v)) m[k] = v; }); return m; };\n  function adopt(d){\n    if(!d || typeof d.classKey !== 'string' || !d.classKey) return null;\n    const layout = validLayout(d.layout) ? d.layout : LAYOUT, n = layout.length;\n    const guesses = {};\n    if(d.guesses && typeof d.guesses === 'object') Object.keys(d.guesses).forEach(k => {\n      const g = d.guesses[k]; if(g && Number.isInteger(g.g)) guesses[k] = { g:g.g, ok:!!g.ok };\n    });\n    return {\n      classKey:d.classKey, layout, roster:Array.isArray(d.roster)?d.roster.filter(x=>typeof x==='string'):[],\n      seats:normSeats(d.seats, n), phase:PHASES.includes(d.phase) ? d.phase : 'lobby',\n      round:Number(d.round)||0, game:Number(d.game)||1,\n      tappers:idxList(d.tappers, n), tapped:idxList(d.tapped, n), guesses,\n      active:Number.isInteger(d.active) ? d.active : -1, pending:Number.isInteger(d.pending) ? d.pending : -1,\n      score:numMap(d.score), turns:numMap(d.turns), gained:numMap(d.gained),\n      last:Array.isArray(d.last) ? d.last.filter(x=>typeof x==='string') : []\n    };\n  }\n\n  // ---------- game facts ----------\n  function seatedIdx(G){ return G.seats.map((n,i)=>n?i:-1).filter(i=>i>=0); }\n  const nm = i => G.seats[i] || 'Student';\n  const nameAt = n => { const i = G.seats.indexOf(n); return i >= 0 ? callName(i) : firstName(n); };\n  // First name, or first name plus last initial when two seated students share a first name.\n  function callName(i){\n    const n = nm(i), f = firstName(n).toLowerCase();\n    const twin = G.seats.some((m, j) => m && j !== i && firstName(m).toLowerCase() === f);\n    return twin ? shortName(n) : firstName(n);\n  }\n  function effN(){ return Math.max(1, Math.min(S.n, Math.floor(seatedIdx(G).length / 2))); }\n  function caughtBy(t){ const k = Object.keys(G.guesses).find(k => G.guesses[k].ok && G.guesses[k].g === t); return k === undefined ? -1 : Number(k); }\n  function nextGuesser(){ const i = G.tapped.find(t => !G.guesses[t]); return i === undefined ? -1 : i; }\n  function hasPoints(){ return Object.values(G.score).some(v => v > 0); }\n  function ranking(){\n    const rows = Object.keys(G.score).filter(n => G.score[n] > 0).map(n => ({ n, p:G.score[n] }));\n    rows.sort((a,b) => b.p - a.p || a.n.localeCompare(b.n));\n    let rank = 0, prev = null;\n    rows.forEach((r, k) => { if(r.p !== prev){ rank = k + 1; prev = r.p; } r.rank = rank; });\n    return rows;\n  }\n\n  // ---------- settings ----------\n  const S = Object.assign({ n:7, fair:true }, store.get('hu306-settings') || {});\n  S.n = Math.min(10, Math.max(3, Number(S.n) || 7)); S.fair = S.fair !== false;\n\n  // ---------- sound (made in the browser, no files) ----------\n  let soundOn = store.get('hu306-sound') !== false;\n  let actx = null;\n  function tone(f, t, d, type, v, to){\n    const o = actx.createOscillator(), g = actx.createGain();\n    o.type = type; o.frequency.setValueAtTime(f, t);\n    if(to) o.frequency.exponentialRampToValueAtTime(to, t + d);\n    g.gain.setValueAtTime(0.0001, t);\n    g.gain.exponentialRampToValueAtTime(v, t + 0.015);\n    g.gain.exponentialRampToValueAtTime(0.0001, t + d);\n    o.connect(g); g.connect(actx.destination);\n    o.start(t); o.stop(t + d + 0.05);\n  }\n  function sfx(kind){\n    if(!soundOn) return;\n    try{\n      actx = actx || new (window.AudioContext || window.webkitAudioContext)();\n      if(actx.state === 'suspended') actx.resume();\n      const t = actx.currentTime + 0.01;\n      if(kind === 'tick'){ tone(1200, t, 0.04, 'square', 0.04); }\n      else if(kind === 'picked'){ [523, 659, 784].forEach((f, i) => tone(f, t + i * 0.09, 0.2, 'triangle', 0.22)); }\n      else if(kind === 'down'){ tone(392, t, 0.3, 'sine', 0.22, 330); tone(262, t + 0.28, 0.5, 'sine', 0.22, 196); }\n      else if(kind === 'up'){ tone(392, t, 0.12, 'square', 0.07); tone(523, t + 0.12, 0.12, 'square', 0.07); tone(784, t + 0.24, 0.3, 'square', 0.08); }\n      else if(kind === 'mark'){ tone(700, t, 0.08, 'sine', 0.22); }\n      else if(kind === 'unmark'){ tone(500, t, 0.08, 'sine', 0.18, 380); }\n      else if(kind === 'choose'){ tone(880, t, 0.07, 'triangle', 0.18); }\n      else if(kind === 'right'){ tone(660, t, 0.12, 'triangle', 0.25); tone(990, t + 0.11, 0.28, 'triangle', 0.25); }\n      else if(kind === 'wrong'){ tone(220, t, 0.3, 'sawtooth', 0.1, 150); }\n      else if(kind === 'back'){ tone(440, t, 0.1, 'sine', 0.22); tone(660, t + 0.09, 0.14, 'sine', 0.22); }\n      else if(kind === 'win'){ [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * 0.12, i === 3 ? 0.5 : 0.22, 'triangle', 0.25)); }\n    }catch(e){}\n  }\n\n  // ---------- heads-down music: a sneaky chiptune loop, made in the browser ----------\n  const BPM = 138, STEP = 60 / BPM / 2; // one step = an eighth note\n  // 8 bars of tiptoe melody (MIDI note numbers, 0 = rest)\n  const LEAD = [\n    69,0,72,0,76,75,76,0,   77,76,74,72,71,0,69,0,\n    72,0,77,0,81,80,81,0,   80,0,76,0,71,0,68,0,\n    74,0,77,0,81,0,79,77,   76,0,72,0,69,0,72,76,\n    75,76,80,0,83,0,80,0,   76,0,0,0,68,0,0,0\n  ];\n  const ROOTS = [45,45,41,40,38,45,40,40]; // Am Am F E Dm Am E E\n  const BASS_PAT = [0,null,7,null,12,null,7,null];\n  const M = { on:false, timer:0, next:0, step:0, out:null, noise:null };\n  const hz = m => 440 * Math.pow(2, (m - 69) / 12);\n  function mNote(m, t, d, type, v){\n    const o = actx.createOscillator(), g = actx.createGain();\n    o.type = type; o.frequency.setValueAtTime(hz(m), t);\n    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.008);\n    g.gain.setValueAtTime(v, t + d * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + d);\n    o.connect(g); g.connect(M.out); o.start(t); o.stop(t + d + 0.02);\n  }\n  function mHat(t, v){\n    if(!M.noise){\n      const n = Math.floor(actx.sampleRate * 0.05), buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);\n      for(let i = 0; i \u003c n; i++) d[i] = Math.random() * 2 - 1;\n      M.noise = buf;\n    }\n    const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();\n    s.buffer = M.noise; f.type = 'highpass'; f.frequency.value = 7000;\n    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);\n    s.connect(f); f.connect(g); g.connect(M.out); s.start(t); s.stop(t + 0.05);\n  }\n  function mKick(t){\n    const o = actx.createOscillator(), g = actx.createGain();\n    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);\n    g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);\n    o.connect(g); g.connect(M.out); o.start(t); o.stop(t + 0.16);\n  }\n  function mSchedule(){\n    if(!M.on) return;\n    while(M.next \u003c actx.currentTime + 0.15){\n      const s = M.step % LEAD.length, bar = Math.floor(s / 8), beat = s % 8, t = M.next;\n      if(LEAD[s]) mNote(LEAD[s], t, STEP * 0.85, 'square', 0.05);\n      const b = BASS_PAT[beat]; if(b !== null) mNote(ROOTS[bar] + b, t, STEP * 0.9, 'triangle', 0.16);\n      if(beat === 0 || beat === 4) mKick(t);\n      if(beat % 2 === 1) mHat(t, 0.05);\n      M.next += STEP; M.step++;\n    }\n  }\n  function musicStart(){\n    if(M.on) return;\n    try{\n      actx = actx || new (window.AudioContext || window.webkitAudioContext)();\n      if(actx.state === 'suspended') actx.resume();\n      M.out = actx.createGain(); M.out.gain.value = 0.8; M.out.connect(actx.destination);\n      M.on = true; M.step = 0; M.next = actx.currentTime + 0.9; // let the heads-down cue finish first\n      mSchedule(); M.timer = setInterval(mSchedule, 25);\n    }catch(e){ M.on = false; }\n  }\n  function musicStop(){\n    if(!M.on) return;\n    M.on = false; clearInterval(M.timer);\n    const out = M.out;\n    try{\n      const t = actx.currentTime;\n      out.gain.cancelScheduledValues(t); out.gain.setValueAtTime(out.gain.value, t); out.gain.linearRampToValueAtTime(0, t + 0.25);\n    }catch(e){}\n    setTimeout(() => { try{ out.disconnect(); }catch(e){} }, 400);\n  }\n  // Music plays only while heads are down, and only with sound on.\n  function syncMusic(){ (soundOn && G && G.phase === 'heads' && !anim) ? musicStart() : musicStop(); }\n\n  // ================= GAME =================\n  let G = adopt(store.get('hu306-game'));\n  if(!G){ const keys = classKeys(); G = freshGame(keys.includes('p3: HSB2 er('click', e => {\n      const b = e.target.closest('[data-ok]'); if(b) decide(b.dataset.ok === '1');\n    });\n    map.appendChild(front);\n    seatEls = L.map(([x,y], i) => {\n      const b = document.createElement('button');\n      b.className = 'seat';\n      b.style.left = (x - B.minX) + 'px'; b.style.top = (y - B.minY) + 'px';\n      b.addEventListener('click', () => clickDesk(i));\n      map.appendChild(b);\n      return b;\n    });\n  }\n  function fit(){\n    const r = stage.getBoundingClientRect(), pad = $('#host').classList.contains('present') ? 22 : 30;\n    if(!r.width || !r.height) return;\n    const s = Math.min((r.width - pad*2)/B.w, (r.height - pad*2)/B.h);\n    const ox = (r.width - B.w*s)/2, oy = (r.height - B.h*s)/2;\n    map.style.transform = 'translate('+ox+'px,'+oy+'px) scale('+s+')';\n  }\n  new ResizeObserver(fit).observe(stage);\n  function pop(i){ const el = seatEls[i]; if(!el) return; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }\n\n  // ---- picking the tappers ----\n  // Fair: fewest turns this game first. Either way, last round's tappers go to the back of the line.\n  function chooseTappers(n, skip){\n    const prev = new Set(G.last);\n    return shuffle(seatedIdx(G).filter(i => !skip.has(i)))\n      .map(i => ({ i, t: S.fair ? (G.turns[nm(i)] || 0) : 0, p: prev.has(nm(i)) ? 1 : 0 }))\n      .sort((a,b) => a.t - b.t || a.p - b.p)\n      .slice(0, n).map(o => o.i);\n  }\n  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n  let anim = false;\n  function pick(){\n    const seated = seatedIdx(G).length;\n    if(seated \u003c 2){ toast('Seat at least two students first (Edit seats or Import chart).'); return; }\n    snap();\n    if(G.phase === 'reveal') G.last = G.tappers.map(nm);\n    const n = effN();\n    G.round += 1;\n    G.tappers = chooseTappers(n, new Set());\n    G.tappers.forEach(i => { G.turns[nm(i)] = (G.turns[nm(i)] || 0) + 1; });\n    G.tapped = []; G.guesses = {}; G.active = -1; G.pending = -1; G.gained = {};\n    G.phase = 'picked';\n    save();\n    if(n \u003c S.n) toast('Only ' + n + ' tapper' + (n === 1 ? '' : 's') + ' this round, so there are enough thumbs to tap.');\n    if(reduceMotion){ sfx('picked'); render(); return; }\n    anim = true; render();\n    const pool = seatedIdx(G), t0 = performance.now(), dur = 1700;\n    let lastStep = 0;\n    (function step(now){\n      if(!anim) return;\n      const el = now - t0;\n      if(el >= dur){\n        anim = false; seatEls.forEach(s => s.classList.remove('flash'));\n        sfx('picked'); render(); G.tappers.forEach(pop); return;\n      }\n      if(now - lastStep >= 70 + (el / dur) * 190){\n        lastStep = now;\n        const lit = new Set(shuffle(pool).slice(0, n));\n        seatEls.forEach((s, i) => s.classList.toggle('flash', lit.has(i)));\n        sfx('tick');\n      }\n      requestAnimationFrame(step);\n    })(t0);\n  }\n  function stopAnim(){ if(anim){ anim = false; seatEls.forEach(s => s.classList.remove('flash')); } }\n  // Swap one tapper (absent, already had a turn...) for someone else.\n  function swapTapper(i){\n    const skip = new Set([...G.tappers, i]);\n    const [j] = chooseTappers(1, skip);\n    if(j === undefined){ toast('Nobody else is free to swap in.'); return; }\n    snap();\n    G.turns[nm(i)] = Math.max(0, (G.turns[nm(i)] || 1) - 1);\n    G.turns[nm(j)] = (G.turns[nm(j)] || 0) + 1;\n    G.tappers = G.tappers.map(t => t === i ? j : t);\n    sfx('picked'); pop(j); render(); save();\n    toast(callName(j) + ' taps instead of ' + callName(i) + '.');\n  }\n\n  // ---- desk clicks ----\n  function clickDesk(i){\n    if(!G.seats[i] || anim) return;\n    const isTapper = G.tappers.includes(i), isTapped = G.tapped.includes(i);\n    switch(G.phase){\n      case 'lobby': toast('Press Space to pick the tappers.'); return;\n      case 'picked':\n        if(isTapper) swapTapper(i); else toast('Click a tapper’s desk to swap them for active] ? G.guesses[G.active].g : -1;\n    pop(done); render(); save();\n  }\n\n  // ---- steps ----\n  function next(){\n    if(anim) return;\n    closeRules();\n    switch(G.phase){\n      case 'lobby': case 'reveal': pick(); return;\n      case 'picked': snap(); G.phase = 'heads'; sfx('down'); break;\n      case 'heads': snap(); G.phase = 'tapped'; sfx('up'); break;\n      case 'tapped':\n        if(!G.tapped.length){ toast('Click the desk of each student who stood up first.'); return; }\n        snap(); G.phase = 'guessing'; G.active = nextGuesser(); G.pending = -1; sfx('choose'); break;\n      case 'guessing': snap(); reveal(); return;\n      default: return;\n    }\n    render(); save();\n  }\n  function reveal(){\n    const gained = {};\n    const add = (i) => { const n = nm(i); gained[n] = (gained[n] || 0) + 1; };\n    G.tapped.forEach(t => { if(G.guesses[t] && G.guesses[t].ok) add(t); });\n    G.tappers.forEach(t => { if(caughtBy(t) \u003c 0) add(t); });\n    Object.keys(gained).forEach(n => { G.score[n] = (G.score[n] || 0) + gained[n]; });\n    G.gained = gained; G.active = -1; G.pending = -1; G.phase = 'reveal';\n    sfx('win'); render(); save();\n    Object.keys(gained).forEach(n => { const i = G.seats.indexOf(n); if(i >= 0) pop(i); });\n  }\n  function endGame(){\n    if(G.phase === 'lobby' || G.phase === 'ended' || anim) return;\n    snap();\n    const mid = MID.includes(G.phase);\n    if(mid){ G.turns = {}; } // turns only matter within a game\n    G.tappers = mid ? [] : G.tappers; G.tapped = mid ? [] : G.tapped;\n    if(mid){ G.guesses = {}; G.gained = {}; G.round -= 1; }\n    G.active = -1; G.pending = -1; G.phase = 'ended';\n    sfx('win'); render(); save();\n    if(mid) toast('Game over. The unfinished round doesn’t count.');\n  }\n  function doNewGame(){\n    stopAnim();\n    G = freshGame(G.classKey, G.game + 1); hist = [];\n    render(); save(); toast('Game ' + G.game + ' is ready. Press Space to pick the tappers.');\n  }\n  function newGame(){\n    if(G.phase === 'lobby' && !G.round) return;\n    if(hasPoints() && G.phase !== 'ended') $('#confirmDialog').showModal();\n    else doNewGame();\n  }\n  function undo(){\n    if(!hist.length){ toast('Nothing to undo.'); return; }\n    stopAnim();\n    const back = adopt(JSON.parse(hist.pop()));\n    if(back) G = back;\n    sfx('back'); render(); save(); toast('Undone.');\n  }\n\n  // ---- fullscreen view ----\n  const host = $('#host');\n  let inRealFs = false;\n  function fsEl(){ return document.fullscreenElement || document.webkitFullscreenElement || null; }\n  function enterPresent(){\n    if(host.classList.contains('present')) return;\n    host.classList.add('present');\n    try{\n      const el = document.documentElement;\n      const r = el.requestFullscreen ? el.requestFullscreen() : (el.webkitRequestFullscreen ? el.webkitRequestFullscreen() : null);\n      if(r && r.then) r.then(() => { inRealFs = true; }).catch(() => {});\n    }catch(e){}\n    render();\n  }\n  function exitPresent(){\n    if(!host.classList.contains('present')) return;\n    host.classList.remove('present');\n    if(fsEl()){ try{ const r = document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen(); if(r && r.catch) r.catch(()=>{}); }catch(e){} }\n    inRealFs = false;\n    render();\n  }\n  function togglePresent(){ host.classList.contains('present') ? exitPresent() : enterPresent(); }\n  function onFsChange(){ if(!fsEl() && inRealFs){ inRealFs = false; exitPresent(); } }\n  document.addEventListener('fullscreenchange', onFsChange);\n  document.addEventListener('webkitfullscreenchange', onFsChange);\n\n  // ---- sound toggle ----\n  function setSound(on){\n    soundOn = on; store.set('hu306-sound', on); syncMusic();\n    const b = $('#soundBtn'); b.setAttribute('aria-pressed', String(on));\n    b.textContent = on ? '🔊 Sound on' : '🔇 Sound off';\n  }\n  $('#soundBtn').addEventListener('click', () => { setSound(!soundOn); if(soundOn) sfx('back'); });\n  setSound(soundOn);\n\n  // ---- rules screen ----\n  const rulesEl = $('#rules');\n  function rulesOpen(){ return !rulesEl.hidden; }\n  function openRules(){ rulesEl.hidden = false; $('#rulesClose').focus(); }\n  function closeRules(){ if(!rulesEl.hidden) rulesEl.hidden = true; }\n  function toggleRules(){ rulesOpen() ? closeRules() : openRules(); }\n  $('#rulesClose').addEventListener('click', closeRules);\n\n  // ---- settings ----\n  const sdlg = $('#settingsDialog');\n  function openSettings(){\n    $('#nSel').value = String(S.n);\n    $$('input[name=\"fair\"]').forEach(r => r.checked = (r.value === 'fair') === S.fair);\n    sdlg.showModal();\n  }\n  $('#settingsBtn').addEventListener('click', openSettings);\n  $('#settingsCancel').addEventListener('click', () => sdlg.close());\n  $('#settingsSave').addEventListener('click', () => {\n    S.n = Number($('#nSel').value) || 7;\n    S.fair = ($('input[name=\"fair\"]:checked') || {}).value !== 'any';\n    store.set('hu306-settings', S);\n    sdlg.close(); render();\n    toast(MID.includes(G.phase) ? 'Saved. ' + S.n + ' tappers starting next round.' : 'Saved. ' + effN() + ' tappers per round.');\n  });\n\n  const ACTIONS = { next, end: endGame, restart: newGame, undo, present: togglePresent, rules: toggleRules };\n  $$('[data-act]').forEach(b => b.addEventListener('click', () => ACTIONS[b.dataset.act]()));\n  $('#confirmCancel').addEventListener('click', () => $('#confirmDialog').close());\n  $('#confirmOk').addEventListener('click', () => { $('#confirmDialog').close(); doNewGame(); });\n\n  // ---- keyboard ----\n  document.addEventListener('keydown', e => {\n    if(e.defaultPrevented || e.altKey) return;\n    if(document.querySelector('dialog[open]')) return;\n    const t = e.target;\n    if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) return;\n    const k = e.key.toLowerCase();\n    if((e.ctrlKey || e.metaKey) && k !== 'z') return;\n    if(rulesOpen() && (k === 'escape' || k === 'r')){ e.preventDefault(); closeRules(); return; }\n    if(k === 'r'){ e.preventDefault(); openRules(); return; }\n    if(k === ' '){ e.preventDefault(); next(); }\n    else if(k === 'y'){ e.preventDefault(); decide(true); }\n    else if(k === 'n'){ e.preventDefault(); decide(false); }\n    else if(k === 'z'){ e.preventDefault(); undo(); }\n    else if(k === 's'){ e.preventDefault(); openSettings(); }\n    else if(k === 'f'){ e.preventDefault(); togglePresent(); }\n    else if(k === 'm'){ setSound(!soundOn); toast(soundOn ? 'Sound on' : 'Sound off'); }\n    else if(k === 'escape' && host.classList.contains('present') && !fsEl()){ exitPresent(); }\n  });\n\n  // ---- seats dialog ----\n  const dlg = $('#seatsDialog');\n  $('#seatsBtn').addEventListener('click', () => {\n    $('#rosterText').value = [...new Set([...G.roster, ...G.seats.filter(Boolean)])].join('\\n');\n    dlg.showModal();\n  });\n  $('#seatsCancel').addEventListener('click', () => dlg.close());\n  function readNames(){\n    const seen = new Set();\n    return $('#rosterText').value.split('\\n').map(s=>s.trim()).filter(s => s && !seen.has(s.toLowerCase()) && seen.add(s.toLowerCase()));\n  }\n  function applySeats(names, seats){\n    const extra = names.filter(n => !seats.includes(n));\n    snap();\n    G.roster = names; G.seats = seats;\n    G.tappers = []; G.tapped = []; G.guesses = {}; G.active = -1; G.pending = -1; G.gained = {};\n    if(G.phase !== 'ended') G.phase = G.round ? 'reveal' : 'lobby';\n    saveClassData(G.classKey, { roster:names, seats, layout:G.layout });\n    dlg.close(); render(); save();\n    if(extra.length) toast(extra.length + (extra.length===1?' student has':' students have') + ' no desk. Add a desk in the seating chart.');\n  }\n  $('#seatsFill').addEventListener('click', () => {\n    const names = readNames();\n    const seats = G.seats.map(n => n && names.includes(n) ? n : null);\n    const waiting = names.filter(n => !seats.includes(n));\n    fillOrder(seats.length).forEach(i = tSize);\n    while(b.scrollWidth > b.clientWidth && size > 24){ size -= 1; b.style.fontSize = size + 'px'; }\n  }\n  function drawFront(){\n    if(!front) return;\n    let cls = 'front', lbl = '', big = '', hint = '', chips = null, btns = false;\n    const n = G.tappers.length || effN(), r = G.round;\n    if(anim){ lbl = 'Round ' + r; big = 'Picking tappers…'; cls += ' up'; }\n    else switch(G.phase){\n      case 'lobby': cls += ' quiet'; lbl = 'Game ' + G.game; big = 'Ready'; hint = 'Space picks ' + effN() + ' tappers'; break;\n      case 'picked':\n        lbl = 'Round ' + r + ': tappers, come to the front';\n        chips = G.tappers.map(callName);\n        hint = 'Click a tapper’s desk to swap them. Space: heads down.'; break;\n      case 'heads': cls += ' heads'; lbl = 'Round ' + r; big = 'Heads down, thumbs up'; hint = 'Tappers: press one thumb each, then back to the front'; break;\n      case 'tapped':\n        cls += ' up'; lbl = 'Round ' + r; big = 'Heads up, ' + n + ' up!';\n        hint = 'Tapped? Stand up. Click each desk that stands (' + G.tapped.length + ' of ' + n + ')'; break;\n      case 'guessing': {\n        const done = Object.keys(G.guesses).length, total = G.tapped.length;\n        if(G.active \u003c 0){ lbl = 'All ' + total + ' guesses are in'; big = 'Who got away?'; hint = 'Space shows the results'; break; }\n        const who = callName(G.active);\n        lbl = 'Guess ' + Math.min(done + 1, total) + ' of ' + total;\n        if(G.pending \u003c 0){ big = who + ', who tapped you?'; hint = 'Click the tapper ' + who + ' names'; }\n        else { big = who + ' says ' + callName(G.pending); btns = true; }\n        break;\n      }\n      case 'reveal': {\n        const caught = G.tappers.filter(t => caughtBy(t) >= 0).length, free = G.tappers.length - caught;\n        lbl = 'Round ' + r + ' results';\n        big = caught + ' caught, ' + free + ' got away';\n        hint = 'Space starts round ' + (r + 1); break;\n      }\n      case 'ended': {\n        const rows = ranking(), tops = rows.filter(x => x.rank === 1);\n        lbl = 'Game ' + G.game + ' over';\n        big = !tops.length ? 'No points scored' : tops.length === 1 ? nameAt(tops[0].n) + ' wins!' : 'It’s a tie!';\n        if(!tops.length) cls += ' quiet';\n        hint = 'New game to play again'; break;\n      }\n    }\n    if(front.className !== cls) front.className = cls;\n    front.innerHTML = '';\n    front.appendChild(el('div', 'f-lbl', lbl));\n    if(chips){ const c = el('div', 'f-chips'); chips.forEach(t => c.appendChild(el('span', '', t))); front.appendChild(c); }\n    if(big) front.appendChild(el('div', 'f-big', big));\n    if(btns){\n      const w = el('div', 'f-btns');\n      const y = el('button', 'btn ok', '✓ Right'); y.dataset.ok = '1'; y.appendChild(el('kbd', '', 'Y'));\n      const no = el('button', 'btn no', '✗ Wrong'); no.dataset.ok = '0'; no.appendChild(el('kbd', '', 'N'));\n      w.append(y, no); front.appendChild(w);\n    } else if(hint) front.appendChild(el('div', 'f-hint', hint));\n    fitBig();\n  }\n\n  function render(){\n    fillClassSelect(); buildMap();\n    sel.value = G.classKey;\n    const seated = seatedIdx(G).length, ph = G.phase, show = !anim;\n    const rows = ranking(), leaders = ph === 'ended' ? new Set(rows.filter(x => x.rank === 1).map(x => x.n)) : new Set();\n    map.classList.toggle('choosing', ph === 'guessing' && G.active >= 0);\n\n    seatEls.forEach((s, i) => {\n      const name = G.seats[i];\n      if(!name){\n        s.className = 'seat'; s.innerHTML = MONITOR_SVG + '\u003cspan class=\"num\">' + pad2(i+1) + '\u003c/span>';\n        s.setAttribute('aria-label', 'Desk ' + (i+1) + ', open seat'); s.tabIndex = -1; s.removeAttribute('title'); return;\n      }\n      const isTapper = show && G.tappers.includes(i) && ph !== 'lobby' && ph !== 'ended';\n      const isTapped = show && G.tapped.includes(i) && ['tapped','guessing','reveal'].includes(ph);\n      const g = G.guesses[i], c = isTapper ? caughtBy(i) : -1;\n      let cls = 'seat occupied', tag = '', aria = name;\n      if(isTapper){\n        cls += ' tapper';\n        if(ph === 'reveal'){ cls += c >= 0 ? ' caught' : ' free'; tag = c >= 0 ? 'Caught' : 'Got away'; }\n        else if(ph === 'guessing' && c >= 0){ cls += ' caught'; tag = 'Caught'; }\n        else tag = 'Tapper';\n        aria += ', ' + tag.toLowerCase();\n      }\n      if(isTapped){\n        cls += ' tapped';\n        if(g){ cls += g.ok ? ' right' : ' wrong'; tag = (g.ok ? '✓ ' : '✗ ') + callName(g.g); aria += ', guessed ' + nm(g.g) + (g.ok ? ', right' : ', wrong'); }\n        else if(ph === 'reveal'){ cls += ' wrong'; tag = 'No guess'; aria += ', no guess'; }\n        else if(ph === 'guessing' && G.active === i){ tag = 'Guessing'; aria += ', guessing now'; }\n        else { tag = 'Tapped'; aria += ', tapped'; }\n      }\n      if(ph === 'guessing' && !isTapper && !isTapped) cls += ' dim';\n      if(ph === 'guessing' && G.active === i) cls += ' active';\n      if(ph === 'guessing' && G.pending === i) cls += ' pending';\n      if(leaders.has(name)) cls += ' leader';\n      s.className = cls;\n      s.innerHTML = '\u003cspan class=\"np\">' + plateHTML(name) + '\u003c/span>\u003cspan class=\"num\">' + pad2(i+1) + '\u003c/span>';\n      if(tag) s.appendChild(el('span', 'tag', tag));\n      const pts = G.score[name] || 0, gain = ph === 'reveal' ? (G.gained[name] || 0) : 0;\n      if(gain) s.appendChild(el('span', 'pts gain', '+' + gain));\n      else if(pts) s.appendChild(el('span', 'pts', String(pts)));\n      s.tabIndex = 0; s.title = name;\n      s.setAttribute('aria-label', 'Desk ' + (i+1) + ', ' + aria + ', ' + pts + (pts === 1 ? ' point' : ' points'));\n    });\n    fitNames(map);\n    drawFront();\n\n    // status\n    const busy = MID.includes(ph) || anim;\n    $('#status').className = 'status ' + ({ lobby:'', picked:'playing', heads:'paused', tapped:'playing', guessing:'playing', reveal:'', ended:'ended' }[ph] || '');\n    $('#statusText').textContent = anim ? 'Picking tappers' : {\n      lobby: 'Game ' + G.game + ', waiting to start',\n      picked: 'Round ' + G.round + ', tappers up front',\n      heads: 'Round ' + G.round + ', heads down',\n      tapped: 'Round ' + G.round + ', heads up',\n      guessing: 'Round ' + G.round + ', guessing',\n      reveal: 'Round ' + G.round + ' done',\n      ended: 'Game ' + G.game + ' over'\n    }[ph];\n\n    // buttons (top bar, fullscreen bar, rules screen)\n    const label = { lobby:'Pick tappers', picked:'Heads down', heads:'Heads up', tapped:'Start guessing', guessing:'Show results', reveal:'Next round' }[ph];\n    $$('[data-act=\"next\"]').forEach(b => { b.hidden = ph === 'ended'; b.textContent = label || ''; b.disabled = anim; });\n    $$('[data-act=\"end\"]').forEach(b => b.hidden = ph === 'lobby' || ph === 'ended');\n    $$('[data-act=\"restart\"]').forEach(b => { b.hidden = ph === 'lobby' && !G.round; b.classList.toggle('primary', ph === 'ended'); });\n    $$('[data-act=\"undo\"]').forEach(b => { b.hidden = ph === 'lobby' && !hist.length; b.disabled = !hist.length; });\n    $('#rulesClose').textContent = ph === 'lobby' ? 'Back to the room' : 'Back to the game';\n    const rh = $('#rules .hint'); rh.hidden = ph !== 'lobby' && ph !== 'reveal'; rh.textContent = 'Space ' + (ph === 'reveal' ? 'starts the next round' : 'picks the tappers');\n    $('#ruleN').textContent = effN();\n    $('#seatsBtn').disabled = $('#importBtn').disabled = busy;\n    $('#seatsBtn').title = $('#importBtn').title = busy ? 'Finish the round first' : '';\n    sel.disabled = busy;\n\n    // banner\n    const present = host.classList.contains('present'), ban = $('#banner');\n    if(ph === 'ended'){\n      const tops = rows.filter(x => x.rank === 1);\n      ban.hidden = false; ban.className = 'banner' + (tops.length ? ' win' : '');\n      ban.textContent = !tops.length ? 'Game over. No points this time.'\n        : tops.length === 1 ? tops[0].n + ' wins with ' + tops[0].p + (tops[0].p === 1 ? ' point!' : ' points!')\n        : tops.length > 3 ? tops.length + '-way tie at ' + tops[0].p + (tops[0].p === 1 ? ' point!' : ' points!')\n        : 'Tie at ' + tops[0].p + (tops[0].p === 1 ? ' point: ' : ' points: ') + tops.map(x => firstName(x.n)).join(', ') + '!';\n    }\n    else if(ph === 'lobby' && present){ ban.hidden = false; ban.className = 'banner'; ban.textContent = 'Heads Up ' + effN() + ' Up. Get ready.'; }\n    else ban.hidden = true;\n\n    // side panel\n    $('#roundNum').textContent = G.round || '—';\n    $('#roundLabel').textContent = G.round ? 'round' + (G.round === 1 ? '' : 's') + ', game ' + G.game : 'no rounds yet';\n    if(ph !== 'lobby' && ph !== 'ended' && G.round){ $('#roundNum').textContent = G.round; $('#roundLabel').textContent = 'round, game ' + G.game; }\n    const gl = $('#guessList'); gl.innerHTML = '';\n    const showG = ['guessing','reveal'].includes(ph) && show;\n    let gCount = 0;\n    if(showG) G.tapped.forEach(t => {\n      const g = G.guesses[t]; if(!g) return;\n      gCount++;\n      const li = el('li', g.ok ? 'ok' : '');\n      li.append(el('b', '', callName(t)), document.createTextNode(' guessed ' + callName(g.g)), el('span', 'mk', g.ok ? '✓' : '✗'));\n      gl.appendChild(li);\n    });\n    $('#guessEmpty').hidden = gCount > 0;\n    $('#guessEmpty').textContent = {\n      lobby:'Guesses show up here.', picked:'Tappers are up front.', heads:'Heads down. Tapping now.',\n      tapped:'Click each student who stands up.', guessing:'Click a tapped student, then the tapper they name.',\n      reveal:'No guesses this round.', ended:'Game over.'\n    }[ph] || '';\n    $('#guessCount').textContent = showG ? '(' + gCount + ' of ' + G.tapped.length + ')' : '';\n    const sl = $('#scoreList'); sl.innerHTML = '';\n    rows.slice(0, 12).forEach(x => {\n      const li = el('li', x.rank === 1 ? 'top' : '');\n      li.append(el('span', 'pl', ordinal(x.rank)), el('span', 'nm', x.n), el('span', 'pt', String(x.p)));\n      sl.appendChild(li);\n    });\n    $('#scoreEmpty').hidden = rows.length > 0;\n    $('#scoreCount').textContent = rows.length > 12 ? '(top 12 of ' + rows.length + ')' : rows.length ? '(' + rows.length + ')' : '';\n\n    // fullscreen bar\n    $('#dClass').textContent = G.classKey;\n    $('#dRound').textContent = G.round || '—';\n    $('#dTappers').textContent = G.tappers.length && MID.includes(ph) ? G.tappers.length : effN();\n    const tops = rows.filter(x => x.rank === 1);\n    $('#dLeader').textContent = !tops.length ? '—' : tops.length === 1 ? shortName(tops[0].n) + ' (' + tops[0].p + ')' : tops.length + ' tied (' + tops[0].p + ')';\n\n    syncMusic();\n    requestAnimationFrame(() => { fit(); fitBig(); });\n  }\n\n  render();\n  if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fitNames(map); fitBig(); });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "306_Four_Corners.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>306 Four Corners\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{\n  --panel:#F2F2F2; --border:#B5B5B5; --text:#161616; --muted:#5C5C5C;\n  --floor:#E9E9E9; --floor-dot:#C6C6C6;\n  --tile:#F7F7F7; --tile-edge:#C4C4C4; --tile-num:#8A8A8A; --tile-icon:#B0B0B0;\n  --paper:#FFFFFF; --paper-edge:#CFCFCF; --ink:#121212; --ink-soft:#4A4A4A;\n  --accent:#9E1B32; --accent-dark:#7A1527; --field-bg:#FFFFFF; --live:#2E8B57; --danger-text:#9E1B32;\n  --c1:#2F6FD6; --c2:#D9A33A; --c3:#2E8B57; --c4:#7B4FC9;\n  --dash-line:#B5B5B5; --dash-label:#5A5A5A;\n  --sans:'Google Sans Flex', system-ui,
