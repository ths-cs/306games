l },\n      { x: 1160, y: 521, student: null },\n      { x: 920, y: 150, student: null },\n      { x: 920, y: 243, student: null },\n      { x: 920, y: 335, student: null },\n      { x: 920, y: 429, student: null },\n      { x: 920, y: 522, student: null },\n      { x: 700, y: 149, student: null },\n      { x: 700, y: 248, student: null },\n      { x: 700, y: 340, student: null },\n      { x: 700, y: 432, student: null },\n      { x: 700, y: 524, student: null },\n      { x: 318, y: 257, student: null },\n      { x: 461, y: 257, student: null },\n      { x: 316, y: 402, student: null },\n      { x: 460, y: 402, student: null },\n      { x: 133, y: 521, student: null },\n    ]\n  },\n  \"p5: DA1\": {\n    roster: [],\n    desks: [\n      { x: 1313, y: 690, student: null },\n      { x: 1171, y: 690, student: null },\n      { x: 1030, y: 690, student: null },\n      { x: 888, y: 690, student: null },\n      { x: 746, y: 690, student: null },\n      { x: 605, y: 690, student: null },\n      { x: 462, y: 690, student: null },\n      { x: 318, y: 690, student: null },\n      { x: 171, y: 690, student: null },\n      { x: 27, y: 688, student: null },\n      { x: 1160, y: 257, student: null },\n      { x: 1304, y: 257, student: null },\n      { x: 1159, y: 402, student: null },\n      { x: 1304, y: 402, student: null },\n      { x: 1160, y: 521, student: null },\n      { x: 920, y: 150, student: null },\n      { x: 920, y: 243, student: null },\n      { x: 920, y: 335, student: null },\n      { x: 920, y: 429, student: null },\n      { x: 920, y: 522, student: null },\n      { x: 700, y: 149, student: null },\n      { x: 700, y: 248, student: null },\n      { x: 700, y: 340, student: null },\n      { x: 700, y: 432, student: null },\n      { x: 700, y: 524, student: null },\n      { x: 318, y: 257, student: null },\n      { x: 461, y: 257, student: null },\n      { x: 316, y: 402, student: null },\n      { x: 460, y: 402, student: null },\n      { x: 133, y: 521, student: null },\n    ]\n  }\n};\n  let state = {\n    classes: [],       // [names]\n    currentClass: null,\n    desks: [],         // {id, x, y, studentId}\n    roster: []         // {id, name}\n  };\n\n\n  let confirmCallback = null;\n  let layoutLocked = true; // desks can't be moved or added until unlocked\n\n  function uid(prefix){\n    return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);\n  }\n  function hashRotation(id){\n    let h = 0;\n    for(let i=0;i\u003cid.length;i++){ h = (h*31 + id.charCodeAt(i)) | 0; }\n    return (Math.abs(h) % 5) - 2; // -2..2 deg\n  }\n\n  // ---------- Config -> in-memory state ----------\n  function classFromConfig(cfg){\n    const droppedNames = new Set(cfg.dropped || []);\n    const roster = (cfg.roster || []).map(name => {\n      const s = {id: uid('stu'), name};\n      if(droppedNames.has(name)) s.dropped = true;\n      return s;\n    });\n    const byName = new Map(roster.map(s => [s.name, s.id]));\n    const desks = (cfg.desks || []).map(d => ({\n      id: uid('desk'),\n      x: d.x, y: d.y,\n      studentId: d.student ? (byName.get(d.student) || null) : null\n    }));\n    return {roster, desks};\n  }\n\n  let classDataCache = {};\n\n  // ---------- Data load/save ----------\n  // ---------- Auto-save (browser storage) ----------\n  // Every change is kept in this browser. If CLASS_DATA in the file is edited\n  // later, the file wins and the saved copy is set aside.\n  const STORAGE_KEY = 'seatingChart306';\n  const FILE_FINGERPRINT = (function(){\n    const str = JSON.stringify(CLASS_DATA);\n    let h = 0;\n    for(let i = 0; i \u003c str.length; i++){ h = (h * 31 + str.charCodeAt(i)) | 0; }\n    return String(h);\n  })();\n  let storageOk = true;\n\n  function snapshot(){\n    const out = {};\n    state.classes.forEach(name => {\n      const data = classDataCache[name] || {desks: [], roster: []};\n      out[name] = {\n        roster: data.roster.map(s => s.name),\n        dropped: data.roster.filter(s => s.dropped).map(s => s.name),\n        desks: data.desks.map(d => {\n          const st = d.studentId ? data.roster.find(s => s.id === d.studentId) : null;\n          return { x: Math.round(d.x), y: Math.round(d.y), student: st ? st.name : null };\n        })\n      };\n    });\n    return out;\n  }\n\n  function setSaveStatus(text, warn){\n    const el = document.getElementById('saveStatus');\n    el.textContent = text;\n    el.classList.toggle('warn', !!warn);\n  }\n\n  function persist(){\n    publishForGames();\n    if(!storageOk) return;\n    try{\n      localStorage.setItem(STORAGE_KEY, JSON.stringify({\n        fingerprint: FILE_FINGERPRINT,\n        currentClass: state.currentClass,\n        classes: snapshot()\n      }));\n      const t = new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});\n      setSaveStatus('✓ Saved ' + t);\n    }catch(e){\n      storageOk = false;\n      setSaveStatus('⚠ Not saving — use Export Setup to keep changes', true);\n    }\n  }\n\n  function readSaved(){\n    try{\n      const raw = localStorage.getItem(STORAGE_KEY);\n      if(!raw) return null;\n      const saved = JSON.parse(raw);\n      if(!saved || saved.fingerprint !== FILE_FINGERPRINT || !saved.classes) return null;\n      if(!Object.keys(saved.classes).length) return null;\n      return saved;\n    }catch(e){\n      storageOk = false;\n      return null;\n    }\n  }\n\n  function loadClassesIndex(){\n    const saved = readSaved();\n    if(saved){\n      const names = Object.keys(saved.classes);\n      names.forEach(name => { classDataCache[name] = classFromConfig(saved.classes[name]); });\n      state.classes = names;\n      state.currentClass = saved.currentClass;\n      setSaveStatus('✓ Restored saved changes');\n      return;\n    }\n    let list = Object.keys(CLASS_DATA);\n    if(!list.length){\n      list = ['Period 1'];\n      classDataCache['Period 1'] = {desks: [], roster: []};\n    } else {\n      list.forEach(name => {\n        classDataCache[name] = classFromConfig(CLASS_DATA[name]);\n      });\n    }\n    state.classes = list;\n  }\n\n  function loadClass(name){\n    const data = classDataCache[name] || {desks: [], roster: []};\n    state.currentClass = name;\n    state.desks = data.desks;\n    state.roster = data.roster;\n  }\n\n  function saveClass(){\n    if(!state.currentClass) return;\n    classDataCache[state.currentClass] = {\n      desks: state.desks,\n      roster: state.roster\n    };\n    persist();\n  }\n\n  function saveClassesIndex(){}\n\n  // ---------- Rendering ----------\n  const canvas = document.getElementById('canvas');\n  const classSelect = document.getElementById('classSelect');\n  const rosterList = document.getElementById('rosterList');\n\n  function renderClassSelect(){\n    classSelect.innerHTML = '';\n    state.classes.forEach(name => {\n      const opt = document.createElement('option');\n      opt.value = name; opt.textContent = name;\n      if(name === state.currentClass) opt.selected = true;\n      classSelect.appendChild(opt);\n    });\n  }\n\n  function assignedStudentIds(){\n    return new Set(state.desks.filter(d=>d.studentId).map(d=>d.studentId));\n  }\n\n  function studentById(id){\n    return state.roster.find(s => s.id === id);\n  }\n\n  function renderAll(){\n    renderClassSelect();\n    renderCanvas();\n    renderRoster();\n    renderTitleBlock();\n    document.getElementById('deskCountLabel').textContent =\n      state.desks.length + (state.desks.length === 1 ? ' desk' : ' desks');\n  }\n\n  function renderTitleBlock(){\n    document.getElementById('tbClass').textContent = state.currentClass || '—';\n    const seated = state.desks.filter(d=>d.studentId).length;\n    document.getElementById('tbSeats').textContent = seated + ' / ' + state.desks.length;\n    document.getElementById('tbDate').textContent = new Date().toLocaleDateString(undefined,{month:'short', day:'numeric', year:'numeric'});\n  }\n\n  function renderCanvas(){\n    canvas.querySelectorAll('.desk, .teacher-desk, .canvas-empty-msg').forEach(el => el.remove());\n\n    const teacher = document.createElement('div');\n    teacher.className = 'teacher-desk';\n    teacher.style.left = TEACHER_DESK.x + 'px';\n    teacher.style.top = TEACHER_DESK.y + 'px';\n    teacher.style.width = TEACHER_DESK.w + 'px';\n    teacher.style.height = TEACHER_DESK.h + 'px';\n    teacher.innerHTML = MONITOR_SVG + '\u003cspan class=\"teacher-desk-label\">Teacher Desk\u003c/span>';\n    canvas.appendChild(teacher);\n\n    if(state.desks.length === 0){\n      const msg = document.createElement('div');\n      msg.className = 'canvas-empty-msg';\n      msg.textContent = 'Click \"+ Add Desk\" to start building your room layout.';\n      canvas.appendChild(msg);\n    }\n\n    state.desks.forEach((desk, index) => {\n      const el = document.createElement('div');\n      el.className = 'desk';\n      el.style.left = desk.x + 'px';\n      el.style.top = desk.y + 'px';\n      el.dataset.id = desk.id;\n\n      const student = desk.studentId ? studentById(desk.studentId) : null;\n      if(student) el.classList.add('occupied');\n\n      const numberBadge = document.createElement('div');\n      numberBadge.className = 'desk-number';\n      numberBadge.textContent = String(index + 1).padStart(2, '0');\n      el.appendChild(numberBadge);\n\n      const handle = document.createElement('div');\n      handle.className = 'desk-handle';\n      handle.innerHTML = '\u003cspan class=\"desk-dots\">⠿\u003c/span>\u003cspan class=\"desk-actions\">\u003c/span>';\n      const actions = handle.querySelector('.desk-actions');\n      el.appendChild(handle);\n\n      const body = document.createElement('div');\n      body.className = 'desk-body';\n\n      if(student){\n        const plate = document.createElement('div');\n        plate.className = 'nameplate';\n        plate.title = student.name;\n        const parts = student.name.trim().split(/\\s+/);\n        const first = document.createElement('span');\n        first.className = 'np-first';\n        first.textContent = parts[0];\n        plate.appendChild(first);\n        if(parts.length > 1){\n          const last = document.createElement('span');\n          last.className = 'np-last';\n          last.textContent = parts.slice(1).join(' ');\n          plate.appendChild(last);\n        }\n        const un = document.createElement('button');\n        un.className = 'desk-unseat';\n        un.textContent = 'Unseat';\n        un.title = 'Move back to the unassigned list';\n        un.addEventListener('click', (e) => {\n          e.stopPropagation();\n          desk.studentId = null;\n          saveClass();\n          renderAll();\n        });\n        actions.appendChild(un);\n        makeNameDraggable(plate, student.id, desk.id, student.name);\n        body.appendChild(plate);\n      } else {\n        const label = document.createElement('div');\n        label.className = 'desk-empty-label';\n        label.title = 'Open seat';\n        label.innerHTML = MONITOR_SVG;\n        body.appendChild(label);\n      }\n\n      el.appendChild(body);\n      canvas.appendChild(el);\n\n      wireDeskDrag(handle, body, el, desk);\n    });\n    fitNames();\n  }\n\n  // Shrink long first names until they fit the desk (down to a readable minimum).\n  const NAME_MIN_PX = 12;\n  function fitNames(){\n    canvas.querySelectorAll('.np-first').forEach(el => {\n      el.style.fontSize = '';\n      let size = parseFloat(getComputedStyle(el).fontSize);\n      while(el.scrollWidth > el.clientWidth && size > NAME_MIN_PX){\n        size = Math.max(NAME_MIN_PX, size - 0.5);\n        el.style.fontSize = size + 'px';\n      }\n    });\n  }\n\n  function handleDrop(data, targetDeskId){\n    const { studentId, fromDesk } = data;\n    if(fromDesk === targetDeskId) return;\n    const targetDesk = state.desks.find(d => d.id === targetDeskId);\n    if(!targetDesk) return;\n    const displacedId = targetDesk.studentId || null;\n    targetDesk.studentId = studentId;\n\n    if(fromDesk){\n      const sourceDesk = state.desks.find(d => d.id === fromDesk);\n      if(sourceDesk) sourceDesk.studentId = displacedId;\n    }\n    saveClass();\n    renderAll();\n  }\n\n  function wireDeskDrag(handle, body, el, desk){\n    function startDrag(e){\n      e.preventDefault();\n      const source = e.currentTarget;\n      source.setPointerCapture(e.pointerId);\n      const startX = e.clientX, startY = e.clientY;\n      const originLeft = desk.x, originTop = desk.y;\n      const maxX = Math.max(canvas.scrollWidth - DESK_W, 0);\n      const maxY = Math.max(canvas.scrollHeight - DESK_H, 0);\n\n      function onMove(ev){\n        const dx = ev.clientX - startX, dy = ev.clientY - startY;\n        let nx = Math.min(Math.max(originLeft + dx, 0), maxX);\n        let ny = Math.min(Math.max(originTop + dy, 0), maxY);\n        el.style.left = nx + 'px';\n        el.style.top = ny + 'px';\n        desk.x = nx; desk.y = ny;\n      }\n      function onUp(){\n        source.removeEventListener('pointermove', onMove);\n        saveClass();\n      }\n      source.addEventListener('pointermove', onMove);\n      source.addEventListener('pointerup', onUp, {once:true});\n      source.addEventListener('pointercancel', onUp, {once:true});\n    }\n\n    handle.addEventListener('pointerdown', (e) => {\n      if(layoutLocked) return;\n      if(e.target.closest('.desk-remove, .desk-unseat')) return;\n      startDrag(e);\n    });\n    body.addEventListener('pointerdown', (e) => {\n      if(layoutLocked) return;\n      if(e.target.closest('.nameplate') || e.target.closest('.unassign')) return;\n      startDrag(e);\n    });\n  }\n\n  const droppedList = document.getElementById('droppedList');\n\n  function renderRoster(){\n    rosterList.innerHTML = '';\n    droppedList.innerHTML = '';\n    const assigned = assignedStudentIds();\n    const active = state.roster.filter(s => !s.dropped);\n    const dropped = state.roster.filter(s => s.dropped);\n    const unassigned = active.filter(s => !assigned.has(s.id));\n    document.getElementById('unassignedCount').textContent = '(' + unassigned.length + ')';\n    document.getElementById('droppedCount').textContent = '(' + dropped.length + ')';\n\n    if(unassigned.length === 0){\n      const p = document.createElement('div');\n      p.className = 'roster-empty';\n      p.textContent = active.length === 0\n        ? 'Import a roster to get started.'\n        : 'Everyone has a seat.';\n      rosterList.appendChild(p);\n    }\n    unassigned.forEach(student => {\n      const chip = document.createElement('div');\n      chip.className = 'roster-chip';\n      chip.textContent = student.name;\n      makeNameDraggable(chip, student.id, null, student.name);\n      rosterList.appendChild(chip);\n    });\n\n    if(dropped.length === 0){\n      const p = document.createElement('div');\n      p.className = 'roster-empty';\n      p.textContent = 'Drag a student here if they drop the class.';\n      droppedList.appendChild(p);\n    }\n    dropped.forEach(student => {\n      const chip = document.createElement('div');\n      chip.className = 'roster-chip dropped';\n      chip.textContent = student.name;\n      chip.title = 'Dropped — drag back to Unassigned or onto a desk to restore';\n      makeNameDraggable(chip, student.id, null, student.name);\n      droppedList.appendChild(chip);\n    });\n  }\n\n  // ---------- Name dragging (works with mouse, pen and touch) ----------\n  const DRAG_THRESHOLD = 6;   // px of movement before a press becomes a drag\n  const EDGE = 48;            // px from the canvas edge where auto-scroll kicks in\n  const canvasWrap = document.querySelector('.canvas-wrap');\n  const rosterPanel = document.querySelector('.roster-panel');\n  let nameDrag = null;\n\n  function makeNameDraggable(el, studentId, fromDesk, label){\n    el.addEventListener('pointerdown', (e) => {\n      if(e.button !== 0 || e.target.closest('button')) return;\n      e.preventDefault();\n      el.setPointerCapture(e.pointerId);\n      nameDrag = {\n        studentId, fromDesk, label, source: el, pointerId: e.pointerId,\n        startX: e.clientX, startY: e.clientY, x: e.clientX, y: e.clientY,\n        active: false, ghost: null, target: null, raf: null\n      };\n    });\n    el.addEventListener('pointermove', onNameMove);\n    el.addEventListener('pointerup', onNameUp);\n    el.addEventListener('pointercancel', endNameDrag);\n    el.addEventListener('lostpointercapture', () => { if(nameDrag && nameDrag.source === el) endNameDrag(); });\n  }\n\n  function onNameMove(e){\n    const d = nameDrag;\n    if(!d || e.pointerId !== d.pointerId) return;\n    d.x = e.clientX; d.y = e.clientY;\n    if(!d.active){\n      if(Math.hypot(d.x - d.startX, d.y - d.startY) \u003c DRAG_THRESHOLD) return;\n      d.active = true;\n      d.ghost = document.createElement('div');\n      d.ghost.className = 'drag-ghost';\n      d.ghost.textContent = d.label;\n      document.body.appendChild(d.ghost);\n      d.source.classList.add('drag-source');\n      document.body.classList.add('name-dragging');\n      d.raf = requestAnimationFrame(autoScroll);\n    }\n    d.ghost.style.left = d.x + 'px';\n    d.ghost.style.top = d.y + 'px';\n    updateDropTarget();\n  }\n\n  function updateDropTarget(){\n    const d = nameDrag;\n    const hit = document.elementFromPoint(d.x, d.y);\n    let target = null;\n    if(hit){\n      const body = hit.closest('.desk-body');\n      if(body) target = body;\n      else if(hit.closest('#droppedSection')) target = droppedList;\n      else if(hit.closest('.roster-panel')) target = rosterList;\n    }\n    if(target === d.target) return;\n    if(d.target) d.target.classList.remove('drag-over');\n    if(target) target.classList.add('drag-over');\n    d.target = target;\n  }\n\n  function autoScroll(){\n    const d = nameDrag;\n    if(!d || !d.active) return;\n    const r = canvasWrap.getBoundingClientRect();\n    if(d.x >= r.left && d.x \u003c= r.right && d.y >= r.top && d.y \u003c= r.bottom){\n      const speed = (dist) => Math.ceil((EDGE - dist) / 4);\n      let dx = 0, dy = 0;\n      if(d.x - r.left \u003c EDGE) dx = -speed(d.x - r.left);\n      else if(r.right - d.x \u003c EDGE) dx = speed(r.right - d.x);\n      if(d.y - r.top \u003c EDGE) dy = -speed(d.y - r.top);\n      else if(r.bottom - d.y \u003c EDGE) dy = speed(r.bottom - d.y);\n      if(dx || dy){ canvasWrap.scrollLeft += dx; canvasWrap.scrollTop += dy; updateDropTarget(); }\n    }\n    d.raf = requestAnimationFrame(autoScroll);\n  }\n\n  function onNameUp(e){\n    const d = nameDrag;\n    if(!d || e.pointerId !== d.pointerId) return;\n    const wasActive = d.active, target = d.target;\n    endNameDrag();\n    if(!wasActive || !target) return;\n    const student = studentById(d.studentId);\n    if(!student) return;\n    if(target === rosterList || target === droppedList){\n      student.dropped = (target === droppedList) || undefined;\n      if(!student.dropped) delete student.dropped;\n      // Make sure they're not still sitting at a desk\n      state.desks.forEach(x => { if(x.studentId === student.id) x.studentId = null; });\n      saveClass();\n      renderAll();\n    } else {\n      const deskEl = target.closest('.desk');\n      if(!deskEl) return;\n      delete student.dropped; // seating a dropped student restores them\n      handleDrop({studentId: d.studentId, fromDesk: d.fromDesk}, deskEl.dataset.id);\n    }\n  }\n\n  function endNameDrag(){\n    const d = nameDrag;\n    if(!d) return;\n    nameDrag = null;\n    if(d.raf) cancelAnimationFrame(d.raf);\n    if(d.ghost) d.ghost.remove();\n    if(d.target) d.target.classList.remove('drag-over');\n    d.source.classList.remove('drag-source');\n    document.body.classList.remove('name-dragging');\n  }\n\n  // ---------- Actions ----------\n  function removeDesk(deskId){\n    state.desks = state.desks.filter(d => d.id !== deskId);\n    saveClass();\n    renderAll();\n  }\n\n  // Generate safe dynamic layouts for user-created rooms\n  function addDesk(){\n    const count = state.desks.length;\n    const col = count % 10;\n    const row = Math.floor(count / 10);\n    const desk = {\n      id: uid('desk'),\n      x: 40 + col * (DESK_W + 20),\n      y: 40 + row * (DESK_H + 30),\n      studentId: null\n    };\n    state.desks.push(desk);\n    saveClass();\n    renderAll();\n  }\n\n  function shuffleSeats(){\n    const shuffled = state.roster.filter(s => !s.dropped);\n    if(state.desks.length === 0 || shuffled.length === 0) return;\n    for(let i = shuffled.length - 1; i > 0; i--){\n      const j = Math.floor(Math.random() * (i+1));\n      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];\n    }\n    // Fill from the highest number down (01–10 face the wall, so they fill late),\n    // except the seats in SHUFFLE_LAST, which only fill once everything else is taken.\n    // The FIRST number in the list is the VERY LAST seat filled, the next is second-to-last, etc.\n    const SHUFFLE_LAST = [30, 10, 1];\n    const numbered = state.desks.map((d, i) => ({desk: d, num: i + 1}));\n    const fillOrder = numbered.filter(x => !SHUFFLE_LAST.includes(x.num)).reverse()\n      .concat(SHUFFLE_LAST.slice().reverse().map(n => numbered.find(x => x.num === n)).filter(Boolean))\n      .map(x => x.desk);\n    fillOrder.forEach((d, i) => {\n      d.studentId = shuffled[i] ? shuffled[i].id : null;\n    });\n    saveClass();\n    renderAll();\n  }\n\n  function clearSeats(){\n    state.desks.forEach(d => d.studentId = null);\n    saveClass();\n    renderAll();\n  }\n\n  // ---------- Modals ----------\n  function openModal(id){ document.getElementById(id).classList.add('show'); }\n  function closeModal(id){ document.getElementById(id).classList.remove('show'); }\n\n  function askConfirm(title, text, onOk){\n    document.getElementById('confirmTitle').textContent = title;\n    document.getElementById('confirmText').textContent = text;\n    confirmCallback = onOk;\n    openModal('confirmModal');\n  }\n\n  document.getElementById('confirmOk').addEventListener('click', () => {\n    closeModal('confirmModal');\n    if(confirmCallback) confirmCallback();\n    confirmCallback = null;\n  });\n  document.getElementById('confirmCancel').addEventListener('click', () => {\n    closeModal('confirmModal');\n    confirmCallback = null;\n  });\n\n  // New class\n  document.getElementById('newClassBtn').addEventListener('click', () => {\n    document.getElementById('newClassInput').value = '';\n    const sel = document.getElementById('copyLayoutSelect');\n    sel.innerHTML = '\u003coption value=\"\">Start empty\u003c/option>' +\n      state.classes.map(c => '\u003coption value=\"' + c + '\">' + c + '\u003c/option>').join('');\n    openModal('newClassModal');\n    document.getElementById('newClassInput').focus();\n  });\n  document.getElementById('newClassCancel').addEventListener('click', () => closeModal('newClassModal'));\n  document.getElementById('newClassConfirm').addEventListener('click', () => {\n    const name = document.getElementById('newClassInput').value.trim();\n    if(!name) return;\n    if(state.classes.includes(name)){\n      switchClass(name);\n      closeModal('newClassModal');\n      return;\n    }\n    const sourceName = document.getElementById('copyLayoutSelect').value;\n    let desks = [];\n    if(sourceName && classDataCache[sourceName]){\n      desks = classDataCache[sourceName].desks.map(d => ({id: uid('desk'), x: d.x, y: d.y, studentId: null}));\n    }\n    state.classes.push(name);\n    saveClassesIndex();\n    classDataCache[name] = {desks, roster: []};\n    switchClass(name);\n    closeModal('newClassModal');\n  });\n\n  // Duplicate current layout into other classes\n  document.getElementById('duplicateBtn').addEventListener('click', () => {\n    const others = state.classes.filter(c => c !== state.currentClass);\n    const list = document.getElementById('duplicateClassList');\n    list.innerHTML = '';\n    if(others.length === 0){\n      const p = document.createElement('div');\n      p.className = 'roster-empty';\n      p.textContent = 'Create another class first, then you can copy this layout into it.';\n      list.appendChild(p);\n    } else {\n      others.forEach(name => {\n        const label = document.createElement('label');\n        label.className = 'dup-option';\n        const cb = document.createElement('input');\n        cb.type = 'checkbox';\n        cb.value = name;\n        label.appendChild(cb);\n        label.appendChild(document.createTextNode(name));\n        list.appendChild(label);\n      });\n    }\n    openModal('duplicateModal');\n  });\n  document.getElementById('duplicateCancel').addEventListener('click', () => closeModal('duplicateModal'));\n  document.getElementById('duplicateConfirm').addEventListener('click', () => {\n    const checked = Array.from(document.querySelectorAll('#duplicateClassList input:checked')).map(i => i.value);\n    closeModal('duplicateModal');\n    if(checked.length === 0) return;\n    checked.forEach(name => {\n      const existing = classDataCache[name] || {desks: [], roster: []};\n      existing.desks = state.desks.map(d => ({id: uid('desk'), x: d.x, y: d.y, studentId: null}));\n      classDataCache[name] = existing;\n    });\n    persist();\n  });\n\n  function switchClass(name){\n    loadClass(name);\n    renderAll();\n    persist();\n  }\n\n  classSelect.addEventListener('change', () => switchClass(classSelect.value));\n\n  // Import roster\n  document.getElementById('importBtn').addEventListener('click', () => {\n    document.getElementById('rosterTextarea').value = state.roster.filter(s => !s.dropped).map(s => s.name).join('\\n');\n    openModal('importModal');\n  });\n  document.getElementById('importCancel').addEventListener('click', () => closeModal('importModal'));\n  document.getElementById('importConfirm').addEventListener('click', () => {\n    const lines = document.getElementById('rosterTextarea').value\n      .split('\\n')\n      .map(l => l.trim())\n      .filter(Boolean);\n\n    const existingByName = new Map(state.roster.map(s => [s.name.toLowerCase(), s]));\n    const seen = new Set();\n    const newRoster = [];\n    lines.forEach(name => {\n      const key = name.toLowerCase();\n      if(seen.has(key)) return;\n      seen.add(key);\n      const existing = existingByName.get(key);\n      if(existing){ delete existing.dropped; newRoster.push(existing); } // listing a dropped student restores them\n      else newRoster.push({id: uid('stu'), name});\n    });\n    const newIds = new Set(newRoster.map(s => s.id));\n    const keptDropped = state.roster.filter(s => s.dropped && !newIds.has(s.id));\n    state.desks.forEach(d => {\n      if(d.studentId && !newIds.has(d.studentId)) d.studentId = null;\n    });\n    state.roster = newRoster.concat(keptDropped);\n    saveClass();\n    renderAll();\n    closeModal('importModal');\n  });\n\n  // Layout lock\n  function applyLock(){\n    const btn = document.getElementById('lockBtn');\n    document.getElementById('appWrapper').classList.toggle('layout-locked', layoutLocked);\n    btn.classList.toggle('unlocked', !layoutLocked);\n    btn.setAttribute('aria-pressed', String(layoutLocked));\n    btn.textContent = layoutLocked ? '🔒 Layout Locked' : '🔓 Layout Unlocked';\n    btn.title = layoutLocked ? 'Unlock to move or add desks' : 'Lock to keep desks in place';\n    document.getElementById('addDeskBtn').disabled = layoutLocked;\n  }\n  document.getElementById('lockBtn').addEventListener('click', () => {\n    layoutLocked = !layoutLocked;\n    applyLock();\n  });\n  applyLock();\n\n  // Toolbar actions\n  document.getElementById('addDeskBtn').addEventListener('click', () => { if(!layoutLocked) addDesk(); });\n  document.getElementById('shuffleBtn').addEventListener('click', shuffleSeats);\n  document.getElementById('clearSeatsBtn').addEventListener('click', () => {\n    askConfirm('Clear all seats?', 'This unassigns every student for this class. Desks stay in place.', clearSeats);\n  });\n  document.getElementById('clearRosterBtn').addEventListener('click', () => {\n    if(state.roster.length === 0) return;\n    askConfirm('Clear roster for ' + state.currentClass + '?',\n      'This removes all ' + state.roster.length + ' students from this class (including the Dropped list) and empties their seats. Desks stay in place, and other classes are not affected.',\n      () => {\n        state.desks.forEach(d => d.studentId = null);\n        state.roster = [];\n        saveClass();\n        renderAll();\n      });\n  });\n  document.getElementById('printBtn').addEventListener('click', () => window.print());\n\n  // Fit the whole room onto one landscape page (Letter, 0.4in margins = ~970 x 740 px,\n  // minus room for the title lines). Runs for the Print button and for Ctrl/Cmd+P.\n  const PRINT_W = 960, PRINT_H = 600, PRINT_PAD = 6;\n  let printFramed = false;\n  let savedScroll = {left: 0, top: 0};\n\n  function roomBounds(){\n    let minX = TEACHER_DESK.x, minY = TEACHER_DESK.y,\n        maxX = TEACHER_DESK.x + TEACHER_DESK.w, maxY = TEACHER_DESK.y + TEACHER_DESK.h;\n    state.desks.forEach(d => {\n      minX = Math.min(minX, d.x); minY = Math.min(minY, d.y);\n      maxX = Math.max(maxX, d.x + DESK_W); maxY = Math.max(maxY, d.y + DESK_H + 3);\n    });\n    return {minX: minX - PRINT_PAD, minY: minY - PRINT_PAD, maxX: maxX + PRINT_PAD, maxY: maxY + PRINT_PAD};\n  }\n\n  function frameForPrint(){\n    if(printFramed) return;\n    printFramed = true;\n    const wrap = document.querySelector('.canvas-wrap');\n    const canvasEl = document.getElementById('canvas');\n    const titleBlock = document.getElementById('titleBlock');\n    const b = roomBounds();\n    const w = b.maxX - b.minX, h = b.maxY - b.minY;\n    const scale = Math.min(PRINT_W / w, PRINT_H / h);\n\n    // Title line goes above the room\n    wrap.parentNode.insertBefore(titleBlock, wrap);\n    wrap.style.width = (w * scale) + 'px';\n    wrap.style.height = (h * scale) + 'px';\n    canvasEl.style.width = b.maxX + 'px';\n    canvasEl.style.height = b.maxY + 'px';\n    canvasEl.style.transformOrigin = '0 0';\n    canvasEl.style.transform = 'scale(' + scale + ') translate(' + (-b.minX) + 'px, ' + (-b.minY) + 'px)';\n\n    // The room area keeps its scroll position even when clipped for print,\n    // so scroll it back to the corner or the top/left of the room gets cut off.\n    savedScroll = {left: wrap.scrollLeft, top: wrap.scrollTop};\n    wrap.scrollLeft = 0;\n    wrap.scrollTop = 0;\n  }\n\n  function unframeAfterPrint(){\n    if(!printFramed) return;\n    printFramed = false;\n    const wrap = document.querySelector('.canvas-wrap');\n    wrap.style.width = '';\n    wrap.style.height = '';\n    if(inPresentation()){\n      reframeForPresentation(); // title block already lives above the room in this view\n    } else {\n      wrap.appendChild(document.getElementById('titleBlock'));\n      resetCanvasFraming();\n      wrap.scrollLeft = savedScroll.left;\n      wrap.scrollTop = savedScroll.top;\n    }\n  }\n\n  window.addEventListener('beforeprint', frameForPrint);\n  window.addEventListener('afterprint', unframeAfterPrint);\n\n  // FULLSCREEN/PRESENTATION VIEW TOGGLE ACTION\nfunction reframeForPresentation(){\n    const wrap = document.querySelector('.canvas-wrap');\n    const canvasEl = document.getElementById('canvas');\n\n    canvasEl.style.transform = 'none';\n    canvasEl.style.width = '';\n    canvasEl.style.height = '';\n\n    const viewW = wrap.clientWidth;\n    const viewH = wrap.clientHeight;\n    if(!viewW || !viewH || state.desks.length === 0) return;\n\n    // 1. Set the precise 25px edge padding you requested\n    const margin = 25; \n    let minX = TEACHER_DESK.x, minY = TEACHER_DESK.y,\n        maxX = TEACHER_DESK.x + TEACHER_DESK.w, maxY = TEACHER_DESK.y + TEACHER_DESK.h;\n    \n    state.desks.forEach(d => {\n      minX = Math.min(minX, d.x);\n      minY = Math.min(minY, d.y);\n      maxX = Math.max(maxX, d.x + DESK_W);\n      maxY = Math.max(maxY, d.y + DESK_H);\n    });\n    \n    // Calculate the raw tight bounding box of just the desks\n    const contentW = maxX - minX;\n    const contentH = maxY - minY;\n\n    // 2. Compute scale using the viewport size MINUS the 25px padding on both sides (50px total)\n    // Removed the Math.min(1, ...) cap so it can scale UP past 100% if needed\n    const scale = Math.min((viewW - (margin * 2)) / contentW, (viewH - (margin * 2)) / contentH);\n\n    // 3. Determine how much empty canvas space is left over after scaling to center everything\n    const halfPendingW = (viewW / scale - contentW) / 2;\n    const halfPendingH = (viewH / scale - contentH) / 2;\n\n    // 4. Calculate exact canvas dimensions so the background grid never breaks at the screen edges\n    const neededW = Math.max(maxX, minX + (viewW / scale));\n    const neededH = Math.max(maxY, minY + (viewH / scale));\n    \n    canvasEl.style.width = neededW + 'px';\n    canvasEl.style.height = neededH + 'px';\n    canvasEl.style.transformOrigin = '0 0';\n    \n    // 5. Translate perfectly so the bounding box is perfectly centered with exactly 25px gaps\n    const offsetX = minX - halfPendingW;\n    const offsetY = minY - halfPendingH;\n\n    canvasEl.style.transform = 'scale(' + scale + ') translate(' + (-offsetX) + 'px, ' + (-offsetY) + 'px)';\n\n    // The room area keeps its old scroll position even with scrollbars hidden,\n    // which pushes the edge of the room off-screen. Snap it back to the corner.\n    wrap.scrollLeft = 0;\n    wrap.scrollTop = 0;\n  }\n\n  function resetCanvasFraming(){\n    const canvasEl = document.getElementById('canvas');\n    canvasEl.style.transform = '';\n    canvasEl.style.width = '';\n    canvasEl.style.height = '';\n  }\n\n  // Presentation view also asks the browser for real fullscreen (hides tabs and address bar).\n  function fsElement(){ return document.fullscreenElement || document.webkitFullscreenElement || null; }\n  function requestFs(){\n    const el = document.documentElement;\n    try{\n      const r = el.requestFullscreen ? el.requestFullscreen() : (el.webkitRequestFullscreen ? el.webkitRequestFullscreen() : null);\n      if(r && r.catch) r.catch(() => {}); // blocked or unsupported: the in-page view still works\n    }catch(e){}\n  }\n  function exitFs(){\n    if(!fsElement()) return;\n    try{\n      const r = document.exitFullscreen ? document.exitFullscreen() : (document.webkitExitFullscreen ? document.webkitExitFullscreen() : null);\n      if(r && r.catch) r.catch(() => {});\n    }catch(e){}\n  }\n  function inPresentation(){ return document.getElementById('appWrapper').classList.contains('presentation-mode'); }\n\n  let editScroll = {left: 0, top: 0};\n\n  function enterPresentation(){\n    if(inPresentation()) return;\n    const cw = document.querySelector('.canvas-wrap');\n    editScroll = {left: cw.scrollLeft, top: cw.scrollTop};\n    const toggleBtn = document.getElementById('toggleViewBtn');\n    const titleBlock = document.getElementById('titleBlock');\n    document.getElementById('appWrapper').classList.add('presentation-mode');\n    toggleBtn.textContent = \"🛠️ Edit Mode\";\n    titleBlock.appendChild(toggleBtn);\n    const ws = document.querySelector('.workspace');\n    ws.insertBefore(titleBlock, ws.firstChild);\n    requestFs();\n    requestAnimationFrame(reframeForPresentation);\n  }\n\n  function exitPresentation(){\n    if(!inPresentation()) return;\n    const toggleBtn = document.getElementById('toggleViewBtn');\n    const titleBlock = document.getElementById('titleBlock');\n    document.getElementById('appWrapper').classList.remove('presentation-mode');\n    toggleBtn.textContent = \"📺 Fullscreen View\";\n    const toolbar = document.getElementById('mainToolbar');\n    toolbar.insertBefore(toggleBtn, toolbar.querySelector('.spacer'));\n    const cw = document.querySelector('.canvas-wrap');\n    cw.appendChild(titleBlock);\n    resetCanvasFraming();\n    cw.scrollLeft = editScroll.left;\n    cw.scrollTop = editScroll.top;\n    exitFs();\n  }\n\n  document.getElementById('toggleViewBtn').addEventListener('click', () => {\n    inPresentation() ? exitPresentation() : enterPresentation();\n  });\n\n  // Pressing Esc leaves browser fullscreen — take that as \"back to Edit Mode\" too.\n  function onFsChange(){ if(!fsElement() && inPresentation()) exitPresentation(); }\n  document.addEventListener('fullscreenchange', onFsChange);\n  document.addEventListener('webkitfullscreenchange', onFsChange);\n\n  // Re-fit the room whenever the screen size changes while presenting.\n  let reframeTimer = null;\n  window.addEventListener('resize', () => {\n    if(!inPresentation()) return;\n    clearTimeout(reframeTimer);\n    reframeTimer = setTimeout(reframeForPresentation, 60);\n  });\n\n  // Export Setup\n  function generateConfigCode(){\n    saveClass();\n    const lines = ['const CLASS_DATA = {'];\n    state.classes.forEach((name, i) => {\n      const data = classDataCache[name] || {desks: [], roster: []};\n      lines.push('  ' + JSON.stringify(name) + ': {');\n      lines.push('    roster: ' + JSON.stringify(data.roster.map(s => s.name)) + ',');\n      lines.push('    dropped: ' + JSON.stringify(data.roster.filter(s => s.dropped).map(s => s.name)) + ',');\n      lines.push('    desks: [');\n      data.desks.forEach(d => {\n        const student = d.studentId ? (data.roster.find(s => s.id === d.studentId) || {}).name : null;\n        lines.push('      { x: ' + Math.round(d.x) + ', y: ' + Math.round(d.y) + ', student: ' + (student ? JSON.stringify(student) : 'null') + ' },');\n      });\n      lines.push('    ]');\n      lines.push('  }' + (i \u003c state.classes.length - 1 ? ',' : ''));\n    });\n    lines.push('};');\n    return lines.join('\\n');\n  }\n\n  document.getElementById('exportBtn').addEventListener('click', () => {\n    document.getElementById('exportOutput').value = generateConfigCode();\n    document.getElementById('copyStatus').textContent = '';\n    openModal('exportModal');\n  });\n  document.getElementById('exportClose').addEventListener('click', () => closeModal('exportModal'));\n  document.getElementById('resetSavedBtn').addEventListener('click', () => {\n    closeModal('exportModal');\n    askConfirm('Reset to file version?',\n      'This throws away every change saved in this browser and goes back to the layout and rosters written in the file. Copy your setup first if you might want it back.',\n      () => {\n        storageOk = false; // stop anything re-saving before the reload\n        try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}\n        location.reload();\n      });\n  });\n  document.getElementById('exportCopy').addEventListener('click', async () => {\n    const textarea = document.getElementById('exportOutput');\n    const status = document.getElementById('copyStatus');\n    try{\n      await navigator.clipboard.writeText(textarea.value);\n      status.textContent = 'Copied!';\n    }catch(e){\n      textarea.focus();\n      textarea.select();\n      status.textContent = 'Select-all applied — press Ctrl/Cmd+C to copy.';\n    }\n  });\n\n\n  // ---------- Import Setup ----------\n  // Reads a CLASS_DATA setup (from Export Setup, or a whole chart file) without running it.\n  function parseSetup(text){\n    const at = text.indexOf('CLASS_DATA');\n    const start = text.indexOf('{', at \u003c 0 ? 0 : at);\n    if(start \u003c 0) throw new Error('missing');\n    let depth = 0, inStr = false, end = -1;\n    for(let i = start; i \u003c text.length; i++){\n      const c = text[i];\n      if(inStr){ if(c === '\\\\') i++; else if(c === '\"') inStr = false; continue; }\n      if(c === '\"') inStr = true;\n      else if(c === '{') depth++;\n      else if(c === '}'){ depth--; if(depth === 0){ end = i; break; } }\n    }\n    if(end \u003c 0) throw new Error('cut off');\n    const body = text.slice(start, end + 1);\n    let out = '';\n    for(let i = 0; i \u003c body.length;){\n      const c = body[i];\n      if(c === '\"'){\n        let j = i + 1;\n        while(j \u003c body.length && body[j] !== '\"'){ if(body[j] === '\\\\') j++; j++; }\n        out += body.slice(i, j + 1); i = j + 1; continue;\n      }\n      if(c === '/' && body[i+1] === '/'){ while(i \u003c body.length && body[i] !== '\\n') i++; continue; }\n      if(/[A-Za-z_$]/.test(c)){\n        let j = i; while(j \u003c body.length && /[\\w$]/.test(body[j])) j++;\n        const word = body.slice(i, j); let k = j; while(/\\s/.test(body[k] || '')) k++;\n        out += body[k] === ':' ? JSON.stringify(word) : word; i = j; continue;\n      }\n      if(c === ','){\n        let k = i + 1; while(/\\s/.test(body[k] || '')) k++;\n        if(body[k] === '}' || body[k] === ']'){ i++; continue; }\n      }\n      out += c; i++;\n    }\n    const raw = JSON.parse(out), valid = {};\n    Object.keys(raw).forEach(name => {\n      const cfg = raw[name];\n      if(!cfg || typeof cfg !== 'object' || !name.trim()) return;\n      const names = a => (Array.isArray(a) ? a : []).filter(n => typeof n === 'string' && n.trim()).map(n => n.trim());\n      const roster = names(cfg.roster), dropped = names(cfg.dropped);\n      const desks = (Array.isArray(cfg.desks) ? cfg.desks : [])\n        .filter(d => d && typeof d.x === 'number' && typeof d.y === 'number')\n        .map(d => ({ x:d.x, y:d.y, student: (typeof d.student === 'string' && d.student.trim()) ? d.student.trim() : null }));\n      desks.forEach(d => { if(d.student && !roster.includes(d.student)) roster.push(d.student); });\n      if(!roster.length && !desks.length) return;\n      valid[name.trim()] = { roster, dropped, desks };\n    });\n    return valid;\n  }\n\n  // Publish the chart's classes for the games. The dashboard copies these into a game\n  // each time it opens, so every game plays from this chart.\n  function publishForGames(){\n    try{\n      const snap = snapshot(), classes = {}, order = [];\n      state.classes.forEach(name => {\n        const cfg = snap[name]; if(!cfg) return;\n        const dropped = new Set(cfg.dropped || []);\n        const desks = (cfg.desks || []).filter(d => typeof d.x === 'number' && typeof d.y === 'number');\n        if(!desks.length || desks.length > 120) return;\n        const layout = desks.map(d => [Math.round(d.x), Math.round(d.y)]);\n        const seats = desks.map(d => (d.student && !dropped.has(d.student)) ? d.student : null);\n        const roster = (cfg.roster || []).filter(n => !dropped.has(n));\n        seats.forEach(n => { if(n && !roster.includes(n)) roster.push(n); });\n        classes[name] = { roster, seats, layout };\n        order.push(name);\n      });\n      localStorage.setItem('dash306-chart', JSON.stringify({ classes, order }));\n    }catch(e){}\n  }\n\n  const setupText = document.getElementById('setupTextarea');\n  const setupErr = document.getElementById('setupError');\n  document.getElementById('setupImportBtn').addEventListener('click', () => {\n    setupText.value = ''; setupErr.hidden = true;\n    openModal('setupModal'); setTimeout(() => setupText.focus(), 0);\n  });\n  document.getElementById('setupCancel').addEventListener('click', () => closeModal('setupModal'));\n  document.getElementById('setupConfirm').addEventListener('click', () => {\n    const text = setupText.value.trim();\n    const fail = msg => { setupErr.textContent = msg; setupErr.hidden = false; };\n    if(!text) return fail('Paste the text from Export Setup first.');\n    let valid;\n    try{ valid = parseSetup(text); }\n    catch(e){ return fail('That doesn’t look like a CLASS_DATA setup. In Export Setup, click Copy to Clipboard and paste all of it here.'); }\n    const names = Object.keys(valid);\n    if(!names.length) return fail('No classes with students or desks were found in that text.');\n    saveClass();\n    names.forEach(name => {\n      classDataCache[name] = classFromConfig(valid[name]);\n      if(!state.classes.includes(name)) state.classes.push(name);\n    });\n    loadClass(state.currentClass && state.classes.includes(state.currentClass) ? state.currentClass : names[0]);\n    renderAll();\n    persist();\n    closeModal('setupModal');\n    setSaveStatus('✓ Imported ' + names.length + (names.length === 1 ? ' class' : ' classes'));\n  });\n\n  // ---------- Init ----------\n  function init(){\n    loadClassesIndex();\n    loadClass(state.classes.includes(state.currentClass) ? state.currentClass : state.classes[0]);\n    renderAll();\n    if(!storageOk) setSaveStatus('⚠ Not saving — use Export Setup to keep changes', true);\n    else if(!document.getElementById('saveStatus').textContent) setSaveStatus('Changes save automatically');\n  }\n  init();\n  publishForGames();\n  // Re-fit once the web font finishes loading, since it changes name widths.\n  if(document.fonts && document.fonts.ready){\n    document.fonts.ready.then(fitNames);\n    document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', fitNames);\n  }\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "306_Heads_Up_7_Up.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>306 Heads Up 7 Up\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{\n  --panel:#F2F2F2; --border:#B5B5B5; --text:#161616; --muted:#5C5C5C;\n  --floor:#E9E9E9; --floor-dot:#C6C6C6;\n  --tile:#F7F7F7; --tile-edge:#C4C4C4; --tile-num:#8A8A8A; --tile-icon:#B0B0B0;\n  --paper:#FFFFFF; --paper-edge:#CFCFCF; --ink:#121212; --ink-soft:#4A4A4A;\n  --accent:#9E1B32; --accent-dark:#7A1527; --field-bg:#FFFFFF; --live:#2E8B5
