\n  --fire:#F08A34;\n  --dash-line:#707070; --dash-label:#5A5A5A;\n  color-scheme: dark;\n}\n*,*::before,*::after{ box-sizing:border-box; }\nhtml{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }\nbody{ margin:0; height:100%; background:var(--panel); color:var(--text); font-family:var(--sans); }\nbutton{ font-family:inherit; }\n:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }\n[hidden]{ display:none !important; }\n\n#host{ height:100%; display:flex; flex-direction:column; }\n\n/* ---------- Top bar ---------- */\n.bar{\n  display:flex; align-items:center; gap:8px; flex-wrap:wrap;\n  padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--border);\n}\n.brand{ display:flex; align-items:center; gap:10px; margin-right:8px; }\n.brand-mark{\n  width:34px; height:34px; border-radius:50%; border:2px solid var(--accent);\n  display:inline-grid; place-items:center; flex-shrink:0; position:relative;\n}\n.brand-mark::after{ content:''; width:14px; height:14px; border-radius:50%; background:var(--accent); }\n.brand-mark::before{\n  content:''; position:absolute; top:-6px; right:-3px; width:8px; height:8px; border-radius:50%;\n  background:var(--fire-glow); box-shadow:0 0 0 2px var(--fire);\n}\n.brand h1{ font-size:24px; font-weight:700; letter-spacing:.01em; margin:0; }\nselect{\n  background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:6px;\n  padding:8px 10px; font:inherit; font-size:14px; max-width:180px;\n}\n.status{\n  display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--muted);\n  padding:6px 12px; border-radius:999px; border:1px solid var(--border); white-space:nowrap;\n}\n.status i{ width:9px; height:9px; border-radius:50%; background:var(--muted); }\n.status.ready i{ background:var(--live); }\n.status.burning i{ background:var(--fire); box-shadow:0 0 0 4px color-mix(in srgb, var(--fire) 30%, transparent); }\n.status.paused i{ background:#D9A33A; }\n.status.boom i, .status.question i, .status.ended i{ background:var(--accent); }\n.spacer{ flex:1; }\n.sep{ width:1px; align-self:stretch; background:var(--border); margin:0 4px; }\n.btn{\n  background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:6px;\n  padding:8px 12px; font-size:13px; cursor:pointer; white-space:nowrap;\n  transition:background .15s ease, border-color .15s ease;\n}\n.btn:hover:not(:disabled){ border-color:var(--accent); }\n.btn:disabled{ opacity:.4; cursor:not-allowed; }\n.btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }\n.btn.primary:hover:not(:disabled){ background:var(--accent-dark); border-color:var(--accent-dark); }\n.btn.danger{ color:var(--danger-text); border-color:var(--accent); }\n.btn.danger:hover:not(:disabled){ background:var(--accent); color:#fff; }\n.btn.boombtn{ background:var(--fire); border-color:var(--fire); color:#121212; font-weight:700; }\n.btn.boombtn:hover:not(:disabled){ background:#F29A4E; border-color:#F29A4E; }\n#soundBtn[aria-pressed=\"false\"]{ color:var(--muted); }\n\n/* ---------- Fullscreen dashboard bar ---------- */\n.dash{\n  display:none; align-items:center; gap:36px; flex-wrap:wrap;\n  padding:10px 20px; background:var(--paper); color:var(--ink);\n  border-bottom:2px solid var(--dash-line); box-shadow:0 4px 10px rgba(0,0,0,.4);\n  position:relative; z-index:6;\n}\n.dash .item{ display:flex; align-items:baseline; gap:8px; font-size:17px; font-weight:600; white-space:nowrap; }\n.dash .lbl{ font-family:var(--mono); font-size:11px; color:var(--dash-label); letter-spacing:.05em; text-transform:uppercase; font-weight:400; }\n.dash .big{ font-size:24px; font-weight:700; }\n.dash .acts{ margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }\n.dash .btn{ background:#FFFFFF; color:var(--ink); border-color:#9A9A9A; }\n.dash .btn.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }\n.dash .btn.boombtn{ background:var(--fire); border-color:#B85F16; color:#121212; }\n\n#host.present .bar, #host.present .side{ display:none; }\n#host.present .dash{ display:flex; }\n#host.present .main{ grid-template-columns:1fr; }\n\n/* ---------- Room ---------- */\n.main{ flex:1; display:grid; grid-template-columns:1fr 250px; min-height:0; }\n.stage{\n  position:relative; overflow:hidden; min-height:0;\n  background-color:var(--floor);\n  background-image:radial-gradient(circle, var(--floor-dot) 1px, transparent 1.4px);\n  background-size:25px 25px;\n}\n.stage.shake{ animation:shake .55s cubic-bezier(.36,.07,.19,.97); }\n@keyframes shake{\n  10%,90%{ transform:translate(-2px,1px); }\n  20%,80%{ transform:translate(4px,-2px); }\n  30%,50%,70%{ transform:translate(-9px,3px); }\n  40%,60%{ transform:translate(9px,-3px); }\n}\n.flash{\n  position:absolute; inset:0; pointer-events:none; z-index:8; opacity:0;\n  background:radial-gradient(circle at 50% 45%, rgba(255,214,110,.9), rgba(232,117,31,.55) 35%, rgba(158,27,50,.25) 60%, transparent 80%);\n}\n.flash.go{ animation:flashFx .8s ease-out; }\n@keyframes flashFx{ 0%{ opacity:1; } 100%{ opacity:0; } }\n.map{ position:absolute; top:0; left:0; transform-origin:0 0; }\n\n.seat{\n  position:absolute; width:130px; height:84px; margin:0; border:0; border-radius:6px;\n  background:var(--tile); box-shadow:inset 0 0 0 1px var(--tile-edge), 0 3px 0 rgba(0,0,0,.55);\n  padding:6px 10px 16px 14px; display:flex; align-items:center; justify-content:center;\n  color:var(--tile-icon); font:inherit; text-align:left; cursor:default;\n  transition:background .2s ease, box-shadow .12s ease;\n}\n.seat svg{ display:block; }\n.seat.occupied{\n  background:var(--paper); box-shadow:inset 0 0 0 1px var(--paper-edge), 0 3px 0 rgba(0,0,0,.55);\n  justify-content:flex-start; cursor:pointer;\n}\n.seat.occupied::before{\n  content:''; position:absolute; left:0; top:0; bottom:0; width:6px;\n  background:var(--accent); border-radius:6px 0 0 6px;\n}\n.seat.occupied:hover{ box-shadow:inset 0 0 0 2px var(--accent), 0 3px 0 rgba(0,0,0,.55); }\n/* While it's BOOM, the desks still in glow so it's obvious what to click */\n.picking .seat.occupied:not(.out){ box-shadow:inset 0 0 0 2px var(--fire), 0 3px 0 rgba(0,0,0,.55); }\n.picking .seat.occupied:not(.out):hover{ box-shadow:inset 0 0 0 4px var(--fire), 0 3px 0 rgba(0,0,0,.55); }\n.seat.holder{ box-shadow:inset 0 0 0 4px var(--fire), 0 0 0 6px color-mix(in srgb, var(--fire) 40%, transparent), 0 3px 0 rgba(0,0,0,.55) !important; }\n.np{ display:flex; flex-direction:column; gap:2px; max-width:100%; overflow:hidden; color:var(--ink); }\n.np-first{ font-weight:700; font-size:20px; line-height:1.05; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }\n.np-last{ font-size:12px; font-weight:500; color:var(--ink-soft); line-height:1.15; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }\n.seat .num{\n  position:absolute; right:7px; bottom:4px; font-family:var(--mono); font-weight:500;\n  font-size:14px; color:var(--tile-num); pointer-events:none;\n}\n.seat.occupied .num{ color:#7A7A7A; font-size:12px; }\n.seat.out{ background:var(--tile); box-shadow:inset 0 0 0 1px var(--tile-edge), 0 3px 0 rgba(0,0,0,.55); }\n.seat.out::before{ background:var(--tile-edge); }\n.seat.out .np-first, .seat.out .np-last{\n  color:var(--tile-num); text-decoration:line-through;\n  text-decoration-color:var(--accent); text-decoration-thickness:2px;\n}\n.seat.out .num{ color:var(--tile-num); }\n.seat.out:hover{ box-shadow:inset 0 0 0 2px var(--accent), 0 3px 0 rgba(0,0,0,.55); }\n.seat .place{\n  position:absolute; top:-9px; right:-9px; min-width:32px; height:22px; padding:0 7px; border-radius:11px;\n  background:var(--accent); color:#fff; font-size:12px; font-weight:700;\n  display:grid; place-items:center; box-shadow:0 2px 4px rgba(0,0,0,.45);\n}\n.seat.winner{ box-shadow:inset 0 0 0 3px var(--live), 0 0 0 6px color-mix(in srgb, var(--live) 35%, transparent), 0 3px 0 rgba(0,0,0,.55); }\n.seat.pop{ animation:pop .35s ease; }\n@keyframes pop{ 0%{transform:scale(1)} 40%{transform:scale(.9)} 100%{transform:scale(1)} }\n\n.teacher-desk{\n  position:absolute; border-radius:6px; background:var(--tile);\n  box-shadow:inset 0 0 0 2px var(--accent), 0 3px 0 rgba(0,0,0,.55);\n  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;\n  color:var(--muted); pointer-events:none; user-select:none;\n}\n.teacher-desk svg{ width:34px; height:34px; }\n.teacher-desk span{ font-weight:600; font-size:15px; color:var(--text); }\n\n.banner{\n  position:absolute; left:50%; top:18px; transform:translateX(-50%);\n  background:var(--paper); color:var(--ink); border-left:6px solid var(--accent); border-radius:6px;\n  padding:12px 22px; font-size:22px; font-weight:700; box-shadow:0 8px 22px rgba(0,0,0,.45); z-index:5; text-align:center;\n  max-width:92%;\n}\n.banner.win{ border-left-color:var(--live); font-size:28px; }\n.banner.final{ border-left-color:#D9A33A; }\n.banner.boom{ border-left-color:var(--fire); font-size:28px; }\n\n/* ---------- The fuse (sits in the room, above the Teacher Desk) ---------- */\n.fuse{\n  --fc:var(--fire);\n  position:absolute; margin:0; border:0; border-radius:6px; overflow:hidden;\n  padding:16px 22px 16px 14px; font:inherit; text-align:left; cursor:pointer;\n  background:var(--tile); color:var(--text);\n  box-shadow:inset 0 0 0 2px var(--fc), 0 3px 0 rgba(0,0,0,.55);\n  display:grid; grid-template-columns:136px 1fr; gap:16px; align-items:center;\n}\n.fuse:hover:not(.off){ box-shadow:inset 0 0 0 3px var(--fc), 0 3px 0 rgba(0,0,0,.55); }\n.fuse .bomb{ width:136px; height:136px; display:block; overflow:visible; }\n.fuse .bomb .wick{ stroke:var(--tile-num); }\n.fuse .spark{ opacity:0; transform-box:fill-box; transform-origin:center; }\n.fuse.ready .spark{ opacity:0; }\n.fuse.burning .spark{ opacity:1; animation:spark .16s steps(2) infinite; }\n.fuse.burning .bomb-body{ animation:wobble .5s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 60%; }\n.fuse.burning .wick{ stroke:var(--fire); }\n@keyframes spark{ 0%{ transform:scale(1) rotate(0deg); } 100%{ transform:scale(1.35) rotate(22deg); } }\n@keyframes wobble{ 0%,100%{ transform:rotate(-2.5deg); } 50%{ transform:rotate(2.5deg); } }\n.fuse-info{ display:flex; flex-direction:column; justify-content:center; gap:6px; min-width:0; }\n.fuse-lbl{ font-size:16px; font-weight:700; }\n.fuse-big{\n  font-size:70px; font-weight:700; line-height:1; letter-spacing:-.01em; color:var(--fc);\n  white-space:nowrap; overflow:hidden;\n}\n.fuse-big.num{ font-family:var(--mono); font-weight:500; font-size:92px; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }\n.fuse-hint{ font-size:14px; color:var(--muted); }\n.fuse.ready .fuse-big{ color:var(--text); }\n.fuse.paused{ --fc:#D9A33A; }\n.fuse.paused .fuse-big{ animation:blink 1.2s steps(2) infinite; }\n.fuse.boom{ --fc:var(--accent); animation:boomFlash .45s steps(2) 6; }\n.fuse.boom .fuse-hint{ color:var(--text); font-weight:700; }\n.fuse.off{ cursor:default; box-shadow:inset 0 0 0 1px var(--tile-edge), 0 3px 0 rgba(0,0,0,.55); }\n.fuse.off .fuse-big{ color:var(--tile-num); opacity:.5; }\n.fuse.off .bomb{ opacity:.55; }\n@keyframes boomFlash{ 50%{ background:color-mix(in srgb, var(--fire) 40%, var(--tile)); } }\n@keyframes blink{ 50%{ opacity:.35; } }\n\n/* ---------- Question card ---------- */\n.qcard{\n  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:7;\n  width:min(86%, 840px); max-height:88%; overflow:auto;\n  background:var(--paper); color:var(--ink); border-radius:10px; border-top:8px solid var(--fire);\n  padding:24px 36px 26px; box-shadow:0 24px 60px rgba(0,0,0,.65); text-align:center;\n}\n.qcard.in{ animation:qIn .45s cubic-bezier(.2,1.4,.4,1); }\n@keyframes qIn{ from{ transform:translate(-50%,-50%) scale(.6); opacity:0; } }\n.qk{ font-size:clamp(17px, 1.7vw, 26px); font-weight:700; color:var(--accent); margin:0 0 10px; }\n.qt{ font-size:clamp(26px, 3.1vw, 52px); font-weight:700; line-height:1.14; margin:0; }\n.qa{ font-size:clamp(20px, 2.1vw, 34px); font-weight:600; color:#1F6B3F; margin:14px 0 0; }\n.qnote{ font-size:14px; color:var(--ink-soft); margin:10px 0 0; }\n.qbtns{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:20px; }\n.qcard .btn{ background:#FFFFFF; color:var(--ink); border-color:#9A9A9A; font-size:16px; padding:11px 18px; }\n.qcard .btn.yes{ background:#2E8B57; border-color:#2E8B57; color:#fff; font-weight:700; }\n.qcard .btn.yes:hover{ background:#257048; border-color:#257048; }\n.qcard .btn.no{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }\n.qcard .btn.no:hover{ background:var(--accent-dark); border-color:var(--accent-dark); }\n.qcard .btn kbd{ margin-left:6px; background:rgba(255,255,255,.2); color:inherit; border-color:rgba(255,255,255,.45); }\n.qcard .btn:not(.yes):not(.no) kbd{ background:#F2F2F2; color:#121212; border-color:#C4C4C4; }\n.qwrong{ background:none; border:0; color:var(--ink-soft); font-size:13px; text-decoration:underline; cursor:pointer; margin-top:14px; }\n\n/* ---------- Side panel ---------- */\n.side{\n  background:var(--panel); border-left:1px solid var(--border); padding:16px;\n  display:flex; flex-direction:column; gap:16px; overflow-y:auto; min-height:0;\n}\n.count b{ display:block; font-size:60px; line-height:.9; font-weight:700; }\n.count span{ font-size:14px; color:var(--muted); }\n.modechip{ font-size:13px; color:var(--muted); }\n.modechip b{ color:var(--text); }\n.side h2{ font-size:14px; margin:0 0 10px; display:flex; gap:6px; align-items:center; }\n.side h2 small{ font-family:var(--mono); font-size:11px; color:var(--muted); font-weight:400; }\n.outlist{ list-style:none; margin:0; padding:0; }\n.outlist li{\n  display:flex; gap:10px; align-items:baseline; font-size:14px;\n  background:var(--tile); color:var(--muted); border-left:5px solid var(--accent);\n  border-radius:5px; padding:7px 10px; margin-bottom:7px;\n}\n.outlist .pl{ font-weight:700; color:var(--text); min-width:32px; }\n.empty-note{ font-size:12.5px; color:var(--muted); font-style:italic; margin:0; padding:4px; }\n.keys{ margin-top:auto; border-top:1px solid var(--border); padding-top:12px; font-size:12.5px; color:var(--muted); }\n.keys h2{ margin-bottom:8px; }\n.keys dl{ display:grid; grid-template-columns:auto 1fr; gap:6px 10px; margin:0; align-items:center; }\n.keys dt, .keys dd{ margin:0; }\nkbd{\n  font-family:var(--mono); font-size:11px; color:var(--text); background:var(--tile);\n  border:1px solid var(--tile-edge); border-bottom-width:2px; border-radius:4px; padding:1px 6px;\n}\n\n.toast{\n  position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);\n  background:var(--paper); color:var(--ink); border-left:5px solid var(--accent);\n  padding:10px 16px; border-radius:6px; font-size:15px; z-index:20; box-shadow:0 10px 24px rgba(0,0,0,.45);\n  opacity:0; pointer-events:none; transition:opacity .2s ease; max-width:90vw;\n}\n.toast.show{ opacity:1; }\n\n/* ---------- Dialogs ---------- */\ndialog{\n  background:var(--panel); color:var(--text); border:1px solid var(--border); border-top:4px solid var(--accent);\n  border-radius:10px; padding:22px; width:min(460px, 92vw); box-shadow:0 20px 50px rgba(0,0,0,.6);\n}\ndialog::backdrop{ background:rgba(0,0,0,.7); backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px); }\ndialog h3{ margin:0 0 6px; font-size:17px; }\ndialog p{ margin:0 0 12px; font-size:13px; color:var(--muted); line-height:1.45; }\ndialog ol{ margin:0 0 12px; padding-left:20px; font-size:13px; color:var(--muted); line-height:1.6; }\ndialog textarea{\n  width:100%; min-height:200px; resize:vertical; background:var(--field-bg); color:var(--text);\n  border:1px solid var(--border); border-radius:6px; padding:10px; font:inherit; font-size:14px; line-height:1.5;\n}\ndialog textarea:focus, dialog select:focus{ border-color:var(--accent); outline:none; }\ndialog select{ max-width:none; width:100%; background:var(--field-bg); }\n#importText{ font-family:var(--mono); font-size:12px; white-space:pre; }\n#questionsText{ min-height:260px; }\ndialog .err{ color:var(--danger-text); font-size:13px; margin:10px 0 0; }\ndialog .field{ font-size:13px; font-weight:600; color:var(--text); margin:16px 0 8px; }\ndialog .field:first-of-type{ margin-top:12px; }\n.opt{\n  display:flex; gap:10px; align-items:flex-start; padding:10px 12px; margin-bottom:8px;\n  background:var(--field-bg); border:1px solid var(--border); border-radius:6px; cursor:pointer; font-size:14px;\n}\n.opt:has(input:checked){ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, var(--field-bg)); }\n.opt input{ margin-top:3px; accent-color:var(--accent); }\n.opt b{ display:block; font-weight:600; }\n.opt small{ display:block; color:var(--muted); font-size:12.5px; margin-top:2px; }\n.actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap; }\n\n/* ---------- Rules screen (for the projector) ---------- */\n.rules{\n  position:fixed; inset:0; z-index:15; overflow-y:auto;\n  background-color:var(--floor);\n  background-image:radial-gradient(circle, var(--floor-dot) 1px, transparent 1.4px);\n  background-size:25px 25px;\n  padding:calc(28px + env(safe-area-inset-top,0px)) 4vw calc(28px + env(safe-area-inset-bottom,0px));\n  display:flex; flex-direction:column; gap:clamp(16px, 2.6vh, 30px);\n}\n.rules-head{ display:flex; align-items:center; gap:16px; }\n.rules-head .brand-mark{ width:clamp(40px, 4vw, 60px); height:clamp(40px, 4vw, 60px); border-width:3px; }\n.rules-head .brand-mark::after{ width:42%; height:42%; }\n.rules-head .brand-mark::before{ width:22%; height:22%; top:-12%; right:-6%; }\n.rules-head h2{ margin:0; font-size:clamp(34px, 4.6vw, 70px); font-weight:700; line-height:1; letter-spacing:-.01em; }\n.rules-head p{ margin:4px 0 0; font-size:clamp(15px, 1.4vw, 22px); color:var(--muted); }\n.rules-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:clamp(14px, 1.6vw, 26px); flex:1; }\n.rule-card{\n  background:var(--paper); color:var(--ink); border-radius:8px; border-left:10px solid var(--ink-soft);\n  padding:clamp(16px, 1.8vw, 30px) clamp(16px, 1.8vw, 30px) clamp(16px, 1.8vw, 30px) clamp(18px, 2vw, 34px);\n  box-shadow:0 4px 0 rgba(0,0,0,.55);\n}\n.rule-card.boom{ border-left-color:var(--fire); }\n.rule-card.safe{ border-left-color:var(--live); }\n.rule-card h3{ margin:0 0 clamp(10px, 1.4vh, 18px); font-size:clamp(22px, 2.3vw, 38px); line-height:1.05; }\n.rule-card ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:clamp(8px, 1.3vh, 16px); }\n.rule-card li{ font-size:clamp(17px, 1.65vw, 28px); line-height:1.25; font-weight:500; padding-left:1.1em; position:relative; }\n.rule-card li::before{\n  content:''; position:absolute; left:0; top:.42em; width:.45em; height:.45em; border-radius:2px; background:var(--ink-soft);\n}\n.rule-card.boom li::before{ background:var(--fire); border-radius:50%; }\n.rule-card.safe li::before{ background:var(--live); border-radius:50%; }\n.rule-card li b{ font-weight:700; }\n.rules-foot{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }\n.rules-foot .call{ font-size:clamp(16px, 1.5vw, 24px); font-weight:600; margin-right:auto; }\n.rules-foot .btn{ font-size:clamp(14px, 1.2vw, 18px); padding:10px 18px; }\n.rules-foot .hint{ font-size:13px; color:var(--muted); }\n\n@media (max-width:820px){\n  .main{ grid-template-columns:1fr; grid-template-rows:60vh auto; }\n  .side{ border-left:none; border-top:1px solid var(--border); }\n  .keys{ display:none; }\n}\n@media (prefers-reduced-motion: reduce){\n  *{ animation:none !important; transition:none !important; }\n}\n\n/* ---------- Check-in ---------- */\n#checkinBtn.on{ border-color:var(--live); }\n#checkinDialog{ width:min(760px, 94vw); }\n.ci-join{ display:flex; gap:24px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin:10px 0 18px; }\ndialog p.ci-lbl{ margin:0 0 4px; font-size:14px; }\ndialog p.ci-url{ margin:0 0 10px; font-size:clamp(16px,2vw,22px); font-weight:600; color:var(--text); overflow-wrap:anywhere; }\n.ci-code{ display:flex; gap:8px; }\n.ci-code span{\n  width:clamp(50px,8vw,76px); aspect-ratio:3/4; display:grid; place-items:center;\n  background:var(--field-bg); border:2px solid var(--border); border-bottom-width:5px; border-radius:10px;\n  font-family:var(--mono); font-weight:500; font-size:clamp(34px,6vw,56px); color:var(--accent);\n}\n.ci-qr{ background:#fff; padding:8px; border-radius:8px; line-height:0; }\n.ci-qr img, .ci-qr canvas{ width:150px; height:150px; }\n.ci-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; font-size:15px; }\n.ci-open{ display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); margin-right:auto; }\n.ci-open i{ width:9px; height:9px; border-radius:50%; background:var(--live); }\n.ci-open.paused i{ background:var(--muted); }\n.ci-list{ list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:6px; max-height:38vh; overflow:auto; }\n.ci-list li{\n  display:flex; align-items:center; gap:8px; padding:6px 4px 6px 12px;\n  background:var(--field-bg); border:1px solid var(--border); border-radius:6px; font-size:14px;\n}\n.ci-list .n{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }\n.ci-list .d{ font-family:var(--mono); font-size:12px; color:var(--muted); white-space:nowrap; }\n.ci-list .d.new{ color:var(--fire); }\n.ci-list .d.none{ color:var(--danger-text); }\n.ci-list .x{ border:0; background:none; color:var(--muted); cursor:pointer; width:26px; height:26px; border-radius:6px; font-size:18px; line-height:1; }\n.ci-list .x:hover{ color:var(--danger-text); background:var(--panel); }\ndialog p.ci-empty{ border:2px dashed var(--border); border-radius:8px; padding:18px; text-align:center; margin:0; }\n#ciEnd{ margin-right:auto; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv id=\"host\">\n  \u003cheader class=\"bar\">\n    \u003cdiv class=\"brand\">\u003cspan class=\"brand-mark\" aria-hidden=\"true\">\u003c/span>\u003ch1>306 Hot Potato\u003c/h1>\u003c/div>\n    \u003cselect id=\"classSelect\" aria-label=\"Class period\">\u003c/select>\n    \u003cspan class=\"status\" id=\"status\">\u003ci>\u003c/i>\u003cspan id=\"statusText\">Waiting to start\u003c/span>\u003c/span>\n    \u003cdiv class=\"spacer\">\u003c/div>\n    \u003cbutton class=\"btn\" id=\"checkinBtn\">📲 Check-in\u003c/button>\n    \u003cbutton class=\"btn\" id=\"importBtn\">Import chart\u003c/button>\n    \u003cbutton class=\"btn\" id=\"seatsBtn\">Edit seats\u003c/button>\n    \u003cbutton class=\"btn\" data-act=\"resetseats\" hidden>Reset seats\u003c/button>\n    \u003cbutton class=\"btn\" id=\"questionsBtn\">Questions\u003c/button>\n    \u003cbutton class=\"btn\" id=\"settingsBtn\">Settings\u003c/button>\n    \u003cbutton class=\"btn\" data-act=\"rules\">Rules\u003c/button>\n    \u003cbutton class=\"btn\" id=\"soundBtn\" aria-pressed=\"true\">🔊 Sound on\u003c/button>\n    \u003cspan class=\"sep\" aria-hidden=\"true\">\u003c/span>\n    \u003cbutton class=\"btn\" data-act=\"undo\">Undo\u003c/button>\n    \u003cbutton class=\"btn primary\" data-act=\"go\">Start game\u003c/button>\n    \u003cbutton class=\"btn boombtn\" data-act=\"boom\" hidden>💥 Boom now\u003c/button>\n    \u003cbutton class=\"btn\" data-act=\"end\">End round\u003c/button>\n    \u003cbutton class=\"btn\" data-act=\"restart\">Restart\u003c/button>\n    \u003cbutton class=\"btn danger\" data-act=\"endgame\" hidden>End game\u003c/button>\n    \u003cbutton class=\"btn\" data-act=\"present\">📺 Fullscreen View\u003c/button>\n  \u003c/header>\n\n  \u003cdiv class=\"dash\" id=\"dash\">\n    \u003cdiv class=\"item\">\u003cspan class=\"lbl\">Class\u003c/span>\u003cspan id=\"dClass\">—\u003c/span>\u003c/div>\n    \u003cdiv class=\"item\">\u003cspan class=\"lbl\">Round\u003c/span>\u003cspan id=\"dRound\">1\u003c/span>\u003c/div>\n    \u003cdiv class=\"item\">\u003cspan class=\"lbl\">Still in\u003c/span>\u003cspan class=\"big\" id=\"dAlive\">0\u003c/span>\u003cspan id=\"dOf\">\u003c/span>\u003c/div>\n    \u003cdiv class=\"item\">\u003cspan class=\"lbl\">Last out\u003c/span>\u003cspan id=\"dLast\">—\u003c/span>\u003c/div>\n    \u003cdiv class=\"acts\">\n      \u003cbutton class=\"btn\" data-act=\"rules\">Rules\u003c/button>\n      \u003cbutton class=\"btn\" data-act=\"undo\">Undo\u003c/button>\n      \u003cbutton class=\"btn primary\" data-act=\"go\">Start game\u003c/button>\n      \u003cbutton class=\"btn boombtn\" data-act=\"boom\" hidden>💥 Boom now\u003c/button>\n      \u003cbutton class=\"btn\" data-act=\"end\">End round\u003c/button>\n      \u003cbutton class=\"btn\" data-act=\"restart\">Restart\u003c/button>\n      \u003cbutton class=\"btn danger\" data-act=\"endgame\" hidden>End game\u003c/button>\n      \u003cbutton class=\"btn primary\" data-act=\"present\">🛠️ Edit Mode\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"main\">\n    \u003cdiv class=\"stage\" id=\"stage\">\n      \u003cdiv class=\"map\" id=\"map\">\u003c/div>\n      \u003cdiv class=\"banner\" id=\"banner\" hidden>\u003c/div>\n      \u003cdiv class=\"qcard\" id=\"qcard\" role=\"dialog\" aria-live=\"polite\" hidden>\n        \u003cp class=\"qk\" id=\"qKicker\">\u003c/p>\n        \u003cp class=\"qt\" id=\"qText\">\u003c/p>\n        \u003cp class=\"qa\" id=\"qAnswer\" hidden>\u003c/p>\n        \u003cp class=\"qnote\" id=\"qNote\" hidden>Add your own questions with the Questions button.\u003c/p>\n        \u003cdiv class=\"qbtns\">\n          \u003cbutton class=\"btn yes\" id=\"qYes\">✓ Got it \u003ckbd>Y\u003c/kbd>\u003c/button>\n          \u003cbutton class=\"btn no\" id=\"qNo\">✗ Missed it \u003ckbd>N\u003c/kbd>\u003c/button>\n          \u003cbutton class=\"btn\" id=\"qShow\">Show answer \u003ckbd>A\u003c/kbd>\u003c/button>\n          \u003cbutton class=\"btn\" id=\"qNew\">New question \u003ckbd>Q\u003c/kbd>\u003c/button>\n        \u003c/div>\n        \u003cbutton class=\"qwrong\" id=\"qWrong\">Wrong student? Pick again\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"flash\" id=\"flash\">\u003c/div>\n    \u003c/div>\n    \u003caside class=\"side\">\n      \u003cdiv class=\"count\">\u003cb id=\"aliveCount\">0\u003c/b>\u003cspan id=\"aliveLabel\">still in\u003c/span>\u003c/div>\n      \u003cdiv class=\"modechip\" id=\"modeChip\">\u003c/div>\n      \u003cdiv>\n        \u003ch2>Out \u003csmall id=\"outCount\">\u003c/small>\u003c/h2>\n        \u003col class=\"outlist\" id=\"outList\">\u003c/ol>\n        \u003cp class=\"empty-note\" id=\"outEmpty\">Nobody yet. When it booms, click the desk of whoever has the ball.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"keys\">\n        \u003ch2>Shortcuts\u003c/h2>\n        \u003cdl>\n          \u003cdt>\u003ckbd>Space\u003c/kbd>\u003c/dt>\u003cdd>Start, light the fuse, pause\u003c/dd>\n          \u003cdt>\u003ckbd>B\u003c/kbd>\u003c/dt>\u003cdd>Boom now (teacher’s call)\u003c/dd>\n          \u003cdt>\u003ckbd>Y\u003c/kbd> \u003ckbd>N\u003c/kbd>\u003c/dt>\u003cdd>Got it or missed it\u003c/dd>\n          \u003cdt>\u003ckbd>Z\u003c/kbd>\u003c/dt>\u003cdd>Undo the last out\u003c/dd>\n          \u003cdt>\u003ckbd>F\u003c/kbd>\u003c/dt>\u003cdd>Fullscreen view\u003c/dd>\n          \u003cdt>\u003ckbd>M\u003c/kbd>\u003c/dt>\u003cdd>Sound on or off\u003c/dd>\n          \u003cdt>\u003ckbd>R\u003c/kbd>\u003c/dt>\u003cdd>Rules screen\u003c/dd>\n        \u003c/dl>\n      \u003c/div>\n    \u003c/aside>\n  \u003c/div>\n\u003c/div>\n\n\u003cdialog id=\"seatsDialog\">\n  \u003ch3>Edit seats\u003c/h3>\n  \u003cp>One student per line. Students already on the chart keep their desks.\u003c/p>\n  \u003ctextarea id=\"rosterText\" spellcheck=\"false\">\u003c/textarea>\n  \u003cdiv class=\"actions\">\n    \u003cbutton class=\"btn\" id=\"seatsCancel\">Cancel\u003c/button>\n    \u003cbutton class=\"btn\" id=\"seatsShuffle\">Shuffle everyone\u003c/button>\n    \u003cbutton class=\"btn primary\" id=\"seatsFill\">Save seats\u003c/button>\n  \u003c/div>\n\u003c/dialog>\n\n\u003cdialog id=\"importDialog\">\n  \u003ch3>Import from seating chart\u003c/h3>\n  \u003col>\n    \u003cli>In the 306 Seating Chart, click Export Setup.\u003c/li>\n    \u003cli>Click Copy to Clipboard, then paste it below.\u003c/li>\n  \u003c/ol>\n  \u003cp>This replaces the game’s classes, desks and seats with the chart’s. Students on the Dropped list are left out.\u003c/p>\n  \u003ctextarea id=\"importText\" spellcheck=\"false\" placeholder=\"const CLASS_DATA = {&#10;  &quot;p1: GA2&quot;: {&#10;    roster: [ … ],&#10;    desks: [ … ]&#10;  },&#10;  …&#10;};\">\u003c/textarea>\n  \u003cp class=\"err\" id=\"importErr\" role=\"alert\" hidden>\u003c/p>\n  \u003cdiv class=\"actions\">\n    \u003cbutton class=\"btn\" id=\"importCancel\">Cancel\u003c/button>\n    \u003cbutton class=\"btn primary\" id=\"importConfirm\">Import\u003c/button>\n  \u003c/div>\n\u003c/dialog>\n\n\u003cdialog id=\"settingsDialog\">\n  \u003ch3>Game settings\u003c/h3>\n  \u003cp class=\"field\">When it booms\u003c/p>\n  \u003clabel class=\"opt\">\u003cinput type=\"radio\" name=\"mode\" value=\"out\">\u003cspan>\u003cb>Whoever has the ball is out\u003c/b>\u003csmall>Last one still in wins.\u003c/small>\u003c/span>\u003c/label>\n  \u003clabel class=\"opt\">\u003cinput type=\"radio\" name=\"mode\" value=\"question\">\u003cspan>\u003cb>Whoever has the ball answers a question\u003c/b>\u003csmall>Right answer, they’re safe. Miss it, they’re out.\u003c/small>\u003c/span>\u003c/label>\n  \u003cp class=\"field\">Fuse length\u003c/p>\n  \u003cselect id=\"fuseSel\" aria-label=\"Fuse length\">\n    \u003coption value=\"short\">Short: booms after 5 to 15 seconds\u003c/option>\n    \u003coption value=\"medium\">Medium: booms after 10 to 25 seconds\u003c/option>\n    \u003coption value=\"long\">Long: booms after 20 to 40 seconds\u003c/option>\n  \u003c/select>\n  \u003cp class=\"field\">Countdown\u003c/p>\n  \u003clabel class=\"opt\">\u003cinput type=\"checkbox\" id=\"showCount\">\u003cspan>\u003cb>Show the seconds left\u003c/b>\u003csmall>Leave this off to keep it a surprise. Students only hear the ticking.\u003c/small>\u003c/span>\u003c/label>\n  \u003cp class=\"field\">Sound check\u003c/p>\n  \u003cp>Plays a few ticks and a boom so you can set your speaker volume. Works even when sound is off.\u003c/p>\n  \u003cbutton class=\"btn\" id=\"testSound\" type=\"button\">🔊 Play test sounds\u003c/button>\n  \u003cdiv class=\"actions\">\n    \u003cbutton class=\"btn\" id=\"settingsCancel\">Cancel\u003c/button>\n    \u003cbutton class=\"btn primary\" id=\"settingsSave\">Save settings\u003c/button>\n  \u003c/div>\n\u003c/dialog>\n\n\u003cdialog id=\"questionsDialog\">\n  \u003ch3 id=\"questionsTitle\">Questions\u003c/h3>\n  \u003cp>One question per line. To keep an answer handy, put it after a | bar. Each class has its own list, drawn in random order.\u003c/p>\n  \u003ctextarea id=\"questionsText\" spellcheck=\"false\" placeholder=\"What does RGB stand for? | Red, green, blue&#10;Name a primary color.&#10;What's the shortcut to undo? | Ctrl/Cmd + Z\">\u003c/textarea>\n  \u003cdiv class=\"actions\">\n    \u003cbutton class=\"btn\" id=\"questionsCancel\">Cancel\u003c/button>\n    \u003cbutton class=\"btn primary\" id=\"questionsSave\">Save questions\u003c/button>\n  \u003c/div>\n\u003c/dialog>\n\n\u003cdialog id=\"confirmDialog\">\n  \u003ch3>Restart the round?\u003c/h3>\n  \u003cp>Everyone comes back in and the out list clears. This can’t be undone.\u003c/p>\n  \u003cdiv class=\"actions\">\n    \u003cbutton class=\"btn\" id=\"confirmCancel\">Cancel\u003c/button>\n    \u003cbutton class=\"btn danger\" id=\"confirmOk\">Restart\u003c/button>\n  \u003c/div>\n\u003c/dialog>\n\n\u003cdialog id=\"checkinDialog\" aria-labelledby=\"ciTitle\">\n  \u003ch3 id=\"ciTitle\">Student check-in\u003c/h3>\n  \u003cdiv id=\"ciStart\">\n    \u003cp>Students check in on their own devices, then you seat only the students who are here. During the game, each student’s screen shows whether they’re in or out, and questions appear on the screen of whoever has the ball.\u003c/p>\n  \u003c/div>\n  \u003cdiv id=\"ciLive\" hidden>\n    \u003cdiv class=\"ci-join\">\n      \u003cdiv>\n        \u003cp class=\"ci-lbl\">Go to\u003c/p>\n        \u003cp class=\"ci-url\" id=\"ciUrl\">\u003c/p>\n        \u003cp class=\"ci-lbl\">and enter\u003c/p>\n        \u003cdiv class=\"ci-code\" id=\"ciCode\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"ci-qr\" id=\"ciQr\" aria-label=\"QR code that opens the check-in page\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"ci-head\">\n      \u003cb id=\"ciCount\">0 checked in\u003c/b>\n      \u003cspan class=\"ci-open\" id=\"ciOpen\">\u003ci>\u003c/i>\u003cspan id=\"ciOpenText\">Joining open\u003c/span>\u003c/span>\n      \u003cbutton class=\"btn\" id=\"ciPause\">Pause joining\u003c/button>\n    \u003c/div>\n    \u003cul class=\"ci-list\" id=\"ciList\" aria-live=\"polite\">\u003c/ul>\n    \u003cp class=\"ci-empty\" id=\"ciEmpty\">Names appear here as students check in.\u003c/p>\n  \u003c/div>\n  \u003cp class=\"err\" id=\"ciErr\" role=\"alert\" hidden>\u003c/p>\n  \u003cdiv class=\"actions\">\n    \u003cbutton class=\"btn danger\" id=\"ciEnd\" hidden>End check-in\u003c/button>\n    \u003cbutton class=\"btn\" id=\"ciClose\">Close\u003c/button>\n    \u003cbutton class=\"btn primary\" id=\"ciGo\">Start check-in\u003c/button>\n  \u003c/div>\n\u003c/dialog>\n\n\u003csection class=\"rules\" id=\"rules\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"rulesTitle\" hidden>\n  \u003cheader class=\"rules-head\">\n    \u003cspan class=\"brand-mark\" aria-hidden=\"true\">\u003c/span>\n    \u003cdiv>\n      \u003ch2 id=\"rulesTitle\">Hot Potato\u003c/h2>\n      \u003cp>Room 306 rules\u003c/p>\n    \u003c/div>\n  \u003c/header>\n  \u003cdiv class=\"rules-grid\">\n    \u003carticle class=\"rule-card\">\n      \u003ch3>How to play\u003c/h3>\n      \u003cul>\n        \u003cli>When the fuse is lit, \u003cb>pass the ball\u003c/b> to the next person in order.\u003c/li>\n        \u003cli>Catch it and \u003cb>pass it right away\u003c/b>. No holding.\u003c/li>\n        \u003cli>Nobody knows when it will \u003cb>boom\u003c/b>. Listen to the ticking.\u003c/li>\n        \u003cli>Out? \u003cb>Stay in your seat.\u003c/b> The ball skips you.\u003c/li>\n      \u003c/ul>\n    \u003c/article>\n    \u003carticle class=\"rule-card boom\">\n      \u003ch3>When it booms\u003c/h3>\n      \u003cul id=\"boomRules\">\u003c/ul>\n    \u003c/article>\n    \u003carticle class=\"rule-card safe\">\n      \u003ch3>Safe passing\u003c/h3>\n      \u003cul>\n        \u003cli>\u003cb>Hand it\u003c/b> over or toss it \u003cb>softly underhand\u003c/b>.\u003c/li>\n        \u003cli>Pass only to the \u003cb>next person\u003c/b>. No skipping.\u003c/li>\n        \u003cli>\u003cb>Stay seated.\u003c/b> No standing or leaning across desks.\u003c/li>\n        \u003cli>Keep it \u003cb>low and away from computers\u003c/b>.\u003c/li>\n        \u003cli>\u003cb>Throwing hard\u003c/b> or at someone is out.\u003c/li>\n      \u003c/ul>\n    \u003c/article>\n  \u003c/div>\n  \u003cfooter class=\"rules-foot\">\n    \u003cspan class=\"call\">The teacher’s call is final.\u003c/span>\n    \u003cspan class=\"hint\">Space starts the game\u003c/span>\n    \u003cbutton class=\"btn\" id=\"rulesClose\">Back to the room\u003c/button>\n    \u003cbutton class=\"btn primary\" data-act=\"go\">Start game\u003c/button>\n  \u003c/footer>\n\u003c/section>\n\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\">\u003c/div>\n\n\u003cscript>\n(function(){\n  const $ = s => document.querySelector(s);\n  const $$ = s => [...document.querySelectorAll(s)];\n  const DESK_W = 130, DESK_H = 84;\n  const TEACHER_DESK = { x: 133, y: 257, w: 130, h: 229 };\n  // The fuse: open floor above the Teacher Desk, lined up with desk 27's right edge.\n  const TIMER_BOX = { x: 133, y: 52, w: 458, h: 180 };\n  const FUSES = { short:[5,15], medium:[10,25], long:[20,40] };\n  const MONITOR_SVG = '\u003csvg viewBox=\"0 0 24 24\" width=\"26\" height=\"26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"4\" width=\"18\" height=\"12\" rx=\"1.5\"/>\u003cpath d=\"M9 20h6M12 16v4\"/>\u003c/svg>';\n  const BOMB_SVG =\n    '\u003csvg class=\"bomb\" viewBox=\"0 0 136 136\" aria-hidden=\"true\">' +\n      '\u003cg class=\"bomb-body\">' +\n        '\u003cpath class=\"wick\" d=\"M92 40 C 100 26, 112 34, 118 18\" fill=\"none\" stroke-width=\"4\" stroke-linecap=\"round\"/>' +\n        '\u003crect x=\"78\" y=\"34\" width=\"22\" height=\"16\" rx=\"3\" transform=\"rotate(40 89 42)\" fill=\"#3A3A3A\"/>' +\n        '\u003ccircle cx=\"60\" cy=\"80\" r=\"44\" fill=\"#1C1C1C\" stroke=\"#4A4A4A\" stroke-width=\"2\"/>' +\n        '\u003cpath d=\"M32 66 A 30 30 0 0 1 50 46\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".3\" stroke-width=\"6\" stroke-linecap=\"round\"/>' +\n      '\u003c/g>' +\n      '\u003cg transform=\"translate(118 18)\">\u003cg class=\"spark\">' +\n        '\u003cpath d=\"M0-15V15M-15 0H15M-10-10L10 10M-10 10L10-10\" stroke=\"#E0761F\" stroke-width=\"3\" stroke-linecap=\"round\"/>' +\n        '\u003ccircle r=\"7\" fill=\"#FFC54D\"/>' +\n      '\u003c/g>\u003c/g>' +\n    '\u003c/svg>';\n\n  // Room 306 desk layout (from the seating chart), desk 01 first.\n  const LAYOUT = [\n    [1313,690],[1171,690],[1030,690],[888,690],[746,690],[605,690],[462,690],[318,690],[171,690],[27,688],\n    [1160,257],[1304,257],[1159,402],[1304,402],[1160,521],\n    [920,150],[920,243],[920,335],[920,429],[920,522],\n    [700,149],[700,248],[700,340],[700,432],[700,524],\n    [318,257],[461,257],[316,402],[460,402],[133,521]\n  ];\n  const N = LAYOUT.length;\n  function seatsFrom(map){ const s = Array(N).fill(null); Object.keys(map).forEach(i => s[i] = map[i]); return s; }\n  const DEFAULT_CLASSES = {\n    \"p1: GA2\": { roster: [], seats: Array(N).fill(null) },\n    \"p2: GA1\": { roster: [], seats: Array(N).fill(null) },\n    \"p3: HSB27\": { roster: [], seats: Array(N).fill(null) },\n    \"p4: FrS\": { roster: [], seats: Array(N).fill(null) },\n    \"p5: DA1\": { roster: [], seats: Array(N).fill(null) }\n  };\n\n  // ---------- helpers ----------\n  const store = {\n    get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },\n    set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }\n  };\n  const pad2 = n => String(n).padStart(2,'0');\n  const firstName = n => String(n || 'Student').trim().split(/\\s+/)[0];\n  function shortName(n){ const p = n.trim().split(/\\s+/); return p.length > 1 ? p[0] + ' ' + p[p.length-1][0] + '.' : p[0]; }\n  function ordinal(n){ const s=['th','st','nd','rd'], v=n%100; return n + (s[(v-20)%10]||s[v]||s[0]); }\n  function plateHTML(n){\n    const p = n.trim().split(/\\s+/), d = document.createElement('div');\n    const f = document.createElement('span'); f.className='np-first'; f.textContent = p[0]; d.appendChild(f);\n    if(p.length > 1){ const l = document.createElement('span'); l.className='np-last'; l.textContent = p.slice(1).join(' '); d.appendChild(l); }\n    return d.innerHTML;\n  }\n  function fitNames(root){\n    root.querySelectorAll('.np-first').forEach(el => {\n      el.style.fontSize = '';\n      let size = parseFloat(getComputedStyle(el).fontSize);\n      while(el.scrollWidth > el.clientWidth && size > 12){ size = Math.max(12, size - 0.5); el.style.fontSize = size + 'px'; }\n    });\n  }\n  // Seating chart's shuffle order: highest desk first, desks 30, 10 and 1 fill last.\n  const SHUFFLE_LAST = [30, 10, 1];\n  function fillOrder(n){\n    const last = SHUFFLE_LAST.filter(k => k \u003c= n);\n    return [...Array(n).keys()].map(i=>i+1).filter(k => !last.includes(k)).reverse()\n      .concat(last.slice().reverse()).map(k => k-1);\n  }\n  function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }\n  let toastTimer;\n  function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), 2800); }\n\n  function boundsOf(L){\n    const minX = Math.min(TEACHER_DESK.x, TIMER_BOX.x, ...L.map(p=>p[0]));\n    const minY = Math.min(TEACHER_DESK.y, TIMER_BOX.y, ...L.map(p=>p[1]));\n    return {\n      minX, minY,\n      w: Math.max(TEACHER_DESK.x + TEACHER_DESK.w, TIMER_BOX.x + TIMER_BOX.w, ...L.map(p=>p[0] + DESK_W)) - minX,\n      h: Math.max(TEACHER_DESK.y + TEACHER_DESK.h, ...L.map(p=>p[1] + DESK_H + 3)) - minY\n    };\n  }\n  function validLayout(L){\n    return Array.isArray(L) && L.length > 0 && L.length \u003c= 120 &&\n      L.every(p => Array.isArray(p) && p.length === 2 && p.every(v => typeof v === 'number' && isFinite(v)));\n  }\n\n  // ---------- settings & questions ----------\n  let S = Object.assign({ mode:'out', fuse:'medium', show:false }, store.get('hp306-settings') || {});\n  if(!['out','question'].includes(S.mode)) S.mode = 'out';\n  if(!FUSES[S.fuse]) S.fuse = 'medium';\n  S.show = !!S.show;\n\n  // Each class keeps its own question list. A class without one starts from the old shared list.\n  function classQuestions(key){\n    const all = store.get('hp306-qbank') || {};\n    return typeof all[key] === 'string' ? all[key] : String(store.get('hp306-questions') || '');\n  }\n  function saveClassQuestions(key, text){\n    const all = store.get('hp306-qbank') || {}; all[key] = text; store.set('hp306-qbank', all);\n  }\n  function questionBank(){\n    return String(classQuestions(G.classKey)).split('\\n').map(l => l.trim()).filter(Boolean).map(l => {\n      const k = l.indexOf('|');\n      return k \u003c 0 ? { q:l, a:'' } : { q:l.slice(0,k).trim(), a:l.slice(k+1).trim() };\n    }).filter(x => x.q);\n  }\n  let deck = [], deckFor = '';\n  function drawQuestion(){\n    const bank = questionBank();\n    if(!bank.length) return null;\n    if(!deck.length || deckFor !== G.classKey){ deck = shuffle(bank); deckFor = G.classKey; }\n    return deck.pop();\n  }\n  let Q = null, answerShown = false;\n\n  // ---------- classes ----------\n  function classKeys(){\n    const order = store.get('hp306-class-order');\n    if(Array.isArray(order) && order.length) return [...order];\n    return [...new Set([...Object.keys(DEFAULT_CLASSES), ...Object.keys(store.get('hp306-classes')||{})])];\n  }\n  function classData(key){\n    const o = (store.get('hp306-classes')||{})[key];\n    return o || DEFAULT_CLASSES[key] || { roster:[], seats:[], layout:LAYOUT };\n  }\n  function saveClassData(key, data){ const all = store.get('hp306-classes')||{}; all[key]=data; store.set('hp306-classes', all); }\n  function normSeats(s, n){ const a=Array(n).fill(null); (s||[]).forEach((x,i)=>{ if(i\u003cn && typeof x==='string' && x.trim()) a[i]=x; }); return a; }\n  function freshGame(key, round){\n    const c = classData(key), layout = validLayout(c.layout) ? c.layout : LAYOUT;\n    return { classKey:key, layout, roster:[...(c.roster||[])], seats:normSeats(c.seats, layout.length), out:{}, seq:0, phase:'lobby', round:round||1, holder:-1, links:{} };\n  }\n  const PHASES = ['lobby','ready','burning','paused','boom','question','ended'];\n  function adopt(d){\n    if(!d || typeof d.classKey !== 'string' || !d.classKey) return null;\n    const layout = validLayout(d.layout) ? d.layout : LAYOUT;\n    let phase = PHASES.includes(d.phase) ? d.phase : 'lobby';\n    // A fuse can't survive a reload, and the question card isn't saved.\n    if(phase === 'burning' || phase === 'paused') phase = 'ready';\n    if(phase === 'question') phase = 'boom';\n    return {\n      classKey:d.classKey, layout, roster:Array.isArray(d.roster)?d.roster.filter(x=>typeof x==='string'):[],\n      seats:normSeats(d.seats, layout.length), out:(d.out && typeof d.out==='object')?{...d.out}:{},\n      seq:Number(d.seq)||0, phase, round:Number(d.round)||1, holder:-1,\n      links:(d.links && typeof d.links==='object') ? {...d.links} : {}\n    };\n  }\n\n  // ---------- seating chart import ----------\n  // Reads the text from the chart's Export Setup (or the whole chart file) without running it.\n  function parseChartExport(text){\n    const at = text.indexOf('CLASS_DATA');\n    const start = text.indexOf('{', at \u003c 0 ? 0 : at);\n    if(start \u003c 0) throw new Error('missing');\n    let depth = 0, inStr = false, end = -1;\n    for(let i = start; i \u003c text.length; i++){\n      const c = text[i];\n      if(inStr){ if(c === '\\\\') i++; else if(c === '\"') inStr = false; continue; }\n      if(c === '\"') inStr = true;\n      else if(c === '{') depth++;\n      else if(c === '}'){ depth--; if(depth === 0){ end = i; break; } }\n    }\n    if(end \u003c 0) throw new Error('cut off');\n    const body = text.slice(start, end + 1);\n    let out = '';\n    for(let i = 0; i \u003c body.length;){\n      const c = body[i];\n      if(c === '\"'){\n        let j = i + 1;\n        while(j \u003c body.length && body[j] !== '\"'){ if(body[j] === '\\\\') j++; j++; }\n        out += body.slice(i, j + 1); i = j + 1; continue;\n      }\n      if(c === '/' && body[i+1] === '/'){ while(i \u003c body.length && body[i] !== '\\n') i++; continue; }\n      if(/[A-Za-z_$]/.test(c)){\n        let j = i; while(j \u003c body.length && /[\\w$]/.test(body[j])) j++;\n        const word = body.slice(i, j); let k = j; while(/\\s/.test(body[k] || '')) k++;\n        out += body[k] === ':' ? JSON.stringify(word) : word; i = j; continue;\n      }\n      if(c === ','){\n        let k = i + 1; while(/\\s/.test(body[k] || '')) k++;\n        if(body[k] === '}' || body[k] === ']'){ i++; continue; }\n      }\n      out += c; i++;\n    }\n    const raw = JSON.parse(out);\n    const classes = {}, order = [];\n    Object.keys(raw).forEach(key => {\n      const cfg = raw[key];\n      if(!cfg || !Array.isArray(cfg.desks)) return;\n      const dropped = new Set(Array.isArray(cfg.dropped) ? cfg.dropped : []);\n      const desks = cfg.desks.filter(d => d && typeof d.x === 'number' && typeof d.y === 'number');\n      if(!desks.length || desks.length > 120) return;\n      const layout = desks.map(d => [Math.round(d.x), Math.round(d.y)]);\n      const seats = desks.map(d => (typeof d.student === 'string' && d.student.trim() && !dropped.has(d.student)) ? d.student : null);\n      const roster = (Array.isArray(cfg.roster) ? cfg.roster : []).filter(n => typeof n === 'string' && n.trim() && !dropped.has(n));\n      seats.forEach(n => { if(n && !roster.includes(n)) roster.push(n); });\n      classes[key] = { roster, seats, layout };\n      order.push(key);\n    });\n    if(!order.length) throw new Error('no classes');\n    return { classes, order };\n  }\n\n  // ---------- game facts ----------\n  function seatedIdx(G){ return G.seats.map((n,i)=>n?i:-1).filter(i=>i>=0); }\n  function isOut(G,i){ return Object.prototype.hasOwnProperty.call(G.out, String(i)); }\n  function aliveIdx(G){ return seatedIdx(G).filter(i=>!isOut(G,i)); }\n  function places(G){\n    const alive = aliveIdx(G).length;\n    const outs = Object.keys(G.out).map(Number).filter(i=>G.seats[i]).sort((a,b)=>G.out[b]-G.out[a]);\n    const m = {}; outs.forEach((i,k)=> m[i] = alive + k + 1);\n    return { map:m, order:outs };\n  }\n  const isBusy = G => ['ready','burning','paused','boom','question'].includes(G.phase);\n\n  // ---------- sound (made in the browser, no files) ----------\n  let soundOn = store.get('hp306-sound') !== false;\n  let actx = null;\n  function tone(f, t, d, type, v, to){\n    const o = actx.createOscillator(), g = actx.createGain();\n    o.type = type; o.frequency.setValueAtTime(f hue.toFixed(1) + ' 78% 50%)';\n  }\n  function drawFuse(){\n    const el = document.getElementById('fuse');\n    if(!el) return;\n    const big = el.querySelector('.fuse-big'), hint = el.querySelector('.fuse-hint');\n    let cls = 'fuse', text = 'Ready', h = '', num = false;\n    el.style.removeProperty('--fc');\n    switch(G.phase){\n      case 'lobby': cls += ' off'; h = 'Lights when the game starts'; break;\n      case 'ended': cls += ' off'; text = 'Done'; h = 'Round over'; break;\n      case 'ready': cls += ' ready'; h = 'Space or click to light it'; break;\n      case 'burning': {\n        cls += ' burning';\n        if(S.show){\n          const ms = Math.max(0, F.endAt - performance.now());\n          text = (ms / 1000).toFixed(1); num = true; el.style.setProperty('--fc', fuseColor(ms));\n          h = 'Pass it on!';\n        } else { text = F.word; h = 'Keep it moving!'; }\n        break;\n      }\n      case 'paused': cls += ' paused'; text = S.show ? (F.left / 1000).toFixed(1) : 'Paused'; num = S.show; h = 'Space or click to resume'; break;\n      case 'boom': cls += ' boom'; text = 'BOOM!'; h = 'Click whoever has the ball'; break;\n      case 'question': cls += ' boom'; text = 'BOOM!'; h = 'Question time'; break;\n    }\n    // Keep the flashing animation from restarting on every redraw.\n    if(el.className !== cls) el.className = cls;\n    big.textContent = text; big.classList.toggle('num', num);\n    hint.textContent = h;\n    el.setAttribute('aria-label', 'Fuse. ' + text + '. ' + h);\n  }\n\n  // ---- seats ----\n  function clickSeat(i){\n    if(!G.seats[i]) return;\n    const out = isOut(G,i);\n    if(G.phase === 'boom'){\n      if(out){ toast(firstName(G.seats[i]) + ' is already out. Click whoever has the ball.'); return; }\n      if(S.mode === 'question'){\n        G.holder = i; G.phase = 'question'; Q = drawQuestion(); answerShown = false;\n        sfx('pick'); pop(i); render(); save(); animateCard();\n        return;\n      }\n      eliminate(i); ase === 'paused'){ G.phase = 'burning'; }\n    boom();\n  }\n  function endRound(){ if(!isBusy(G)) return; stopFuse(); G.phase = 'ended'; G.holder = -1; Q = null; render(); save(); }\n  function doRestart(){\n    stopFuse(); G.out = {}; G.seq = 0; G.phase = 'lobby'; G.round += 1; G.holder = -1; Q = null; render(); save();\n    toast('Round ' + G.round + ' is ready. Press Space to start.');\n  }\n  function restart(){\n    if(G.phase === 'lobby') return;\n    if(Object.keys(G.out).length && G.phase !== 'ended') $('#confirmDialog').showModal();\n    else doRestart();\n  }\n  function undo(){\n    const keys = Object.keys(G.out);\n    if(!keys.length){ toast('Nothing to undo.'); return; }\n    const last = keys.reduce((a,b) => G.out[b] > G.out[a] ? b : a);\n    const i = Number(last);\n    delete G.out[last];\n    if(G.phase === 'ended' && aliveIdx(G).length > 1) G.phase = 'ready';\n    sfx('back'); pop(i); render(); save();\n    toast(firstName(G.seats[i]) + ' is back in.');\n  }\n\n  // ---- fullscreen view ----\n  const host = $('#host');\n  let inRealFs = false;\n  function fsEl(){ return document.fullscreenElement || document.webkitFullscreenElement || null; }\n  function enterPresent(){\n    if(host.classList.contains('present')) return;\n    host.classList.add('present');\n    try{\n      const el = document.documentElement;\n      const r = el.requestFullscreen ? el.requestFullscreen() : (el.webkitRequestFullscreen ? el.webkitRequestFullscreen() : null);\n      if(r && r.then) r.then(() => { inRealFs = true; }).catch(() => {});\n    }catch(e){}\n    render();\n  }\n  function exitPresent(){\n    if(!host.classList.contains('present')) return;\n    host.classList.remove('present');\n    if(fsEl()){ try{ const r = document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen(); if(r && r.catch) r.catch(()=>{}); }catch(e){} }\n    inRealFs = false;\n    render();\n  }\n  function togglePresent(){ host.classList.contains('present') ? exitPresent() : enterPresent(); }\n  function onFsChange(){ if(!fsEl() && inRealFs){ inRealFs = false; exitPresent(); } }\n  document.addEventListener('fullscreenchange', onFsChange);\n  document.addEventListener('webkitfullscreenchange', onFsChange);\n\n  // ---- sound toggle ----\n  function setSound(on){\n    soundOn = on; store.set('hp306-sound', on);\n    const b = $('#soundBtn'); b.setAttribute('aria-pressed', String(on));\n    b.textContent = on ? '🔊 Sound on' : '🔇 Sound off';\n  }\n  $('#soundBtn').addEventListener('click', () => { setSound(!soundOn); if(soundOn) sfx('back'); });\n  setSound(soundOn);\n\n  // ---- rules screen ----\n  const rulesEl = $('#rules');\n  function rulesOpen(){ return !rulesEl.hidden; }\n  function openRules(){ rulesEl.hidden = false; $('#rulesClose').focus(); }\n  function closeRules(){ if(!rulesEl.hidden) rulesEl.hidden = true; }\n  function toggleRules(){ rulesOpen() ? closeRules() : openRules(); }\n  $('#rulesClose').addEventListener('click', closeRules);\n  const BOOM_RULES = {\n    out: [\n      'Whoever is \u003cb>holding the ball\u003c/b> is out.',\n      'Ball \u003cb>in the air\u003c/b>? The thrower has it.',\n      'Ball \u003cb>on the floor\u003c/b>? Whoever dropped it has it.',\n      'The \u003cb>last one still in\u003c/b> wins.'\n    ],\n    question: [\n      'Whoever is \u003cb>holding the ball\u003c/b> answers a question.',\n      '\u003cb>Get it right\u003c/b> and you’re safe.',\n      '\u003cb>Miss it\u003c/b> and you’re out.',\n      'Ball \u003cb>in the air\u003c/b>? The thrower has it.',\n      'The \u003cb>last one still in\u003c/b> wins.'\n    ]\n  };\n\n  // ---- settings dialog ----\n  const sdlg = $('#settingsDialog');\n  $('#settingsBtn').addEventListener('click', () => {\n    $$('input[name=\"mode\"]').forEach(r => r.checked = r.value === S.mode);\n    $('#fuseSel').value = S.fuse; $('#showCount').checked = S.show;\n    sdlg.showModal();\n  });\n  $('#settingsCancel').addEventListener('click', () => sdlg.close());\n  $('#testSound').addEventListener('click', () => {\n    ['tick','tock','tick','tock'].forEach((k, n) => setTimeout(() => sfx(k, true), n * 500));\n    setTimeout(() => sfx('boom', true), 2100);\n  });\n  $('#settingsSave').addEventListener('click', () => {\n    const m = $$('input[name=\"mode\"]').find(r => r.checked);\n    S = { mode: m ? m.value : 'out', fuse: $('#fuseSel').value, show: $('#showCount').checked };\n    store.set('hp306-settings', S);\n    sdlg.close(); render();\n    toast('Settings saved. ' + (S.mode === 'question' ? 'Boom means a question.' : 'Boom means out.'));\n  });\n\n  // ---- questions dialog ----\n  const qdlg = $('#questionsDialog');\n  $('#questionsBtn').addEventListener('click', () => {\n    $('#questionsTitle').textContent = 'Questions for ' + G.classKey;\n    $('#questionsText').value = classQuestions(G.classKey); qdlg.showModal();\n  });\n  $('#questionsCancel').addEventListener('click', () => qdlg.close());\n  $('#questionsSave').addEventListener('click', () => {\n    saveClassQuestions(G.classKey, $('#questionsText').value);\n    deck = []; qdlg.close();\n    const n = questionBank().length;\n    toast(n ? n + (n === 1 ? ' question' : ' questions') + ' saved for ' + G.classKey + '.' : 'No questions saved for ' + G.classKey + '. You’ll ask your own when it booms.');\n    if(n && S.mode !== 'question') setTimeout(() => toast('Turn on questions in Settings: “Whoever has the ball answers a question.”'), 2900);\n  });\n\n  const ACTIONS = { go, boom: boomNow, end: endRound, restart, undo, present: togglePresent, rules: toggleRules,\n    endgame: endGame, resetseats: resetSeats };\n  $$('[data-act]').forEach(b => b.addEventListener('click', () => ACTIONS[b.dataset.act]()));\n  $('#confirmCancel').addEventListener('click', () => $('#confirmDialog').close());\n  $('#confirmOk').addEventListener('click', () => { $('#confirmDialog').close(); doRestart(); });\n\n  // ---- keyboard ----\n  document.addEventListener('keydown', e => {\n    if(e.defaultPrevented || e.altKey || e.repeat) return;\n    if(document.querySelector('dialog[open]')) return;\n    const t = e.target;\n    if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) return;\n    const k = e.key.toLowerCase();\n    if((e.ctrlKey || e.metaKey) && k !== 'z') return;\n    if(rulesOpen() && (k === 'escape' || k === 'r')){ e.preventDefault(); closeRules(); return; }\n    if(k === ' '){\n      e.preventDefault();\n      if(rulesOpen()){ closeRules(); if(G.phase === 'lobby') start(); return; }\n      go(); return;\n    }\n    if(G.phase === 'question'){\n      if(k === 'y'){ e.preventDefault(); gotIt(); return; }\n      if(k === 'n'){ e.preventDefault(); missed(); return; }\n      if(k === 'a'){ e.preventDefault(); showAnswer(); return; }\n      if(k === 'q'){ e.preventDefault(); newQuestion(); return; }\n    }\n    if(k === 'b'){ e.preventDefault(); boomNow(); }\n    else if(k === 'r'){ e.preventDefault(); openRules(); }\n    else if(k === 'z'){ e.preventDefault(); undo(); }\n    else if(k === 'f'){ e.preventDefault(); togglePresent(); }\n    else if(k === 'm'){ setSound(!soundOn); toast(soundOn ? 'Sound on' : 'Sound off'); }\n    else if(k === 'escape' && host.classList.contains('present') && !fsEl()){ exitPresent(); }\n  });\n\n  // ---- seats dialog ----\n  const dlg = $('#seatsDialog');\n  $('#seatsBtn').addEventListener('click', () => {\n    $('#rosterText').value = [...new Set([...G.roster, ...G.seats.filter(Boolean)])].join('\\n');\n    dlg.showModal();\n  });\n  $('#seatsCancel').addEventListener('click', () => dlg.close());\n  function readNames(){\n    const seen = new Set();\n    return $('#rosterText').value.split('\\n').map(s=>s.trim()).filter(s => s && !seen.has(s.toLowerCase()) && seen.add(s.toLowerCase()));\n  }\n  function applySeats(names, seats){\n    const extra = names.filter(n => !seats.includes(n));\n    stopFuse();\n    G.roster = names; G.seats = seats; G.out = {}; G.seq = 0; G.phase = 'lobby'; G.holder = -1;\n    saveClassData(G.classKey, { roster:names, seats, layout:G.layout });\n    dlg.close(); render(); save();\n    if(extra.length) toast(extra.length + (extra.length===1?' student has':' students have') + ' no desk. Add a desk in the seating chart.');\n  }\n  $('#seatsFill').addEventListener('click', () => {\n    const names = readNames();\n    const seats = G.seats.map(n => n && names.includes(n) ? n : null);\n    const waiting = names.filter(n => !seats.includes(n));\n    fillOrder(seats.length).forEach(i => { if(!seats[i] && waiting.length) seats[i] = waiting.shift(); });\n    applySeats(names, seats);\n  });\n  $('#seatsShuffle').addEventListener('click', () => {\n    const names = readNames(), mixed = shuffle(names), seats = Array(G.layout.length).fill(null);\n    fillOrder(seats.length).forEach((i,k) => { if(mixed[k]) seats[i] = mixed[k]; });\n    applySeats(names, seats);\n  });\n\n  // ---- import from seating chart ----\n  const idlg = $('#importDialog'), ierr = $('#importErr');\n  $('#importBtn').addEventListener('click', () => { $('#importText').value = ''; ierr.hidden = true; idlg.showModal(); $('#importText').focus(); });\n  $('#importCancel').addEventListener('click', () => idlg.close());\n  $('#importConfirm').addEventListener('click', () => {\n    const text = $('#importText').value.trim();\n    if(!text){ ierr.textContent = 'Paste the text from the seating chart’s Export Setup first.'; ierr.hidden = false; return; }\n    let data;\n    try{ data = parseChartExport(text); }\n    catch(e){\n      ierr.textContent = 'That doesn’t look like a seating chart export. In the chart, click Export Setup, then Copy to Clipboard, and paste all of it here.';\n      ierr.hidden = false; return;\n    }\n    store.set('hp306-classes', data.classes);\n    store.set('hp306-class-order', data.order);\n    const sameClass = data.order.includes(G.classKey);\n    const key = sameClass ? G.classKey : data.order[0];\n    stopFuse();\n    G = freshGame(key, sameClass ? G.round : 1);\n    idlg.close(); render(); save();\n    toast('Imported ' + data.order.length + (data.order.length === 1 ? ' class' : ' classes') + '. ' + G.seats.filter(Boolean).length + ' students seated in ' + key + '.');\n  });\n\n  // ---- live check-in (Firebase) ----\n  // The student check-in page. A full web address, so it works inside the Room 306 Games dashboard too.\n  const JOIN_PAGE = 'https://ths-cs.github.io/checkin/';\n  const FIREBASE_CONFIG = {\n    apiKey: 'AIzaSyCiD9r0XCHggdxqvhXHgxUSrJiIWTMLc00',\n    authDomain: 'room306games.firebaseapp.com',\n    databaseURL: 'https://room306games-default-rtdb.firebaseio.com',\n    projectId: 'room306games',\n    storageBucket: 'room306games.firebasestorage.app',\n    messagingSenderId: '511693713114',\n    appId: '1:511693713114:web:1f5c08bafd43d038fd3fe3'\n  };\n  const FB_BASE = 'https://www.gstatic.com/firebasejs/10.12.2/';\n  const CODE_LETTERS = 'ABCDEFGHJKLMNPQRSTUVWXYZ';\n  const live = { fb:null, uid:null, code:null, open:true, players:{}, unsub:null, last:'', qrFor:'' };\n  const joinUrl = () => new URL(JOIN_PAGE, location.href).href;\n  const ciDlg = $('#checkinDialog');\n  const R = path => live.fb.ref(live.fb.db, path);\n  function forgetHost(){ try{ localStorage.removeItem('306host'); }catch(e){} }\n\n  async function fbLoad(){\n    if(live.fb) return live.fb;\n    if(location.protocol === 'file:') throw { message:'file' };\n    const [appM, authM, dbM] = await Promise.all([\n      import(FB_BASE + 'firebase-app.js'), import(FB_BASE + 'firebase-auth.js'), import(FB_BASE + 'firebase-database.js')\n    ]);\n    const app = appM.getApps().length ? appM.getApp() : appM.initializeApp(FIREBASE_CONFIG);\n    const auth = authM.getAuth(app);\n    live.uid = await new Promise((resolve, reject) => {\n      const stop = authM.onAuthStateChanged(auth, u => { if(u){ stop(); resolve(u.uid); } });\n      authM.signInAnonymously(auth).catch(e => { stop(); reject(e); });\n    });\n    live.fb = { db: dbM.getDatabase(app), ref: dbM.ref, get: dbM.get, set: dbM.set, update: dbM.update,\n      remove: dbM.remove, onValue: dbM.onValue, serverTimestamp: dbM.serverTimestamp };\n    return live.fb;\n  }\n  function fbExplain(err){\n    const c = (err && err.code) || '', m = String((err && err.message) || '');\n    if(m === 'file') return 'Check-in only works when this page is opened from your website, not as a file on your computer.';\n    if(c.includes('operation-not-allowed') || c.includes('admin-restricted')) return 'Anonymous sign-in is turned off. In Firebase, enable it under Authentication, Sign-in method.';\n    if(c.includes('unauthorized-domain')) return 'Add ' + location.hostname + ' in Firebase under Authentication, Settings, Authorized domains.';\n    if(c.includes('network') || m.includes('Failed to fetch') || m.includes('dynamically imported')) return 'Can’t reach Firebase. Check the internet connection and try again.';\n    if(m.toLowerCase().includes('permission')) return 'Firebase refused the request. Check that the database rules were published.';\n    return 'Check-in hit a problem: ' + (c || m || 'unknown error');\n  }\n  function ciErr(msg){ const e = $('#ciErr'); e.textContent = msg || ''; e.hidden = !msg; }\n\n  async function liveStart(){\n    await fbLoad();\n    const saved = store.get('306host');\n    if(saved){\n      const snap = await live.fb.get(R('games/' + saved));\n      if(snap.exists() && snap.val().hostUid === live.uid){ liveWatch(saved); return; }\n    }\n    let code;\n    for(let i = 0; i \u003c 10; i++){\n      code = Array.from(crypto.getRandomValues(new Uint32Array(4)), n => CODE_LETTERS[n % CODE_LETTERS.length]).join('');\n      if(!(await live.fb.get(R('games/' + code))).exists()) break;\n    }\n    await live.fb.set(R('games/' + code), { hostUid: live.uid, open: true, createdAt: live.fb.serverTimestamp() });\n    store.set('306host', code);\n    liveWatch(code);\n  }\n  // After a reload, pick the session back up so students' screens keep updating.\n  async function liveResume(){\n    const saved = store.get('306host');\n    if(!saved) return;\n    try{\n      await fbLoad();\n      const snap = await live.fb.get(R('games/' + saved));\n      if(snap.exists() && snap.val().hostUid === live.uid) liveWatch(saved); else forgetHost();\n    }catch(e){ /* stays offline; the Check-in button can retry */ }\n  }\n  function liveWatch(code){\n    if(live.unsub) live.unsub();\n    live.code = code; live.last = '';\n    live.unsub = live.fb.onValue(R('games/' + code), snap => {\n      const g = snap.val();\n      if(!g){ liveStopped(); return; }\n      live.open = g.open === true;\n      live.players = g.players || {};\n      renderCheckin(); livePublish();\n    }, err => ciErr(fbExplain(err)));\n  }\n  function liveStopped(){\n    if(live.unsub){ live.unsub(); live.unsub = null; }\n    live.code = null; live.players = {}; live.last = '';\n    forgetHost(); renderCheckin();\n  }\n\n  // What each student's screen shows. Answers are never sent.\n  function livePublish(){\n    if(!live.code || !live.fb) return;\n    const links = G.links || {}, pl = places(G), alive = aliveIdx(G);\n    const winner = G.phase === 'ended' && alive.length === 1 ? alive[0] : -1;\n    const players = {};\n    G.seats.forEach((name, i) => {\n      const uid = name && links[name];\n      if(!uid || !live.players[uid]) return;\n      players[uid] = i === winner ? { s:'won' } : isOut(G,i) ? { s:'out', place: pl.map[i] || 0 } : { s:'in' };\n    });\n    const holder = G.phase === 'question' && G.holder >= 0 ? (links[G.seats[G.holder]] || null) : null;\n    const state = { round:G.round, phase:G.phase, alive:alive.length, seated:seatedIdx(G).length, players,\n      holder, question: holder && Q ? Q.q : null };\n    const json = JSON.stringify(state);\n    if(json === live.last) return;\n    live.last = json;\n    live.fb.set(R('games/' + live.code + '/game'), state).catch(() => { live.last = ''; });\n  }\n\n  // Match check-in names to this class’s seating chart. Matched students keep their desks;\n  // anyone not on the chart gets an empty desk. Absent students’ desks stay empty.\n  function nameParts(s){ return String(s).toLowerCase().replace(/[^a-z\\s'-]/g, ' ').trim().split(/\\s+/).filter(Boolean); }\n  function planSeats(){\n    const c = classData(G.classKey), n = G.layout.length;\n    const base = normSeats(c.seats, n);\n    const known = [...new Set([...(c.roster || []), ...base.filter(Boolean)])];\n    const list = Object.entries(live.players).sort((a,b) => (a[1].joinedAt || 0) - (b[1].joinedAt || 0));\n    const used = new Set(), seats = Array(n).fill(null), links = {}, rows = [], waiting = [];\n    list.forEach(([uid, p]) => {\n      const typed = String(p.name || '').trim() || 'Student', t = nameParts(typed);\n      let match = known.find(k => !used.has(k) && nameParts(k).join(' ') === t.join(' '));\n      if(!match && t.length){\n        let cands = known.filter(k => !used.has(k) && nameParts(k)[0] === t[0]);\n        if(t.length > 1){\n          const ini = t[t.length-1][0];\n          cands = cands.filter(k => { const kp = nameParts(k); return kp.length > 1 && kp[kp.length-1][0] === ini; });\n        }\n        if(cands.length === 1) match = cands[0];\n      }\n      let name = match || typed;\n      if(!match){ let k = 2; const b = name; while(used.has(name) || known.includes(name)) name = b + ' ' + k++; }\n      used.add(name); links[name] = uid;\n      const row = { uid, name, matched: !!match, desk: match ? base.indexOf(match) : -1 };\n      if(row.desk >= 0 && !seats[row.desk]) seats[row.desk] = name; else { row.desk = -1; waiting.push(row); }\n      rows.push(row);\n    });\n    const free = fillOrder(n).filter(i => !seats[i]);\n    waiting.forEach(r => { const i = free.shift(); if(i !== undefined){ r.desk = i; seats[i] = r.name; } });\n    return { seats, links, rows };\n  }\n  function seatCheckedIn(){\n    if(isBusy(G)){ ciErr('End the round first, then seat checked-in students.'); return; }\n    const plan = planSeats();\n    if(!plan.rows.length) return;\n    stopFuse();\n    G.seats = plan.seats; G.links = plan.links; G.out = {}; G.seq = 0; G.phase = 'lobby'; G.holder = -1; Q = null;\n    const seated = plan.seats.filter(Boolean).length, left = plan.rows.length - seated;\n    ciDlg.close(); render(); save();\n    toast('Seated ' + seated + ' checked-in student' + (seated === 1 ? '' : 's') + ' in ' + G.classKey + '.' +\n      (left ? ' ' + left + ' had no free desk.' : ''));\n  }\n\n  function renderCheckin(){\n    const checkinSeats = Object.keys(G.links || {}).length > 0;\n    $$('[data-act=\"resetseats\"]').forEach(b => {\n      b.hidden = !checkinSeats; b.disabled = isBusy(G); b.title = isBusy(G) ? 'End the round first' : 'Put the ' + G.classKey + ' seating chart back';\n    });\n    $$('[data-act=\"endgame\"]').forEach(b => b.hidden = !(live.code || checkinSeats || G.phase !== 'lobby'));\n    const btn = $('#checkinBtn'), n = Object.keys(live.players).length;\n    btn.textContent = live.code ? '📲 ' + n + ' checked in' : '📲 Check-in';\n    btn.classList.toggle('on', !!live.code);\n    if(!ciDlg.open) return;\n    const on = !!live.code;\n    $('#ciStart').hidden = on; $('#ciLive').hidden = !on; $('#ciEnd').hidden = !on;\n    const go = $('#ciGo');\n    if(!on){ go.textContent = 'Start check-in'; go.disabled = false; go.title = ''; return; }\n\n    $('#ciUrl').textContent = joinUrl().replace(/^https?:\\/\\//, '').replace(/\\/$/, '');\n    const codeEl = $('#ciCode');\n    if(codeEl.dataset.code !== live.code){\n      codeEl.dataset.code = live.code; codeEl.replaceChildren();\n      codeEl.setAttribute('aria-label', 'Code ' + live.code.split('').join(' '));\n      for(const ch of live.code){ const s = document.createElement('span'); s.textContent = ch; codeEl.appendChild(s); }\n    }\n    const qr = $('#ciQr');\n    if(live.qrFor !== live.code){\n      live.qrFor = live.code; qr.replaceChildren();\n      if(window.QRCode) new QRCode(qr, { text: joinUrl() + '?code=' + live.code, width: 300, height: 300, correctLevel: QRCode.CorrectLevel.M });\n      else qr.hidden = true;\n    }\n    $('#ciOpen').classList.toggle('paused', !live.open);\n    $('#ciOpenText').textContent = live.open ? 'Joining open' : 'Joining paused';\n    $('#ciPause').textContent = live.open ? 'Pause joining' : 'Reopen joining';\n    $('#ciCount').textContent = n + ' checked in';\n\n    const plan = planSeats(), ul = $('#ciList');\n    ul.replaceChildren();\n    plan.rows.forEach(r => {\n      const li = document.createElement('li');\n      const nm = document.createElement('span'); nm.className = 'n'; nm.textContent = r.name; nm.title = r.name;\n      const d = document.createElement('span');\n      d.className = 'd' + (r.desk \u003c 0 ? ' none' : r.matched ? '' : ' new');\n      d.textContent = r.desk \u003c 0 ? 'No desk' : 'Desk ' + pad2(r.desk + 1) + (r.matched ? '' : ' (new)');\n      if(!r.matched && r.desk >= 0) d.title = 'Not on the ' + G.classKey + ' chart, so they get an empty desk';\n      const x = document.createElement('button');\n      x.className = 'x'; x.type = 'button'; x.textContent = '×'; x.setAttribute('aria-label', 'Remove ' + r.name);\n      x.addEventListener('click', () => live.fb.remove(R('games/' + live.code + '/players/' + r.uid)).catch(e => ciErr(fbExplain(e))));\n      li.append(nm, d, x); ul.appendChild(li);\n    });\n    $('#ciEmpty').hidden = plan.rows.length > 0;\n    const busy = isBusy(G);\n    go.textContent = n ? 'Seat ' + n + ' student' + (n === 1 ? '' : 's') : 'Seat students';\n    go.disabled = !n || busy;\n    go.title = busy ? 'End the round first' : n ? '' : 'Waiting for students to check in';\n  }\n\n  $('#checkinBtn').addEventListener('click', () => { ciErr(''); ciDlg.showModal(); renderCheckin(); });\n  $('#ciClose').addEventListener('click', () => ciDlg.close());\n  $('#ciGo').addEventListener('click', async () => {\n    ciErr('');\n    if(live.code){ seatCheckedIn(); return; }\n    const go = $('#ciGo'); go.disabled = true; go.textContent = 'Starting…';\n    try{ await liveStart(); }\n    catch(e){ ciErr(fbExplain(e)); }\n    finally{ renderCheckin(); }\n  });\n  $('#ciPause').addEventListener('click', () => {\n    if(live.code) live.fb.update(R('games/' + live.code), { open: !live.open }).catch(e => ciErr(fbExplain(e)));\n  });\n  $('#ciEnd').addEventListener('click', async () => {\n    if(!confirm('End check-in? Students’ screens will stop updating. Seats stay as they are.')) return;\n    try{ await live.fb.remove(R('games/' + live.code)); }catch(e){ ciErr(fbExplain(e)); }\n  });\n  liveResume();\n\n  // Put this class's saved seating chart back (check-in seating is for one day only).\n  function resetSeats(){\n    if(isBusy(G)){ toast('End the round first, then reset seats.'); return; }\n    stopFuse(); Q = null;\n    G = freshGame(G.classKey, G.round);\n    render(); save();\n    toast('Seats are back to the ' + G.classKey + ' chart.');\n  }\n  // Finish for the day: stop the round, close check-in, and restore the regular chart.\n  async function endGame(){\n    const msg = live.code\n      ? 'End the game? This stops the round, ends check-in on students’ screens, and puts the regular seating chart back.'\n      : 'End the game? This stops the round and puts the regular seating chart back.';\n    if(!confirm(msg)) return;\n    stopFuse(); Q = null;\n    if(live.code && live.fb){\n      try{ await live.fb.remove(R('games/' + live.code)); }catch(e){ toast(fbExplain(e)); }\n    }\n    G = freshGame(G.classKey, 1);\n    render(); save();\n    toast('Game over. Seats are back to the ' + G.classKey + ' chart.');\n  }\n\n  // ---- render ----\n  function render(){\n    fillClassSelect(); buildMap();\n    sel.value = G.classKey;\n    const alive = aliveIdx(G), pl = places(G), seated = seatedIdx(G).length;\n    const winner = G.phase === 'ended' && alive.length === 1 ? alive[0] : -1;\n    const busy = isBusy(G);\n\n    map.classList.toggle('picking', G.phase === 'boom');\n    seatEls.forEach((el, i) => {\n      const name = G.seats[i], out = name && isOut(G,i);\n      el.className = 'seat' + (name ? ' occupied' : '') + (out ? ' out' : '') + (i === winner ? ' winner' : '') +\n        (G.phase === 'question' && i === G.holder ? ' holder' : '');\n      el.innerHTML = (name ? '\u003cspan class=\"np\">' + plateHTML(name) + '\u003c/span>' : MONITOR_SVG) +\n        '\u003cspan class=\"num\">' + pad2(i+1) + '\u003c/span>';\n      if(!name){ el.setAttribute('aria-label', 'Desk ' + (i+1) + ', open seat'); el.tabIndex = -1; el.removeAttribute('title'); return; }\n      el.tabIndex = 0; el.title = name;\n      if(out){ const p=document.createElement('span'); p.className='place'; p.textContent = ordinal(pl.map[i]); el.appendChild(p); }\n      el.setAttribute('aria-label', 'Desk ' + (i+1) + ', ' + name + (out ? ', out. Click to bring back.' : G.phase === 'boom' ? ', in. Click if they have the ball.' : ', in.'));\n    });\n    fitNames(map);\n\n    // status\n    $('#status').className = 'status ' + G.phase;\n    $('#statusText').textContent = 'Round ' + G.round + ', ' + {\n      lobby:'waiting to start', ready:'ready for the next fuse', burning:'fuse is lit', paused:'paused',\n      boom:'boom!', question:'question time', ended:'over'\n    }[G.phase];\n\n    // buttons (top bar and fullscreen bar)\n    const present = host.classList.contains('present');\n    const goLabel = { lobby:'Start game', ready:'🔥 Light fuse', burning:'Pause', paused:'Resume' }[G.phase];\n    $$('[data-act=\"go\"]').forEach(b => {\n      b.hidden = !goLabel; if(goLabel) b.textContent = goLabel;\n      b.classList.toggle('primary', G.phase !== 'burning');\n    });\n    $$('.rules-foot [data-act=\"go\"]').forEach(b => b.hidden = G.phase !== 'lobby');\n    $('#rulesClose').textContent = G.phase === 'lobby' ? 'Back to the room' : 'Back to the game';\n    $('#rules .hint').hidden = G.phase !== 'lobby';\n    $$('[data-act=\"boom\"]').forEach(b => b.hidden = !(G.phase === 'burning' || G.phase === 'paused'));\n    $$('[data-act=\"end\"]').forEach(b => b.hidden = !busy);\n    $$('[data-act=\"restart\"]').forEach(b => { b.hidden = G.phase === 'lobby'; b.classList.toggle('primary', G.phase === 'ended'); });\n    $$('[data-act=\"undo\"]').forEach(b => { b.hidden = G.phase === 'lobby'; b.disabled = !Object.keys(G.out).length; });\n    $('#seatsBtn').disabled = $('#importBtn').disabled = busy;\n    renderCheckin();\n    $('#seatsBtn').title = $('#importBtn').title = busy ? 'End the round first' : '';\n    $('#settingsBtn').disabled = G.phase === 'boom' || G.phase === 'question';\n    sel.disabled = busy;\n\n    // banner\n    const ban = $('#banner');\n    if(winner >= 0){ ban.hidden=false; ban.className='banner win'; ban.textContent = G.seats[winner] + ' wins round ' + G.round + '!'; }\n    else if(G.phase === 'ended'){ ban.hidden=false; ban.className='banner'; ban.textContent = 'Round over. ' + alive.length + ' made it to the end.'; }\n    else if(G.phase === 'boom'){ ban.hidden=false; ban.className='banner boom'; ban.textContent = '💥 BOOM! Click the desk of whoever has the ball.'; }\n    else if(G.phase === 'paused'){ ban.hidden=false; ban.className='banner'; ban.textContent = 'Paused. Hold the ball and freeze.'; }\n    else if(G.phase === 'burning' && alive.length === 2 && seated > 2){ ban.hidden=false; ban.className='banner final'; ban.textContent = 'Final two: pass it back and forth.'; }\n    else if(G.phase === 'ready' && present){ ban.hidden=false; ban.className='banner'; ban.textContent = 'Get ready. The fuse lights next.'; }\n    else if(G.phase === 'lobby' && present){ ban.hidden=false; ban.className='banner'; ban.textContent = 'Round ' + G.round + '. Get ready.'; }\n    else ban.hidden = true;\n\n    // side panel\n    $('#aliveCount').textContent = alive.length;\n    $('#aliveLabel').textContent = 'still in, of ' + seated;\n    $('#modeChip').innerHTML = 'When it booms: \u003cb>' + (S.mode === 'question' ? 'question, miss is out' : 'holder is out') + '\u003c/b>';\n    const list = $('#outList'); list.innerHTML = '';\n    pl.order.forEach(i => {\n      const li = document.createElement('li');\n      const p = document.createElement('span'); p.className='pl'; p.textContent = ordinal(pl.map[i]);\n      const n = document.createElement('span'); n.textContent = G.seats[i];\n      li.append(p, n); list.appendChild(li);\n    });\n    $('#outEmpty').hidden = pl.order.length > 0;\n    $('#outCount').textContent = '(' + pl.order.length + ')';\n\n    // fullscreen bar\n    $('#dClass').textContent = G.classKey;\n    $('#dRound').textContent = G.round;\n    $('#dAlive').textContent = alive.length;\n    $('#dOf').textContent = '/ ' + seated;\n    $('#dLast').textContent = pl.order.length ? shortName(G.seats[pl.order[0]]) + ' (' + ordinal(pl.map[pl.order[0]]) + ')' : '—';\n\n    // rules\n    $('#boomRules').innerHTML = BOOM_RULES[S.mode].map(r => '\u003cli>' + r + '\u003c/li>').join('');\n\n    renderCard();\n    drawFuse();\n    requestAnimationFrame(fit);\n  }\n\n  render();\n  if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitNames(map));\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "306_Silent_Ball.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>306 Silent Ball\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{\n  --panel:#F2F2F2; --border:#B5B5B5; --text:#161616; --muted:#5C5C5C;\n  --floor:#E9E9E9; --floor-dot:#C6C6C6;\n  --tile:#F7F7F7; --tile-edge:#C4C4C4; --t
