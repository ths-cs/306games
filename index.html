ield-bg); }\n#importText{ font-family:var(--mono); font-size:12px; white-space:pre; }\n#questionsText{ min-height:260px; }\ndialog .err{ color:var(--danger-text); font-size:13px; margin:10px 0 0; }\ndialog .field{ font-size:13px; font-weight:600; color:var(--text); margin:16px 0 8px; }\ndialog .field:first-of-type{ margin-top:12px; }\n.opt{\n  display:flex; gap:10px; align-items:flex-start; padding:10px 12px; margin-bottom:8px;\n  background:var(--field-bg); border:1px solid var(--border); border-radius:6px; cursor:pointer; font-size:14px;\n}\n.opt:has(input:checked){ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, var(--field-bg)); }\n.opt input{ margin-top:3px; accent-color:var(--accent); }\n.opt b{ display:block; font-weight:600; }\n.opt small{ display:block; color:var(--muted); font-size:12.5px; margin-top:2px; }\n.names{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }\n.names label{ display:flex; align-items:center; gap:8px; background:var(--field-bg); border:1px solid var(--border); border-radius:6px; padding:4px 4px 4px 8px; }\n.names label span{ width:24px; height:24px; border-radius:5px; display:grid; place-items:center; font-weight:700; font-size:14px; background:var(--cc); color:var(--con); flex-shrink:0; }\n.names input{ flex:1; min-width:0; border:0; background:transparent; color:var(--text); font:inherit; font-size:14px; padding:6px 4px; }\n.names input:focus{ outline:none; }\n.names label:focus-within{ border-color:var(--accent); }\n.actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap; }\n\n/* ---------- Rules screen (for the projector) ---------- */\n.rules{\n  position:fixed; inset:0; z-index:15; overflow-y:auto;\n  background-color:var(--floor);\n  background-image:radial-gradient(circle, var(--floor-dot) 1px, transparent 1.4px);\n  background-size:25px 25px;\n  padding:calc(28px + env(safe-area-inset-top,0px)) 4vw calc(28px + env(safe-area-inset-bottom,0px));\n  display:flex; flex-direction:column; gap:clamp(16px, 2.6vh, 30px);\n}\n.rules-head{ display:flex; align-items:center; gap:16px; }\n.rules-head .brand-mark{ width:clamp(40px, 4vw, 60px); height:clamp(40px, 4vw, 60px); border-width:3px; }\n.rules-head h2{ margin:0; font-size:clamp(34px, 4.6vw, 70px); font-weight:700; line-height:1; letter-spacing:-.01em; }\n.rules-head p{ margin:4px 0 0; font-size:clamp(15px, 1.4vw, 22px); color:var(--muted); }\n.rules-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:clamp(14px, 1.6vw, 26px); flex:1; }\n.rule-card{\n  background:var(--paper); color:var(--ink); border-radius:8px; border-left:10px solid var(--ink-soft);\n  padding:clamp(16px, 1.8vw, 30px) clamp(16px, 1.8vw, 30px) clamp(16px, 1.8vw, 30px) clamp(18px, 2vw, 34px);\n  box-shadow:0 4px 0 rgba(0,0,0,.55);\n}\n.rule-card.call{ border-left-color:var(--accent); }\n.rule-card.safe{ border-left-color:var(--live); }\n.rule-card h3{ margin:0 0 clamp(10px, 1.4vh, 18px); font-size:clamp(22px, 2.3vw, 38px); line-height:1.05; }\n.rule-card ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:clamp(8px, 1.3vh, 16px); }\n.rule-card li{ font-size:clamp(17px, 1.65vw, 28px); line-height:1.25; font-weight:500; padding-left:1.1em; position:relative; }\n.rule-card li::before{\n  content:''; position:absolute; left:0; top:.42em; width:.45em; height:.45em; border-radius:2px; background:var(--ink-soft);\n}\n.rule-card.call li::before{ background:var(--accent); border-radius:50%; }\n.rule-card.safe li::before{ background:var(--live); border-radius:50%; }\n.rule-card li b{ font-weight:700; }\n.room4{ display:grid; grid-template-columns:1fr 1fr; gap:clamp(8px, 1vw, 14px); }\n.room4 div{\n  min-width:0; overflow:hidden;\n  border-radius:8px; background:var(--cc); color:var(--con); padding:clamp(10px, 1.2vw, 18px);\n  display:flex; align-items:center; gap:clamp(8px, 1vw, 14px); min-height:clamp(70px, 9vh, 120px);\n}\n.room4 b{ font-size:clamp(36px, 4vw, 64px); line-height:.9; }\n.room4 span{ min-width:0; overflow-wrap:break-word; font-size:clamp(14px, 1.3vw, 22px); font-weight:600; line-height:1.15; }\n.rules-foot{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }\n.rules-foot .callout{ font-size:clamp(16px, 1.5vw, 24px); font-weight:600; margin-right:auto; }\n.rules-foot .btn{ font-size:clamp(14px, 1.2vw, 18px); padding:10px 18px; }\n.rules-foot .hint{ font-size:13px; color:var(--muted); }\n\n[data-c=\"0\"]{ --cc:var(--c1); --con:#FFFFFF; }\n[data-c=\"1\"]{ --cc:var(--c2); --con:#121212; }\n[data-c=\"2\"]{ --cc:var(--c3); --con:#FFFFFF; }\n[data-c=\"3\"]{ --cc:var(--c4); --con:#FFFFFF; }\n\n@media (max-width:820px){\n  .main{ grid-template-columns:1fr; grid-template-rows:60vh auto; }\n  .side{ border-left:none; border-top:1px solid var(--border); }\n  .keys{ display:none; }\n  .qgrid{ grid-template-columns:1fr; }\n}\n@media (prefers-reduced-motion: reduce){\n  *{ animation:none !important; transition:none !important; }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv id=\"host\">\n  \u003cheader class=\"bar\">\n    \u003cdiv class=\"brand\">\u003cspan class=\"brand-mark\" aria-hidden=\"true\">\u003c/span>\u003ch1>306 Four Corners\u003c/h1>\u003c/div>\n    \u003cselect id=\"classSelect\" aria-label=\"Class period\">\u003c/select>\n    \u003cspan class=\"status\" id=\"status\" aria-live=\"polite\">\u003ci>\u003c/i>\u003cspan id=\"statusText\">Waiting to start\u003c/span>\u003c/span>\n    \u003cdiv class=\"spacer\">\u003c/div>\n    \u003cbutton class=\"btn\" id=\"importBtn\">Import chart\u003c/button>\n    \u003cbutton class=\"btn\" id=\"seatsBtn\">Edit seats\u003c/button>\n    \u003cbutton class=\"btn\" id=\"questionsBtn\">Questions\u003c/button>\n    \u003cbutton class=\"btn\" id=\"settingsBtn\">Settings\u003c/button>\n    \u003cbutton class=\"btn\" data-act=\"rules\">Rules\u003c/button>\n    \u003cbutton class=\"btn\" id=\"soundBtn\" aria-pressed=\"true\">🔊 Sound on\u003c/button>\n    \u003cspan class=\"sep\" aria-hidden=\"true\">\u003c/span>\n    \u003cbutton class=\"btn\" data-act=\"undo\">Undo\u003c/button>\n    \u003cbutton class=\"btn primary\" data-act=\"go\">Start game\u003c/button>\n    \u003cbutton class=\"btn\" data-act=\"now\" hidden>⏱ Time’s up\u003c/button>\n    \u003cbutton class=\"btn\" data-act=\"end\">End game\u003c/button>\n    \u003cbutton class=\"btn\" data-act=\"restart\">New game\u003c/button>\n    \u003cbutton class=\"btn\" data-act=\"present\">📺 Fullscreen View\u003c/button>\n  \u003c/header>\n\n  \u003cdiv class=\"dash\" id=\"dash\">\n    \u003cdiv class=\"item\">\u003cspan class=\"lbl\">Class\u003c/span>\u003cspan id=\"dClass\">—\u003c/span>\u003c/div>\n    \u003cdiv class=\"item\">\u003cspan class=\"lbl\">Round\u003c/span>\u003cspan id=\"dRound\">—\u003c/span>\u003c/div>\n    \u003cdiv class=\"item\">\u003cspan class=\"lbl\">Still in\u003c/span>\u003cspan class=\"big\" id=\"dAlive\">0\u003c/span>\u003cspan id=\"dOf\">\u003c/span>\u003c/div>\n    \u003cdiv class=\"item\">\u003cspan class=\"lbl\">Last call\u003c/span>\u003cspan id=\"dLast\">—\u003c/span>\u003c/div>\n    \u003cdiv class=\"acts\">\n      \u003cbutton class=\"btn\" data-act=\"rules\">Rules\u003c/button>\n      \u003cbutton class=\"btn\" data-act=\"undo\">Undo\u003c/button>\n      \u003cbutton class=\"btn primary\" data-act=\"go\">Start game\u003c/button>\n      \u003cbutton class=\"btn\" data-act=\"now\" hidden>⏱ Time’s up\u003c/button>\n      \u003cbutton class=\"btn\" data-act=\"end\">End game\u003c/button>\n      \u003cbutton class=\"btn\" data-act=\"restart\">New game\u003c/button>\n      \u003cbutton class=\"btn primary\" data-act=\"present\">🛠️ Edit Mode\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"main\">\n    \u003cdiv class=\"stage\" id=\"stage\">\n      \u003cdiv class=\"map\" id=\"map\">\u003c/div>\n      \u003cdiv class=\"banner\" id=\"banner\" hidden>\u003c/div>\n      \u003cdiv class=\"qcard\" id=\"qcard\" role=\"dialog\" aria-live=\"polite\" hidden>\n        \u003cdiv class=\"qhead\">\u003cp class=\"qk\" id=\"qKicker\">\u003c/p>\u003cspan class=\"qtime\" id=\"qTime\">\u003c/span>\u003c/div>\n        \u003cp class=\"qt\" id=\"qText\">\u003c/p>\n        \u003cdiv class=\"qgrid\" id=\"qGrid\">\u003c/div>\n        \u003cdiv class=\"qbtns\" id=\"qBtns\" hidden>\n          \u003cbutton class=\"btn primary\" id=\"qMark\">Mark who’s out \u003ckbd>Space\u003c/kbd>\u003c/button>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003caside class=\"side\">\n      \u003cdiv class=\"count\">\u003cb id=\"aliveCount\">0\u003c/b>\u003cspan id=\"aliveLabel\">still in\u003c/span>\u003c/div>\n      \u003cdiv class=\"modechip\" id=\"modeChip\">\u003c/div>\n      \u003cdiv>\n        \u003ch2>Calls \u003csmall id=\"outCount\">\u003c/small>\u003c/h2>\n        \u003col class=\"calllog\" id=\"callLog\">\u003c/ol>\n        \u003cp class=\"empty-note\" id=\"outEmpty\">Nobody’s out yet. When a corner is called, click the desk of everyone who picked it.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"keys\">\n        \u003ch2>Shortcuts\u003c/h2>\n        \u003cdl>\n          \u003cdt>\u003ckbd>Space\u003c/kbd>\u003c/dt>\u003cdd>Start, pause, next round\u003c/dd>\n          \u003cdt>\u003ckbd>T\u003c/kbd>\u003c/dt>\u003cdd>Time’s up now\u003c/dd>\n          \u003cdt>\u003ckbd>1\u003c/kbd>–\u003ckbd>4\u003c/kbd>\u003c/dt>\u003cdd>Call that corner yourself\u003c/dd>\n          \u003cdt>\u003ckbd>Q\u003c/kbd>\u003c/dt>\u003cdd>Show the question again\u003c/dd>\n          \u003cdt>\u003ckbd>Z\u003c/kbd>\u003c/dt>\u003cdd>Undo the last out\u003c/dd>\n          \u003cdt>\u003ckbd>F\u003c/kbd>\u003c/dt>\u003cdd>Fullscreen view\u003c/dd>\n          \u003cdt>\u003ckbd>M\u003c/kbd>\u003c/dt>\u003cdd>Sound on or off\u003c/dd>\n          \u003cdt>\u003ckbd>R\u003c/kbd>\u003c/dt>\u003cdd>Rules screen\u003c/dd>\n        \u003c/dl>\n      \u003c/div>\n    \u003c/aside>\n  \u003c/div>\n\u003c/div>\n\n\u003cdialog id=\"seatsDialog\">\n  \u003ch3>Edit seats\u003c/h3>\n  \u003cp>One student per line. Students already on the chart keep their desks.\u003c/p>\n  \u003ctextarea id=\"rosterText\" spellcheck=\"false\">\u003c/textarea>\n  \u003cdiv class=\"actions\">\n    \u003cbutton class=\"btn\" id=\"seatsCancel\">Cancel\u003c/button>\n    \u003cbutton class=\"btn\" id=\"seatsShuffle\">Shuffle everyone\u003c/button>\n    \u003cbutton class=\"btn primary\" id=\"seatsFill\">Save seats\u003c/button>\n  \u003c/div>\n\u003c/dialog>\n\n\u003cdialog id=\"importDialog\">\n  \u003ch3>Import from seating chart\u003c/h3>\n  \u003col>\n    \u003cli>In the 306 Seating Chart, click Export Setup.\u003c/li>\n    \u003cli>Click Copy to Clipboard, then paste it below.\u003c/li>\n  \u003c/ol>\n  \u003cp>This replaces the game’s classes, desks and seats with the chart’s. Students on the Dropped list are left out.\u003c/p>\n  \u003ctextarea id=\"importText\" spellcheck=\"false\" placeholder=\"const CLASS_DATA = {&#10;  &quot;p1: GA2&quot;: {&#10;    roster: [ … ],&#10;    desks: [ … ]&#10;  },&#10;  …&#10;};\">\u003c/textarea>\n  \u003cp class=\"err\" id=\"importErr\" role=\"alert\" hidden>\u003c/p>\n  \u003cdiv class=\"actions\">\n    \u003cbutton class=\"btn\" id=\"importCancel\">Cancel\u003c/button>\n    \u003cbutton class=\"btn primary\" id=\"importConfirm\">Import\u003c/button>\n  \u003c/div>\n\u003c/dialog>\n\n\u003cdialog id=\"settingsDialog\">\n  \u003ch3>Game settings\u003c/h3>\n  \u003cp class=\"field\">Where students play\u003c/p>\n  \u003clabel class=\"opt\">\u003cinput type=\"radio\" name=\"play\" value=\"seated\">\u003cspan>\u003cb>Stay seated\u003c/b>\u003csmall>Students pick a number from 1 to 4 and show it with their fingers at the bell.\u003c/small>\u003c/span>\u003c/label>\n  \u003clabel class=\"opt\">\u003cinput type=\"radio\" name=\"play\" value=\"walk\">\u003cspan>\u003cb>Walk to corners\u003c/b>\u003csmall>Students get up and go to a corner of the room.\u003c/small>\u003c/span>\u003c/label>\n  \u003cp class=\"field\">How corners get called\u003c/p>\n  \u003clabel class=\"opt\">\u003cinput type=\"radio\" name=\"mode\" value=\"classic\">\u003cspan>\u003cb>Classic\u003c/b>\u003csmall>A corner is picked at random. Everyone who picked it is out.\u003c/small>\u003c/span>\u003c/label>\n  \u003clabel class=\"opt\">\u003cinput type=\"radio\" name=\"mode\" value=\"quiz\">\u003cspan>\u003cb>Quiz corners\u003c/b>\u003csmall>A question goes up with an answer for each corner. A wrong pick is out.\u003c/small>\u003c/span>\u003c/label>\n  \u003cp class=\"field\">Time to get to a corner\u003c/p>\n  \u003cselect id=\"secsSel\" aria-label=\"Countdown length\">\n    \u003coption value=\"5\">5 seconds\u003c/option>\n    \u003coption value=\"10\">10 seconds\u003c/option>\n    \u003coption value=\"15\">15 seconds\u003c/option>\n    \u003coption value=\"20\">20 seconds\u003c/option>\n    \u003coption value=\"30\">30 seconds\u003c/option>\n  \u003c/select>\n  \u003cp class=\"field\">Corner names\u003c/p>\n  \u003cp>Only used when students walk to corners. Match them to your room, like Door or Windows. Leave blank to use numbers only.\u003c/p>\n  \u003cdiv class=\"names\">\n    \u003clabel data-c=\"0\">\u003cspan>1\u003c/span>\u003cinput type=\"text\" id=\"name0\" maxlength=\"24\" placeholder=\"Top left\" aria-label=\"Corner 1 name\">\u003c/label>\n    \u003clabel data-c=\"1\">\u003cspan>2\u003c/span>\u003cinput type=\"text\" id=\"name1\" maxlength=\"24\" placeholder=\"Top right\" aria-label=\"Corner 2 name\">\u003c/label>\n    \u003clabel data-c=\"2\">\u003cspan>3\u003c/span>\u003cinput type=\"text\" id=\"name2\" maxlength=\"24\" placeholder=\"Bottom left\" aria-label=\"Corner 3 name\">\u003c/label>\n    \u003clabel data-c=\"3\">\u003cspan>4\u003c/span>\u003cinput type=\"text\" id=\"name3\" maxlength=\"24\" placeholder=\"Bottom right\" aria-label=\"Corner 4 name\">\u003c/label>\n  \u003c/div>\n  \u003cp class=\"field\">Sound check\u003c/p>\n  \u003cp>Plays the countdown, the bell and a corner call so you can set your speaker volume. Works even when sound is off.\u003c/p>\n  \u003cbutton class=\"btn\" id=\"testSound\" type=\"button\">🔊 Play test sounds\u003c/button>\n  \u003cdiv class=\"actions\">\n    \u003cbutton class=\"btn\" id=\"settingsCancel\">Cancel\u003c/button>\n    \u003cbutton class=\"btn primary\" id=\"settingsSave\">Save settings\u003c/button>\n  \u003c/div>\n\u003c/dialog>\n\n\u003cdialog id=\"questionsDialog\">\n  \u003ch3 id=\"questionsTitle\">Quiz questions\u003c/h3>\n  \u003cp>One question per line. Put the right answer first, then up to three wrong ones, each after a | bar. The answers get shuffled into the corners. Two answers works for true or false. Each class has its own list.\u003c/p>\n  \u003ctextarea id=\"questionsText\" spellcheck=\"false\" placeholder=\"What does RGB stand for? | Red, green, blue | Red, gray, black | Run, go, back | Rows, grids, boxes&#10;The shortcut to undo is Ctrl/Cmd + Z. | True | False&#10;Which file type keeps a transparent background? | PNG | JPG | DOCX | MP3\">\u003c/textarea>\n  \u003cdiv class=\"actions\">\n    \u003cbutton class=\"btn\" id=\"questionsCancel\">Cancel\u003c/button>\n    \u003cbutton class=\"btn primary\" id=\"questionsSave\">Save questions\u003c/button>\n  \u003c/div>\n\u003c/dialog>\n\n\u003cdialog id=\"confirmDialog\">\n  \u003ch3>Start a new game?\u003c/h3>\n  \u003cp>Everyone comes back in and the calls clear. This can’t be undone.\u003c/p>\n  \u003cdiv class=\"actions\">\n    \u003cbutton class=\"btn\" id=\"confirmCancel\">Cancel\u003c/button>\n    \u003cbutton class=\"btn danger\" id=\"confirmOk\">New game\u003c/button>\n  \u003c/div>\n\u003c/dialog>\n\n\u003csection class=\"rules\" id=\"rules\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"rulesTitle\" hidden>\n  \u003cheader class=\"rules-head\">\n    \u003cspan class=\"brand-mark\" aria-hidden=\"true\">\u003c/span>\n    \u003cdiv>\n      \u003ch2 id=\"rulesTitle\">Four Corners\u003c/h2>\n      \u003cp>Room 306 rules\u003c/p>\n    \u003c/div>\n  \u003c/header>\n  \u003cdiv class=\"rules-grid\">\n    \u003carticle class=\"rule-card\">\n      \u003ch3>How to play\u003c/h3>\n      \u003cul id=\"playRules\">\u003c/ul>\n    \u003c/article>\n    \u003carticle class=\"rule-card call\">\n      \u003ch3 id=\"callTitle\">When a corner is called\u003c/h3>\n      \u003cul id=\"callRules\">\u003c/ul>\n    \u003c/article>\n    \u003carticle class=\"rule-card\">\n      \u003ch3 id=\"cornersTitle\">The corners\u003c/h3>\n      \u003cdiv class=\"room4\" id=\"room4\">\u003c/div>\n    \u003c/article>\n    \u003carticle class=\"rule-card safe\">\n      \u003ch3 id=\"safeTitle\">Safe moving\u003c/h3>\n      \u003cul id=\"safeRules\">\u003c/ul>\n    \u003c/article>\n  \u003c/div>\n  \u003cfooter class=\"rules-foot\">\n    \u003cspan class=\"callout\">The teacher’s call is final.\u003c/span>\n    \u003cspan class=\"hint\">Space starts the game\u003c/span>\n    \u003cbutton class=\"btn\" id=\"rulesClose\">Back to the room\u003c/button>\n    \u003cbutton class=\"btn primary\" data-act=\"go\">Start game\u003c/button>\n  \u003c/footer>\n\u003c/section>\n\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\">\u003c/div>\n\n\u003cscript>\n(function(){\n  const $ = s => document.querySelector(s);\n  const $$ = s => [...document.querySelectorAll(s)];\n  const DESK_W = 130, DESK_H = 84;\n  const TEACHER_DESK = { x: 133, y: 257, w: 130, h: 229 };\n  // The caller: open floor above the Teacher Desk, between corner 1 and the middle desks.\n  const CALLER_BOX = { x: 262, y: 52, w: 420, h: 180 };\n  const CORNER_W = 220, CORNER_H = 130;\n  // Corner order around the room, clockwise: 1 top left, 2 top right, 4 bottom right, 3 bottom left.\n  const CLOCKWISE = [0, 1, 3, 2];\n  const MONITOR_SVG = '\u003csvg viewBox=\"0 0 24 24\" width=\"26\" height=\"26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"4\" width=\"18\" height=\"12\" rx=\"1.5\"/>\u003cpath d=\"M9 20h6M12 16v4\"/>\u003c/svg>';\n  function gridSVG(cls){\n    return '\u003csvg class=\"' + cls + '\" viewBox=\"0 0 128 128\" aria-hidden=\"true\">' +\n      [[0,4,4],[1,68,4],[2,4,68],[3,68,68]].map(([c,x,y]) =>\n        '\u003crect class=\"q' + c + '\" x=\"' + x + '\" y=\"' + y + '\" width=\"56\" height=\"56\" rx=\"10\" fill=\"var(--c' + (c+1) + ')\"/>').join('') +\n      '\u003c/svg>';\n  }\n  $$('.brand-mark').forEach(el => el.innerHTML = gridSVG(''));\n\n  // Room 306 desk layout (from the seating chart), desk 01 first.\n  const LAYOUT = [\n    [1313,690],[1171,690],[1030,690],[888,690],[746,690],[605,690],[462,690],[318,690],[171,690],[27,688],\n    [1160,257],[1304,257],[1159,402],[1304,402],[1160,521],\n    [920,150],[920,243],[920,335],[920,429],[920,522],\n    [700,149],[700,248],[700,340],[700,432],[700,524],\n    [318,257],[461,257],[316,402],[460,402],[133,521]\n  ];\n  const N = LAYOUT.length;\n  function seatsFrom(map){ const s = Array(N).fill(null); Object.keys(map).forEach(i => s[i] = map[i]); return s; }\n  const DEFAULT_CLASSES = {\n    \"p1: GA2\": { roster: [], seats: Array(N).fill(null) },\n    \"p2: GA1\": { roster: [], seats: Array(N).fill(null) },\n    \"p3: HSB27\": { roster: [], seats: Array(N).fill(null) },\n    \"p4: FrS\": { roster: [], seats: Array(N).fill(null) },\n    \"p5: DA1\": { roster: [], seats: Array(N).fill(null) }\n  };\n\n  // ---------- helpers ----------\n  const store = {\n    get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },\n    set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }\n  };\n  const pad2 = n => String(n).padStart(2,'0');\n  const firstName = n => String(n || 'Student').trim().split(/\\s+/)[0];\n  function shortName(n){ const p = n.trim().split(/\\s+/); return p.length > 1 ? p[0] + ' ' + p[p.length-1][0] + '.' : p[0]; }\n  function plateHTML(n){\n    const p = n.trim().split(/\\s+/), d = document.createElement('div');\n    const f = document.createElement('span'); f.className='np-first'; f.textContent = p[0]; d.appendChild(f);\n    if(p.length > 1){ const l = document.createElement('span'); l.className='np-last'; l.textContent = p.slice(1).join(' '); d.appendChild(l); }\n    return d.innerHTML;\n  }\n  function esc(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }\n  function fitNames(root){\n    root.querySelectorAll('.np-first').forEach(el => {\n      el.style.fontSize = '';\n      let size = parseFloat(getComputedStyle(el).fontSize);\n      while(el.scrollWidth > el.clientWidth && size > 12){ size = Math.max(12, size - 0.5); el.style.fontSize = size + 'px'; }\n    });\n  }\n  // Seating chart's shuffle order: highest desk first, desks 30, 10 and 1 fill last.\n  const SHUFFLE_LAST = [30, 10, 1];\n  function fillOrder(n){\n    const last = SHUFFLE_LAST.filter(k => k \u003c= n);\n    return [...Array(n).keys()].map(i=>i+1).filter(k => !last.includes(k)).reverse()\n      .concat(last.slice().reverse()).map(k => k-1);\n  }\n  function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }\n  let toastTimer;\n  function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), 2800); }\n\n  // Where the four corner tiles sit, around the desks.\n  function cornerBoxes(L){\n    const left = Math.min(...L.map(p=>p[0]));\n    const right = Math.max(...L.map(p=>p[0] + DESK_W));\n    const bottom = Math.max(...L.map(p=>p[1] + DESK_H)) + 26;\n    const top = CALLER_BOX.y + CALLER_BOX.h - CORNER_H;\n    return [\n      { x:left, y:top }, { x:right - CORNER_W, y:top },\n      { x:left, y:bottom }, { x:right - CORNER_W, y:bottom }\n    ];\n  }\n  function boundsOf(L){\n    const C = cornerBoxes(L);\n    const xs = [TEACHER_DESK.x, CALLER_BOX.x, ...L.map(p=>p[0]), ...C.map(c=>c.x)];\n    const ys = [TEACHER_DESK.y, CALLER_BOX.y, ...L.map(p=>p[1]), ...C.map(c=>c.y)];\n    const minX = Math.min(...xs), minY = Math.min(...ys);\n    return {\n      minX, minY,\n      w: Math.max(TEACHER_DESK.x + TEACHER_DESK.w, CALLER_BOX.x + CALLER_BOX.w, ...L.map(p=>p[0] + DESK_W), ...C.map(c=>c.x + CORNER_W)) - minX,\n      h: Math.max(TEACHER_DESK.y + TEACHER_DESK.h, ...L.map(p=>p[1] + DESK_H + 3), ...C.map(c=>c.y + CORNER_H + 3)) - minY\n    };\n  }\n  function validLayout(L){\n    return Array.isArray(L) && L.length > 0 && L.length \u003c= 120 &&\n      L.every(p => Array.isArray(p) && p.length === 2 && p.every(v => typeof v === 'number' && isFinite(v)));\n  }\n\n  // ---------- settings & questions ----------\n  const SECS = [5,10,15,20,30];\n  let S = Object.assign({ play:'seated', mode:'classic', secs:10, names:['','','',''] }, store.get('fc306-settings') || {});\n  if(!['seated','walk'].includes(S.play)) S.play = 'seated';\n  if(!['classic','quiz'].includes(S.mode)) S.mode = 'classic';\n  const seated = () => S.play === 'seated';\n  if(!SECS.includes(Number(S.secs))) S.secs = 10;\n  S.secs = Number(S.secs);\n  S.names = [0,1,2,3].map(i => (Array.isArray(S.names) && typeof S.names[i] === 'string') ? S.names[i].trim().slice(0,24) : '');\n\n  const cornerTitle = c => 'Corner ' + (c+1);\n  const cornerFull = c => cornerTitle(c) + (S.names[c] && S.play !== 'seated' ? ' (' + S.names[c] + ')' : '');\n\n  // Each class keeps its own question list. A class without one starts from the old shared list.\n  function classQuestions(key){\n    const all = store.get('fc306-qbank') || {};\n    return typeof all[key] === 'string' ? all[key] : String(store.get('fc306-questions') || '');\n  }\n  function saveClassQuestions(key, text){\n    const all = store.get('fc306-qbank') || {}; all[key] = text; store.set('fc306-qbank', all);\n  }\n  function questionBank(){\n    return String(classQuestions(G.classKey)).split('\\n').map(l => l.trim()).filter(Boolean).map(l => {\n      const parts = l.split('|').map(s => s.trim());\n      const q = parts.shift(), answers = parts.filter(Boolean).slice(0,4);\n      return { q, answers };\n    }).filter(x => x.q && x.answers.length >= 2);\n  }\n  let deck = [], deckFor = '';\n  function drawQuestion(){\n    const bank = questionBank();\n    if(!bank.length) return null;\n    if(!deck.length || deckFor !== G.classKey){ deck = shuffle(bank); deckFor = G.classKey; }\n    const item = deck.pop();\n    // Shuffle the answers into corners. The first answer is the right one.\n    const slots = shuffle([0,1,2,3]).slice(0, item.answers.length);\n    const a = [null,null,null,null];\n    slots.forEach((c, k) => a[c] = item.answers[k]);\n    return { q:item.q, a, right:slots[0] };\n  }\n\n  // ---------- classes ----------\n  function classKeys(){\n    const order = store.get('fc306-class-order');\n    if(Array.isArray(order) && order.length) return [...order];\n    return [...new Set([...Object.keys(DEFAULT_CLASSES), ...Object.keys(store.get('fc306-classes')||{})])];\n  }\n  function classData(key){\n    const o = (store.get('fc306-classes')||{})[key];\n    return o || DEFAULT_CLASSES[key] || { roster:[], seats:[], layout:LAYOUT };\n  }\n  function saveClassData(key, data){ const all = store.get('fc306-classes')||{}; all[key]=data; store.set('fc306-classes', all); }\n  function normSeats(s, n){ const a=Array(n).fill(null); (s||[]).forEach((x,i)=>{ if(i\u003cn && typeof x==='string' && x.trim()) a[i]=x; }); return a; }\n  function freshGame(key, game){\n    const c = classData(key), layout = validLayout(c.layout) ? c.layout : LAYOUT;\n    return { classKey:key, layout, roster:[...(c.roster||[])], seats:normSeats(c.seats, layout.length),\n      out:{}, seq:0, phase:'lobby', game:game||1, round:0, calls:{}, cur:null };\n  }\n  const PHASES = ['lobby','ready','moving','paused','frozen','rolling','called','ended'];\n  function adopt(d){\n    if(!d || typeof d.classKey !== 'string' || !d.classKey) return null;\n    const layout = validLayout(d.layout) ? d.layout : LAYOUT;\n    let phase = PHASES.includes(d.phase) ? d.phase : 'lobby';\n    let cur = (d.cur && typeof d.cur.q === 'string' && Array.isArray(d.cur.a)) ? d.cur : null;\n    let round = Number(d.round) || 0;\n    const calls = (d.calls && typeof d.calls === 'object') ? { ...d.calls } : {};\n    // A countdown can't survive a reload; that round starts over.\n    if(['moving','paused','frozen','rolling'].includes(phase)){ phase = round > 1 || Object.keys(calls).length ? 'ready' : 'lobby'; round = Math.max(0, round - 1); cur = null; }\n    const out = {};\n    if(d.out && typeof d.out === 'object') Object.keys(d.out).forEach(k => {\n      const v = d.out[k]; if(v && typeof v === 'object' && isFinite(v.s)) out[k] = { s:Number(v.s), r:Number(v.r)||0, t:!!v.t };\n    });\n    return {\n      classKey:d.classKey, layout, roster:Array.isArray(d.roster)?d.roster.filter(x=>typeof x==='string'):[],\n      seats:normSeats(d.seats, layout.length), out, seq:Number(d.seq)||0, phase,\n      game:Number(d.game)||1, round, calls, cur\n    };\n  }\n\n  // ---------- seating chart import ----------\n  // Reads the text from the chart's Export Setup (or the whole chart file) without running it.\n  function parseChartExport(text){\n    const at = text.indexOf('CLASS_DATA');\n    const start = text.indexOf('{', at \u003c 0 ? 0 : at);\n    if(start \u003c 0) throw new Error('missing');\n    let depth = 0, inStr = false, end = -1;\n    for(let i = start; i \u003c text.length; i++){\n      const c = text[i];\n      if(inStr){ if(c === '\\\\') i++; else if(c === '\"') inStr = false; continue; }\n      if(c === '\"') inStr = true;\n      else if(c === '{') depth++;\n      else if(c === '}'){ depth--; if(depth === 0){ end = i; break; } }\n    }\n    if(end \u003c 0) throw new Error('cut off');\n    const body = text.slice(start, end + 1);\n    let out = '';\n    for(let i = 0; i \u003c body.length;){\n      const c = body[i];\n      if(c === '\"'){\n        let j = i + 1;\n        while(j \u003c body.length && body[j] !== '\"'){ if(body[j] === '\\\\') j++; j++; }\n        out += body.slice(i, j + 1); i = j + 1; continue;\n      }\n      if(c === '/' && body[i+1] === '/'){ while(i \u003c body.length && body[i] !== '\\n') i++; continue; }\n      if(/[A-Za-z_$]/.test(c)){\n        let j = i; while(j \u003c body.length && /[\\w$]/.test(body[j])) j++;\n        const word = body.slice(i, j); let k = j; while(/\\s/.test(body[k] || '')) k++;\n        out += body[k] === ':' ? JSON.stringify(word) : word; i = j; continue;\n      }\n      if(c === ','){\n        let k = i + 1; while(/\\s/.test(body[k] || '')) k++;\n        if(body[k] === '}' || body[k] === ']'){ i++; continue; }\n      }\n      out += c; i++;\n    }\n    const raw = JSON.parse(out);\n    const classes = {}, order = [];\n    Object.keys(raw).forEach(key => {\n      const cfg = raw[key];\n      if(!cfg || !Array.isArray(cfg.desks)) return;\n      const dropped = new Set(Array.isArray(cfg.dropped) ? cfg.dropped : []);\n      const desks = cfg.desks.filter(d => d && typeof d.x === 'number' && typeof d.y === 'number');\n      if(!desks.length || desks.length > 120) return;\n      const layout = desks.map(d => [Math.round(d.x), Math.round(d.y)]);\n      const seats = desks.map(d => (typeof d.student === 'string' && d.student.trim() && !dropped.has(d.student)) ? d.student : null);\n      const roster = (Array.isArray(cfg.roster) ? cfg.roster : []).filter(n => typeof n === 'string' && n.trim() && !dropped.has(n));\n      seats.forEach(n => { if(n && !roster.includes(n)) roster.push(n); });\n      classes[key] = { roster, seats, layout };\n      order.push(key);\n    });\n    if(!order.length) throw new Error('no classes');\n    return { classes, order };\n  }\n\n  // ---------- game facts ----------\n  function seatedIdx(G){ return G.seats.map((n,i)=>n?i:-1).filter(i=>i>=0); }\n  function isOut(G,i){ return Object.prototype.hasOwnProperty.call(G.out, String(i)); }\n  function aliveIdx(G){ return seatedIdx(G).filter(i=>!isOut(G,i)); }\n  const isBusy = G => ['ready','moving','paused','frozen','rolling','called'].includes(G.phase);\n  const curCall = G => G.calls[G.round];\n\n  // ---------- sound (made in the browser, no files) ----------\n  let soundOn = store.get('fc306-sound') !== false;\n  let actx = null, master = null;\n  function bus(){\n    if(!master || master.context !== actx){\n      const c = actx.createDynamicsCompressor();\n      c.threshold.value = -8; c.knee.value = 4; c.ratio.value = 20; c.attack.value = 0.001; c.release.value = 0.15;\n      const g = actx.createGain(); g.gain.value = 0.9;\n      c.connect(g); g.connect(actx.destination);\n      master = c;\n    }\n    return master;\n  }\n  function tone(f, t, d, type, v, to){\n    const o = actx.createOscillator(), g = actx.createGain();\n    o.type = type; o.frequency.setValueAtTime(f, t);\n    if(to) o.frequency.exponentialRampToValueAtTime(to, t + d);\n    g.gain.setValueAtTime(0.0001, t);\n    g.gain.exponentialRampToValueAtTime(v, t + 0.01);\n    g.gain.exponentialRampToValueAtTime(0.0001, t + d);\n    o.connect(g); g.connect(bus());\n    o.start(t); o.stop(t + d + 0.05);\n  }\n  // A struck bell: a few slightly out-of-tune overtones that ring and fade.\n  function bell(t, f, v){\n    [[1, 1, 2.2], [2.0, 0.5, 1.6], [2.76, 0.35, 1.1], [5.4, 0.18, 0.5], [8.9, 0.08, 0.25]].forEach(([r, a, d]) => {\n      const o = actx.createOscillator(), g = actx.createGain();\n      o.type = 'sine'; o.frequency.setValueAtTime(f * r, t);\n      g.gain.setValueAtTime(0.0001, t);\n      g.gain.exponentialRampToValueAtTime(v * a, t + 0.005);\n      g.gain.exponentialRampToValueAtTime(0.0001, t + d);\n      o.connect(g); g.connect(bus());\n      o.start(t); o.stop(t + d + 0.05);\n    });\n  }\n  function sfx(kind, force){\n    if(!soundOn && !force) return;\n    try{\n      actx = actx || new (window.AudioContext || window.webkitAudioContext)();\n      if(actx.state === 'suspended') actx.resume();\n      const t = actx.currentTime + 0.01;\n      if(kind === 'tick'){ tone(1000, t, 0.06, 'square', 0.22); }\n      else if(kind === 'tickHi'){ tone(1500, t, 0.09, 'square', 0.28); tone(3000, t, 0.03, 'sine', 0.15); }\n      else if(kind === 'go'){ tone(523, t, 0.1, 'triangle', 0.25); tone(784, t + 0.1, 0.18, 'triangle', 0.25); }\n      else if(kind === 'freeze'){ bell(t, 523, 0.3); bell(t + 0.32, 523, 0.3); }\n      else if(kind === 'roll'){ tone(880, t, 0.04, 'triangle', 0.2); }\n      else if(kind === 'called'){ tone(196, t, 0.6, 'sine', 0.45, 98); tone(392, t, 0.12, 'square', 0.18); tone(587, t + 0.12, 0.35, 'triangle', 0.22); }\n      else if(kind === 'right'){ [523, 659, 784].forEach((f, i) => tone(f, t + i * 0.1, 0.22, 'triangle', 0.25)); }\n      else if(kind === 'out'){ tone(300, t, 0.28, 'triangle', 0.35, 110); tone(150, t, 0.2, 'sine', 0.25, 70); }\n      else if(kind === 'back'){ tone(440, t, 0.1, 'sine', 0.22); tone(660, t + 0.09, 0.14, 'sine', 0.22); }\n      else if(kind === 'pause'){ tone(523, t, 0.12, 'sine', 0.2); tone(392, t + 0.12, 0.18, 'sine', 0.2); }\n      else if(kind === 'resume'){ tone(392, t, 0.1, 'sine', 0.2); tone(523, t + 0.1, 0.14, 'sine', 0.2); }\n      else if(kind === 'win'){ [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * 0.12, i === 3 ? 0.5 : 0.22, 'triangle', 0.25)); }\n    }catch(e){}\n  }\n\n  // ================= GAME =================\n  let G = adopt(store.get('fc306-game'));\n  if(!G){ const keys = classKeys(); G = freshGame(keys.includes('p3: HSB27') ? 'p3: HSB27' : keys[0]); }\n  function save(){ store.set('fc306-game', G); }\n  let lit = -1;          // corner lit up during the roll (not saved)\n  let cardOpen = false;  // quiz card showing after the answer is revealed\n  const T = { endAt:0, left:0, raf:0, lastSec:-1, timers:[] };\n  function later(fn, ms){ T.timers.push(setTimeout(fn, ms)); }\n  function stopAll(){\n    if(T.raf){ cancelAnimationFrame(T.raf); T.raf = 0; }\n    T.timers.forEach(clearTimeout); T.timers = []; lit = -1;\n  }\n\n  // ---- class select ----\n  const sel = $('#classSelect');\n  let selKeys = '';\n  function fillClassSelect(){\n    const keys = classKeys();\n    if(!keys.includes(G.classKey)) keys.push(G.classKey);\n    const sig = JSON.stringify(keys);\n    if(sig === selKeys) return;\n    selKeys = sig; sel.innerHTML = '';\n    keys.forEach(k => { const o=document.createElement('option'); o.value=k; o.textContent=k; sel.appendChild(o); });\n  }\n  sel.addEventListener('change', () => { stopAll(); cardOpen = false; G = freshGame(sel.value, 1); render(); save(); });\n\n  // ---- room map ----\n  const stage = $('#stage'), map = $('#map');\n  let layoutSig = '', seatEls = [], cornerEls = [], B = boundsOf(LAYOUT);\n  function buildMap(){\n    const L = G.layout, sig = JSON.stringify(L);\n    if(sig === layoutSig) return;\n    layoutSig = sig; B = boundsOf(L); map.innerHTML = '';\n    map.style.width = B.w + 'px'; map.style.height = B.h + 'px';\n    const place = (el, x, y, w, h) => { el.style.left=(x-B.minX)+'px'; el.style.top=(y-B.minY)+'px'; if(w){ el.style.width=w+'px'; el.style.height=h+'px'; } };\n\n    const teacher = document.createElement('div');\n    teacher.className = 'teacher-desk';\n    place(teacher, TEACHER_DESK.x, TEACHER_DESK.y, TEACHER_DESK.w, TEACHER_DESK.h);\n    teacher.innerHTML = MONITOR_SVG + '\u003cspan>Teacher Desk\u003c/span>';\n    map.appendChild(teacher);\n\n    const caller = document.createElement('button');\n    caller.className = 'caller off'; caller.id = 'caller';\n    place(caller, CALLER_BOX.x, CALLER_BOX.y, CALLER_BOX.w, CALLER_BOX.h);\n    caller.innerHTML = gridSVG('grid4') + '\u003cspan class=\"caller-info\">\u003cspan class=\"caller-lbl\">\u003c/span>\u003cspan class=\"caller-big\">Ready\u003c/span>\u003cspan class=\"caller-hint\">\u003c/span>\u003c/span>';\n    caller.addEventListener('click', () => { if(['lobby','ready','moving','paused'].includes(G.phase)) .showModal();\n  });\n  $('#seatsCancel').addEventListener('click', () => dlg.close());\n  function readNames(){\n    const seen = new Set();\n    return $('#rosterText').value.split('\\n').map(s=>s.trim()).filter(s => s && !seen.has(s.toLowerCase()) && seen.add(s.toLowerCase()));\n  }\n  function applySeats(names, seats){\n    const extra = names.filter(n => !seats.includes(n));\n    stopAll(); cardOpen = false;\n    G.roster = names; G.seats = seats; G.out = {}; G.seq = 0; G.phase = 'lobby'; G.round = 0; G.calls = {}; G.cur = null;\n    saveClassData(G.classKey, { roster:names, seats, layout:G.layout });\n    dlg.close(); render(); save();\n    if(extra.length) toast(extra.length + (extra.length===1?' student has':' students have') + ' no desk. Add a desk in the seating chart.');\n  }\n  $('#seatsFill').addEventListener('click', () => {\n    const names = readNames();\n    const seats = G.seats.map(n => n && names.includes(n) ? n : null);\n    const waiting = names.filter(n => !seats.includes(n));\n    fillOrder(seats.length).forEach(i => { if(!seats[i] && waiting.length) seats[i] = waiting.shift(); });\n    applySeats(names, seats);\n  });\n  $('#seatsShuffle').addEventListener('click', () => {\n    const names = readNames(), mixed = shuffle(names), seats = Array(G.layout.length).fill(null);\n    fillOrder(seats.length).forEach((i,k) => { if(mixed[k]) seats[i] = mixed[k]; });\n    applySeats(names, seats);\n  });\n\n  // ---- import from seating chart ----\n  const idlg = $('#importDialog'), ierr = $('#importErr');\n  $('#importBtn').addEventListener('click', () => { $('#importText').value = ''; ierr.hidden = true; idlg.showModal(); $('#importText').focus(); });\n  $('#importCancel').addEventListener('click', () => idlg.close());\n  $('#importConfirm').addEventListener('click', () => {\n    const text = $('#importText').value.trim();\n    if(!text){ ierr.textContent = 'Paste the text from the seating chart’s Export Setup first.'; ierr.hidden = false; return; }\n    let data;\n    try{ data = parseChartExport(text); }\n    catch(e){\n      ierr.textContent = 'That doesn’t look like a seating chart export. In the chart, click Export Setup, then Copy to Clipboard, and paste all of it here.';\n      ierr.hidden = false; return;\n    }\n    store.set('fc306-classes', data.classes);\n    store.set('fc306-class-order', data.order);\n    const sameClass = data.order.includes(G.classKey);\n    const key = sameClass ? G.classKey : data.order[0];\n    stopAll(); cardOpen = false;\n    G = freshGame(key, sameClass ? G.game : 1);\n    idlg.close(); render(); save();\n    toast('Imported ' + data.order.length + (data.order.length === 1 ? ' class' : ' classes') + '. ' + G.seats.filter(Boolean).length + ' students seated in ' + key + '.');\n  });\n\n  // ---- drawing ----\n  function drawCorners(){\n    const call = G.phase === 'called' ? curCall(G) : null;\n    const showAnswers = !!G.cur && ['moving','paused','frozen','called'].includes(G.phase);\n    cornerEls.forEach((el, c) => {\n      let cls = 'corner';\n      if(G.phase === 'rolling' && lit === c) cls += ' lit';\n      if(call){\n        if(call.quiz) cls += c === call.c ? ' right' : (G.cur && G.cur.a[c] ? ' wrong' : ' unused');\n        else cls += c === call.c ? ' called' : ' dim';\n      } else if(showAnswers && !G.cur.a[c]) cls += ' unused';\n      if(el.className !== cls) el.className = cls;\n      el.querySelector('.cl').textContent = seated() ? (c ? 'fingers' : 'finger') : (S.names[c] || 'Corner');\n      el.querySelector('.ca').textContent = showAnswers ? (G.cur.a[c] || 'Not used') : '';\n      el.setAttribute('aria-label', cornerFull(c) + (showAnswers && G.cur.a[c] ? ': ' + G.cur.a[c] : ''));\n    });\n  }\n  function drawCaller(){\n    const el = document.getElementById('caller');\n    if(!el) return;\n    const call = curCall(G);\n    let cls = 'caller', lbl = '', big = 'Ready', hint = '', num = false, pick = -1;\n    el.style.removeProperty('--fc');\n    switch(G.phase){\n      case 'lobby': lbl = 'Four Corners'; hint = 'Space or click to start round 1'; break;\n      case 'ready': lbl = 'Round ' + (G.round + 1); hint = 'Space or click to start the countdown'; break;\n      case 'moving': {\n        const s = Math.ceil(secsLeft());\n        lbl = seated() ? (G.cur ? 'Pick your answer' : 'Pick a number') : (G.cur ? 'Go to your answer' : 'Get to a corner'); big = String(s); num = true;\n        if(s \u003c= 3) cls += ' urgent';\n        hint = 'Space or click to pause'; break;\n      }\n      case 'paused': cls += ' paused'; lbl = 'Paused'; big = String(Math.ceil(secsLeft())); num = true; hint = 'Space or click to resume'; break;\n      case 'frozen': cls += ' frozen'; lbl = 'Time’s up'; big = seated() ? 'Hands up!' : 'Freeze!'; hint = G.cur ? 'Here comes the answer' : 'Calling a corner'; break;\n      case 'rolling': lbl = 'Calling a corner'; big = lit >= 0 ? String(lit + 1) : '…'; num = true; pick = lit;\n        if(lit >= 0) el.style.setProperty('--fc', 'var(--c' + (lit+1) + ')'); hint = seated() ? 'Hold your number up' : 'Stay frozen'; break;\n      case 'called':\n        if(call){\n          pick = call.c; num = true; big = String(call.c + 1);\n          el.style.setProperty('--fc', 'var(--c' + (call.c+1) + ')');\n          if(seated()){\n            lbl = call.quiz ? 'Right answer: number' : 'Number out';\n            hint = call.quiz ? 'Click everyone who showed a wrong number' : 'Click everyone showing ' + (call.c + 1);\n          } else {\n            lbl = call.quiz ? 'Right answer: corner' : (S.names[call.c] ? S.names[call.c] + ' is out' : 'Corner out');\n            hint = call.quiz ? 'Click everyone in a wrong corner' : 'Click everyone standing there';\n          }\n        }\n        break;\n      case 'ended': cls += ' off'; lbl = 'Game ' + G.game; big = 'Done'; hint = 'New game to play again'; break;\n    }\n    if(pick >= 0) cls += ' has-pick';\n    if(el.className !== cls) el.className = cls;\n    el.querySelector '\u003c/span>' : '') + esc(a || '—') + '\u003c/span>\u003c/div>';\n    }).join('');\n    $('#qBtns').hidden = !call;\n    drawCardTime();\n  }\n  function callLabel(r){\n    const call = G.calls[r];\n    if(!call) return 'Round ' + r;\n    return 'Round ' + r + ', ' + (call.quiz ? 'answer was ' : '') + cornerFull(call.c);\n  }\n\n  // ---- render ----\n  function render(){\n    fillClassSelect(); buildMap();\n    sel.value = G.classKey;\n    const alive = aliveIdx(G), seatedN = seatedIdx(G).length;\n    const winner = G.phase === 'ended' && alive.length === 1 ? alive[0] : -1;\n    const busy = isBusy(G), call = curCall(G);\n    const picking = G.phase === 'called' && !cardOpen;\n\n    map.classList.toggle('picking', picking);\n    if(picking && call && !call.quiz) map.style.setProperty('--pick', 'var(--c' + (call.c+1) + ')');\n    else map.style.removeProperty('--pick');\n    seatEls.forEach((el, i) => {\n      const name = G.seats[i], o = name && isOut(G,i) ? G.out[String(i)] : null;\n      el.className = 'seat' + (name ? ' occupied' : '') + (o ? ' out' : '') + (i === winner ? ' winner' : '');\n      el.innerHTML = (name ? '\u003cspan class=\"np\">' + plateHTML(name) + '\u003c/span>' : MONITOR_SVG) +\n        '\u003cspan class=\"num\">' + pad2(i+1) + '\u003c/span>';\n      el.removeAttribute('data-c');\n      if(!name){ el.setAttribute('aria-label', 'Desk ' + (i+1) + ', open seat'); el.tabIndex = -1; el.removeAttribute('title'); return; }\n      el.tabIndex = 0; el.title = name;\n      if(o){\n        const tag = document.createElement('span'); tag.className = 'tag';\n        const oc = G.calls[o.r];\n        if(!o.t && oc && !oc.quiz){ tag.textContent = oc.c + 1; tag.style.setProperty('--tc', 'var(--c' + (oc.c+1) + ')'); tag.style.setProperty('--to', oc.c === 1 ? '#121212' : '#fff'); }\n        else tag.textContent = 'R' + o.r;\n        el.appendChild(tag);\n      }\n      el.setAttribute('aria-label', 'Desk ' + (i+1) + ', ' + name + (o ? ', out. Click to bring back.' : picking ? ', in. Click if they’re out.' : ', in.'));\n    });\n    fitNames(map);\n    drawCorners();\n\n    // status\n    $('#status').className = 'status ' + G.phase;\n    $('#statusText').textContent = 'Game ' + G.game + ', ' + {\n      lobby:'waiting to start', ready:'ready for round ' + (G.round + 1), moving:'round ' + G.round + (seated() ? ', pick a number' : ', get to a corner'),\n      paused:'paused', frozen:seated() ? 'hands up!' : 'freeze!', rolling:'calling a corner', called:'round ' + G.round + ', marking who’s out', ended:'over'\n    }[G.phase];\n\n    // buttons (top bar and fullscreen bar)\n    const goLabel = {\n      lobby:'Start game', ready:'▶ Start round', moving:'Pause', paused:'Resume',\n      called: cardOpen ? 'Mark who’s out' : '▶ Next round'\n    }[G.phase];\n    $$('[data-act=\"go\"]').forEach(b => {\n      b.hidden = !goLabel; if(goLabel) b.textContent = goLabel;\n      b.classList.toggle('primary', G.phase !== 'moving');\n    });\n    $$('.rules-foot [data-act=\"go\"]').forEach(b => b.hidden = G.phase !== 'lobby');\n    $('#rulesClose').textContent = G.phase === 'lobby' ? 'Back to the room' : 'Back to the game';\n    $('#rules .hint').hidden = G.phase !== 'lobby';\n    $$('[data-act=\"now\"]').forEach(b => b.hidden = !(G.phase === 'moving' || G.phase === 'paused'));\n    $$('[data-act=\"end\"]').forEach(b => b.hidden = !busy);\n    $$('[data-act=\"restart\"]').forEach(b => { b.hidden = G.phase === 'lobby'; b.classList.toggle('primary', G.phase === 'ended'); });\n    $$('[data-act=\"undo\"]').forEach(b => { b.hidden = G.phase === 'lobby'; b.disabled = !Object.keys(G.out).length; });\n    $('#seatsBtn').disabled = $('#importBtn').disabled = busy;\n    $('#seatsBtn').title = $('#importBtn').title = busy ? 'End the game first' : '';\n    $('#settingsBtn').disabled = ['moving','paused','frozen','rolling'].includes(G.phase) || (G.phase === 'called' && !!G.cur);\n    sel.disabled = busy;\n\n    // banner\n    const ban = $('#banner'), present = host.classList.contains('present');\n    ban.style.removeProperty('--bc');\n    const showBan = (cls, text) => { ban.hidden = false; ban.className = 'banner' + (cls ? ' ' + cls : ''); ban.textContent = text; };\n    if(winner >= 0) showBan('win', G.seats[winner] + ' wins game ' + G.game + '!');\n    else if(G.phase === 'ended') showBan('', 'Game over. ' + alive.length + ' made it to the end.');\n    else if(G.phase === 'called' && call && !cardOpen){\n      ban.style.setProperty('--bc', 'var(--c' + (call.c+1) + ')');\n      showBan('big', call.quiz\n        ? 'The answer was ' + (seated() ? 'number ' : 'corner ') + (call.c+1) + (G.cur && G.cur.a[call.c] ? ': ' + G.cur.a[call.c] : '') + (seated() ? '. Wrong numbers are out.' : '. Wrong corners are out.')\n        : seated() ? 'Everyone showing ' + (call.c+1) + ' is out!' : cornerFull(call.c) + ' is out!');\n    }\n    else if(G.phase === 'frozen' && !G.cur) showBan('big', seated() ? 'Hands up! Hold your number still.' : 'Freeze! No switching.');\n    else if(G.phase === 'paused' && !G.cur) showBan('', seated() ? 'Paused. Keep your number hidden.' : 'Paused. Stop where you are.');\n    else if(G.phase === 'moving' && !G.cur && alive.length \u003c= 4 && seatedN > 4) showBan('', 'Final ' + alive.length + '. ' + (seated() ? 'Pick your number.' : 'Pick your corner.'));\n    else if(G.phase === 'ready' && present) showBan('', 'Get ready for round ' + (G.round + 1) + '.');\n    else if(G.phase === 'lobby' && present) showBan('', 'Game ' + G.game + '. Get ready.');\n    else ban.hidden = true;\n\n    // side panel\n    $('#aliveCount').textContent = alive.length;\n    $('#aliveLabel').textContent = 'still in, of ' + seatedN;\n    $('#modeChip').innerHTML = 'Students: \u003cb>' + (seated() ? 'stay seated' : 'walk to corners') + '\u003c/b>\u003cbr>Mode: \u003cb>' + (S.mode === 'quiz' ? 'quiz corners' : 'classic') + '\u003c/b>\u003cbr>Countdown: \u003cb>' + S.secs + ' seconds\u003c/b>';\n    const groups = {};\n    Object.keys(G.out).forEach(k => {\n      const o = G.out[k]; if(!G.seats[k]) return;\n      const key = o.r + (o.t ? 't' : 'c');\n      (groups[key] = groups[key] || { r:o.r, t:o.t, s:0, names:[] });\n      groups[key].names.push(G.seats[k]); groups[key].s = Math.max(groups[key].s, o.s);\n    });\n    const list = $('#callLog'); list.innerHTML = '';\n    Object.values(groups).sort((a,b) => b.s - a.s).forEach(g => {\n      const li = document.createElement('li');\n      const oc = G.calls[g.r];\n      if(!g.t && oc) li.dataset.c = oc.c;\n      const h = document.createElement('span'); h.className = 'ch';\n      h.textContent = g.t ? 'Round ' + g.r + ', teacher’s call' : callLabel(g.r);\n      const n = document.createElement('span'); n.className = 'cnames';\n      n.textContent = g.names.map(shortName).join(', ');\n      li.append(h, n); list.appendChild(li);\n    });\n    const outN = Object.keys(G.out).filter(k => G.seats[k]).length;\n    $('#outEmpty').hidden = outN > 0;\n    $('#outCount').textContent = '(' + outN + ' out)';\n\n    // fullscreen bar\n    $('#dClass').textContent = G.classKey;\n    $('#dRound').textContent = G.round || '—';\n    $('#dAlive').textContent = alive.length;\n    $('#dOf').textContent = '/ ' + seatedN;\n    const lastR = Object.keys(G.calls).map(Number).sort((a,b)=>b-a)[0];\n    $('#dLast').textContent = lastR ? cornerFull(G.calls[lastR].c) : '—';\n\n    renderCard();\n    drawCaller();\n    requestAnimationFrame(fit);\n  }\n\n  renderRules();\n  render();\n  if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitNames(map));\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "306_Hot_Potato.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>306 Hot Potato\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"
